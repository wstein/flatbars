# SPDX-License-Identifier: Apache-2.0
#
# Trussbars CI — the Rust workspace that the MaxBars→Rust compiler targets
# (`trussbars/`). Needs a Rust toolchain (cargo/rustc/clippy/rustfmt), which the
# Node-based `npm test` does not provide, so it runs here. Path-filtered to the
# Rust surface so it only fires when something it covers changes.
#
# The toolchain is pinned by `trussbars/rust-toolchain.toml` (1.96.0 + rustfmt +
# clippy); running cargo inside `trussbars/` makes rustup install and select it,
# so CI builds with exactly the version developers and the conformance harness use.
name: Trussbars

on:
  push:
    branches: [develop]
    paths: &trussbars-paths
      - "trussbars/**"
      - ".github/workflows/trussbars.yml"
  pull_request:
    paths: *trussbars-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trussbars-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trussbars
    steps:
      - uses: actions/checkout@v6

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            trussbars/target
          key: cargo-${{ runner.os }}-${{ hashFiles('trussbars/Cargo.lock', 'trussbars/rust-toolchain.toml') }}

      # Reading rust-toolchain.toml here installs and selects the pinned channel.
      - name: Toolchain
        run: rustup show && cargo --version && cargo clippy --version

      - name: Format
        run: cargo fmt --all -- --check

      # Two profiles, both gated: the default best-in-class build (itoa +
      # dragonbox_ecma, ECMA-byte-identical floats) and the pure, zero-dependency,
      # forbid(unsafe) build (f64 = Rust Display). The pure profile keeps the `std`
      # feature here so the test harness links (bare `--no-default-features` is
      # no_std — covered build-only by the `no-std` job below).
      - name: Clippy (perf)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (pure)
        run: cargo clippy --all-targets --no-default-features --features std -- -D warnings

      - name: Test (perf + derive)
        run: cargo test --all-features

      - name: Test (pure)
        run: cargo test --no-default-features --features std

  # The no_std proof: build the no_std-capable crates for a bare-metal target (no std
  # to link against). `trussbars-core` builds pure and full `perf`; the front-end
  # `trussbars-template` (parse path) and BOTH dynamic backends — the tree-walk
  # `trussbars-interp` and the bytecode `trussbars-vm` — build their libs
  # `--no-default-features` (`--lib`: the dev CLIs and `#[test]` need the std harness,
  # which runs in the `check` job).
  no-std:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trussbars
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain + bare-metal target
        run: rustup show && rustup target add thumbv7em-none-eabi
      - name: Build no_std (core, pure)
        run: cargo build -p trussbars-core --no-default-features --target thumbv7em-none-eabi
      - name: Build no_std (core, perf — itoa + dragonbox_ecma)
        run: cargo build -p trussbars-core --no-default-features --features perf --target thumbv7em-none-eabi
      - name: Build no_std (template parse path)
        run: cargo build -p trussbars-template --lib --no-default-features --target thumbv7em-none-eabi
      - name: Build no_std (interpreter)
        run: cargo build -p trussbars-interp --lib --no-default-features --target thumbv7em-none-eabi
      - name: Build no_std (bytecode VM)
        run: cargo build -p trussbars-vm --lib --no-default-features --target thumbv7em-none-eabi

  # The perf-regression ratchet: a separate workspace (it pulls handlebars/askama/
  # sailfish/liquid), run in release. The `Perf-regression gate` step asserts the
  # machine-independent relative invariants (Trussbars <= Askama, << handlebars); the
  # `Benchmark` step then runs criterion to publish the *canonical, CI-stamped*
  # medians (one consistent runner class, not a contributor's laptop) to the job
  # summary + an artifact. The bench is informational only — it never fails the build
  # (CI runners are noisy), so it does not double as the regression gate.
  benchmarks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trussbars/benchmarks
    steps:
      - uses: actions/checkout@v6
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            trussbars/benchmarks/target
          key: trussbars-bench-${{ runner.os }}-${{ hashFiles('trussbars/benchmarks/Cargo.lock') }}
      - name: Toolchain
        run: rustup show && cargo --version
      - name: Perf-regression gate
        run: cargo test --release
      - name: Benchmark (canonical CI-stamped medians)
        run: |
          cargo bench --bench render -- \
            --warm-up-time 1 --measurement-time 2 --sample-size 30 \
            | tee bench-render.txt
          {
            echo "### Trussbars render benchmark — canonical CI medians"
            echo ""
            echo "Runner: \`${{ runner.os }}\` · ref \`${{ github.sha }}\`. Indicative (CI"
            echo "runners are shared); the README table is a contributor-machine snapshot."
            echo ""
            echo '```'
            grep -E 'time:' bench-render.txt || echo "(no medians captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark medians
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trussbars-bench-render-medians
          path: trussbars/benchmarks/bench-render.txt
          if-no-files-found: warn

  # The dogfood examples: build each and assert its pages still match the committed
  # golden output (no PureScript toolchain needed — the generated render module is
  # committed). `blog` = authored content; `changelog` = git-log aggregation;
  # `lab` = the dynamic-VM mini-Lab (the VM northstar — runtime render + i18n host
  # helpers; its golden gate is the {sample × locale × mode} matrix); `i18n-data` = the
  # unified-i18n reference (compile-time helpers over a YAML-fetched data catalog; AOT≡VM
  # parity test); `i18n-fluent` = the real-Fluent recipe (i18n-embed) — heavier external
  # deps, kept in its own workspace so they never reach the no_std core, but gated here so
  # the recipe can't rot (cargo fetches its crates.io deps; cached by its Cargo.lock).
  # `truthiness` = the selectable-policy reference (docs/16): AOT `truss!(truthiness=…)`,
  # the VM `with_truthiness`, and a host-defined policy over a foreign type — all asserted.
  examples:
    runs-on: ubuntu-latest
    strategy:
      # Each example is an independent workspace, so don't let one failing example
      # cancel the others — report every example's status in a single run.
      fail-fast: false
      matrix:
        example: [blog, changelog, lab, i18n-data, i18n-fluent, truthiness]
    defaults:
      run:
        working-directory: trussbars/examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v6
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            trussbars/examples/${{ matrix.example }}/target
          key: trussbars-example-${{ matrix.example }}-${{ runner.os }}-${{ hashFiles(format('trussbars/examples/{0}/Cargo.lock', matrix.example)) }}
      - name: Toolchain
        run: rustup show && cargo --version
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Golden gate
        run: cargo test
