# SPDX-License-Identifier: Apache-2.0
#
# Trussbars cross-language conformance gate (docs/04). Unlike `trussbars.yml`
# (Rust-only, the runtime crates), this needs BOTH toolchains: the PureScript
# engine (the interpreter ORACLE + the MaxBars->Rust emitter, built by `spago
# build` via the npm-provisioned toolchain) AND cargo (the generated crate the
# harness builds and runs). So it is its own, heavier job.
#
# Renders each corpus case through the interpreter and the emitted Rust and
# asserts byte-identity (floats strict, via the default ecma-float backend),
# checking the live interpreter against the committed golden snapshots too — so an
# oracle drift is a distinct, reported failure, not misattributed to Rust.
name: Trussbars conformance

on:
  push:
    branches: [develop]
  pull_request:
    paths: &paths
      - "trussbars/**"
      - "packages/maxbars/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/trussbars-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trussbars-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci # provisions purescript + spago

      # The harness invokes `cargo +1.96.0` for the generated crate.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: trussbars-conf-cargo-${{ runner.os }}-${{ hashFiles('trussbars/Cargo.lock') }}

      # `spago build` (the interpreter + emitter) then renders + diffs every case.
      - name: Conformance gate (v1 emit ≡ oracle)
        run: npm run test:trussbars-conformance

      # The v2 Rust pipeline (`truss-emit`) must hit the SAME byte-for-byte golden
      # as the v1 emitter — including the standalone-whitespace corpus cases.
      - name: v2 emit gate (v2 ≡ v1, byte-identical)
        run: npm run test:trussbars-v2

      # The VM backend (`truss-vm`): the lenient tree-walk renders the corpus, and
      # AOT-compat (strict) mode is a verifying proxy for the AOT subset.
      - name: VM gates (tree-walk + AOT-compat proxy)
        run: npm run test:trussbars-vm && npm run test:trussbars-vm-compat

      # The AOT-compat drift gate: the PureScript Lab lint (`MaxBars.Compat`, the
      # FlatBars Studio Trussbars panel) must agree with the Rust `render_compat`
      # verifying proxy on every case — so the lint can never mislabel a template.
      - name: AOT-compat drift gate (PureScript lint ⇔ Rust render_compat)
        run: npm run check:trussbars-compat
