# SPDX-License-Identifier: Apache-2.0
#
# Deploy the Astro tutorials site + the static FlatBars Lab to GitHub Pages, under
# one origin (the Lab at /lab/), as a project page: https://wstein.github.io/flatbars/.
#
# The site is built under the /flatbars sub-path (PUBLIC_BASE_PATH); astro.config
# normalises the hand-written root-absolute links to that base, and PUBLIC_LAB_URL
# bakes the based Lab URL into the runnable-example island. The Lab is plain static
# files (relative paths), copied into dist/lab/ so it serves at /flatbars/lab/.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source = GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Least-privilege token for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the Astro build imports the committed engine bundle and
          # the Lab from ../lab; Antora's git content aggregator (url: .) reads the
          # spec from HEAD and is unhappy with a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tutorials/package-lock.json

      - name: Build the Antora spec site (themed via docs/supplemental-ui)
        run: npx --yes antora@3.1.15 --fetch antora-playbook.yml
        # Outputs ./build/site (component pages under build/site/flatbars/…).

      - name: Install tutorials dependencies
        working-directory: tutorials
        run: npm ci

      - name: Build the site under the Pages sub-path, then bundle the Lab + spec
        working-directory: tutorials
        env:
          PUBLIC_BASE_PATH: /flatbars
          PUBLIC_SITE: https://wstein.github.io
          PUBLIC_LAB_URL: /flatbars/lab/index.html
          # The Antora spec lives under the component path inside dist/spec, so its
          # ADR pages resolve at /flatbars/spec/flatbars/<name>.html.
          PUBLIC_SPEC_BASE: /flatbars/spec/flatbars/
        run: |
          npm run build
          cp -R ../lab dist/lab
          cp -R ../build/site dist/spec
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: tutorials/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
