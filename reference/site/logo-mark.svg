<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BareBars">
  <title>BareBars</title>
  <!-- graphite plate -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="#1A1813"/>
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="12.25" fill="none" stroke="#3C3833" stroke-width="1.5"/>
  <!-- blueprint baseline rule + end ticks (engineering drawing) -->
  <g stroke="#6B655B" stroke-width="1">
    <line x1="14" y1="47.5" x2="50" y2="47.5"/>
    <line x1="14" y1="44.5" x2="14" y2="50.5"/>
    <line x1="50" y1="44.5" x2="50" y2="50.5"/>
  </g>
  <!-- bare rods: a valley toward the centre = the empty {{{ }}} slot -->
  <g fill="#EDE7D9">
    <rect x="15.5" y="18" width="3" height="28" rx="1.5"/>
    <rect x="20.5" y="20" width="3" height="26" rx="1.5"/>
    <rect x="25.5" y="24" width="3" height="22" rx="1.5"/>
    <!-- centre rod = the value, in safety orange, set slightly proud -->
    <rect x="30.5" y="28" width="3" height="18" rx="1.5" fill="#F2541B"/>
    <rect x="35.5" y="24" width="3" height="22" rx="1.5"/>
    <rect x="40.5" y="20" width="3" height="26" rx="1.5"/>
    <rect x="45.5" y="18" width="3" height="28" rx="1.5"/>
  </g>
</svg>
