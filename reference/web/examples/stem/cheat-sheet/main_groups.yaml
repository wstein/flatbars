- name: default
  pill: "always on"
  desc: "Output helpers, serialisation, collection access, predicates. Enabled with no opt-in."
  categories: [minimum, predicates]
  overrides:
    at:
      example: "{{at items 0}}"
    contains:
      example: '{{contains tags "featured"}}'
    default:
      example: '{{default missing "N/A"}}'
    drop:
      example: '{{join (drop items 3) ", "}}'
    empty:
      example: "{{empty missing}}"
    escape_html:
      example: "{{escape_html unsafe}}"
      result: "&lt;script&gt;alert(&#39;xss&#39;)&lt;/script&gt;"
    escape_json:
      example: "{{escape_json quote}}"
      result: 'say \"hello\" to everyone'
    first:
      example: "{{first items}}"
    join:
      example: '{{join items ", "}}'
    json:
      example: "{{json data}}"
    last:
      example: "{{last items}}"
    len:
      example: "{{len items}} items"
    lookup:
      - example: '{{lookup data "host"}}'
      - example: "{{lookup items 2}}"
        desc: "Look up by zero-based index in a list."
    slice:
      example: '{{join (slice items 1 3) ", "}}'
    take:
      example: '{{join (take items 3) ", "}}'

- name: format
  pill: "low risk"
  desc: "Low risk — atomic string transforms that cannot iterate or recurse."
  categories: [strings]
  overrides:
    capitalize:
      example: "{{capitalize title}}"
    ends_with:
      example: '{{ends_with file ".stem"}}'
    replace:
      example: '{{replace title "quick" "lazy"}}'
    split:
      example: '{{join (split path "/") "-"}}'
    starts_with:
      example: '{{starts_with title "the"}}'
    trim:
      example: "{{trim str}}"
    truncate:
      example: '{{truncate blurb 20 "…"}}'
    upcase:
      example: "{{upcase name}}"

- name: transform
  pill: "medium risk · audited"
  desc: "Medium risk — full-collection traversals. Loading the group emits a one-shot audit event."
  callout: "Loading this group emits a one-shot audit event on load."
  categories: [collections]
  overrides:
    compact:
      example: '{{join (compact sparse) ", "}}'
    dict:
      example: '{{json (dict "a" 1 "b" 2)}}'
    filter:
      example: '{{join (map (filter people "lead") "name") ", "}}'
    flatten:
      example: '{{join (flatten nested) ", "}}'
    group_by:
      example: '{{json (group_by people "dept")}}'
    list:
      example: '{{join (list "a" "b" "c") ", "}}'
    map:
      example: '{{join (map people "name") ", "}}'
    sort:
      example: '{{join (sort items) ", "}}'
    sort_by:
      example: '{{join (map (sort_by people "age") "name") ", "}}'
    uniq:
      example: '{{join (sort (uniq items)) ", "}}'

