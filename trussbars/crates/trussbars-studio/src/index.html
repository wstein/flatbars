<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trussbars Studio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<style>
  :root { --bg:#1b1d23; --panel:#23262e; --fg:#e6e6e6; --dim:#9aa0ab; --accent:#a78bfa; --hi:#3b2f57; --ok:#4ade80; --err:#f87171; --warn:#fbbf24; --border:#343843; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header { padding:.5rem 1rem; background:var(--panel); border-bottom:1px solid var(--border); display:flex; gap:1rem; align-items:center; }
  header b { color:var(--accent); }
  header .grow { flex:1; }
  #layout { flex:1; display:flex; min-height:0; }
  aside { width:210px; background:var(--panel); border-right:1px solid var(--border); overflow:auto; padding:.5rem; }
  aside h4 { color:var(--dim); margin:.5rem .25rem; font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:.05em; }
  aside .f { padding:.2rem .4rem; cursor:pointer; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  aside .f:hover { background:var(--hi); }
  aside .f.active { background:var(--accent); color:#1b1d23; }
  main { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--border); min-width:0; }
  .col { background:var(--bg); display:flex; flex-direction:column; min-height:0; min-width:0; }
  .bar { padding:.35rem .6rem; background:var(--panel); border-bottom:1px solid var(--border); display:flex; gap:.5rem; align-items:center; }
  .bar .grow { flex:1; }
  button, select { background:#2c3038; color:var(--fg); border:1px solid var(--border); border-radius:4px; padding:.2rem .5rem; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #editwrap { flex:1; min-height:0; display:flex; }
  .CodeMirror { flex:1; height:auto; font:inherit; }
  .CodeMirror-gutters { background:#23262e; border-right:1px solid var(--border); }
  .diag-err { color:var(--err); }
  .diag-warn { color:var(--warn); }
  .pane { flex:1; display:flex; flex-direction:column; min-height:0; border-bottom:1px solid var(--border); }
  .pane:last-child { border-bottom:0; }
  .pane h3 { margin:0; padding:.35rem .6rem; background:var(--panel); border-bottom:1px solid var(--border); font-size:12px; color:var(--dim); display:flex; gap:.5rem; }
  .pane .body { flex:1; overflow:auto; padding:.6rem; white-space:pre-wrap; word-break:break-word; }
  pre.body { margin:0; }
  .interp { background:var(--hi); border-radius:3px; outline:1px solid var(--accent); cursor:help; }
  .rtile { border-radius:3px; cursor:help; }
  .link-hi { background:var(--accent) !important; color:#1b1d23 !important; outline:2px solid var(--accent) !important; }
  .verdict.ok { color:var(--ok); }
  .verdict.err { color:var(--err); }
  #ctx { padding:.4rem .6rem; background:var(--panel); border-top:1px solid var(--border); color:var(--dim); white-space:pre-wrap; max-height:25%; overflow:auto; }
  #ctx b { color:var(--accent); }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; background:var(--ok); }
  .dot.dirty { background:var(--warn); }
</style>
</head>
<body>
<header><b>Trussbars</b> Studio <span class="grow"></span><span id="status" style="color:var(--dim)"></span></header>
<div id="layout">
  <aside>
    <h4>Templates</h4><div id="templates"></div>
    <h4>Data</h4><div id="datafiles"></div>
  </aside>
  <main>
    <div class="col">
      <div class="bar"><span class="dot" id="dot" title="saved"></span><span id="path" style="color:var(--dim)">template</span><span class="grow"></span><button id="save">Save (⌘S)</button></div>
      <div id="editwrap"></div>
      <div id="ctx"><b>context</b> — hover an interpolation to see <code>this</code></div>
    </div>
    <div class="col">
      <div class="pane"><h3>Output <span id="verdict" class="verdict"></span></h3><div class="body" id="output"></div></div>
      <div class="pane"><h3>Emitted Rust (AOT)</h3><pre class="body" id="rust"></pre></div>
    </div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/handlebars/handlebars.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script>
const $ = s => document.querySelector(s);
let dataCache = "{}", dirty = false, timer = null;
const esc = s => s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
const status = m => $("#status").textContent = m;
const setDirty = d => { dirty = d; $("#dot").classList.toggle("dirty", d); $("#dot").title = d ? "unsaved" : "saved"; };

const cm = CodeMirror($("#editwrap"), {
  mode: "handlebars", theme: "dracula", lineNumbers: true, lineWrapping: true,
  gutters: ["CodeMirror-linenumbers", "diag"], value: "",
});
cm.on("change", () => { setDirty(true); clearTimeout(timer); timer = setTimeout(inspectNow, 200); });

async function loadFiles() {
  const files = await (await fetch("/api/files")).json();
  const tpl = $("#templates"), dat = $("#datafiles");
  tpl.innerHTML = dat.innerHTML = "";
  for (const f of files) {
    const el = document.createElement("div");
    el.className = "f"; el.textContent = f; el.dataset.path = f;
    if (f.endsWith(".truss")) { el.onclick = () => openTemplate(f); tpl.append(el); }
    else { el.onclick = () => selectData(f); dat.append(el); }
  }
}
async function openTemplate(path) {
  cm.setValue(await (await fetch("/api/file?path=" + encodeURIComponent(path))).text());
  setDirty(false);
  $("#path").textContent = path; cm.path = path;
  document.querySelectorAll("#templates .f").forEach(e => e.classList.toggle("active", e.dataset.path === path));
  inspectNow();
}
async function selectData(path) {
  dataCache = await (await fetch("/api/file?path=" + encodeURIComponent(path))).text();
  document.querySelectorAll("#datafiles .f").forEach(e => e.classList.toggle("active", e.dataset.path === path));
  inspectNow();
}
async function save() {
  if (!cm.path) return;
  await fetch("/api/file?path=" + encodeURIComponent(cm.path), { method:"PUT", body: cm.getValue() });
  setDirty(false); status("saved " + cm.path);
}
$("#save").onclick = save;
document.addEventListener("keydown", e => { if ((e.metaKey||e.ctrlKey) && e.key === "s") { e.preventDefault(); save(); } });

async function inspectNow() {
  let data; try { data = JSON.parse(dataCache); } catch { data = {}; }
  const insp = await (await fetch("/api/inspect", { method:"POST", body: JSON.stringify({ template: cm.getValue(), data }) })).json();
  render(insp);
}

function render(insp) {
  const v = $("#verdict");
  if (insp.aotCompatOk) { v.textContent = "✓ compiles under AOT"; v.className = "verdict ok"; }
  else { v.textContent = "✗ " + (insp.aotCompatError || "won't compile under AOT"); v.className = "verdict err"; }
  diagnostics(insp);

  const enc = new TextEncoder(), dec = new TextDecoder();
  const key = s => s.join(",");
  // Output pane with data→output provenance + per-run context.
  const bytes = enc.encode(insp.output || "");
  const interps = [...(insp.interpolations || [])].sort((a,b) => a.out[0] - b.out[0]);
  let html = "", pos = 0;
  for (const it of interps) {
    if (it.out[0] < pos) continue;
    html += esc(dec.decode(bytes.slice(pos, it.out[0])));
    const ctx = JSON.stringify(it.ctxThis);
    html += `<span class="interp" data-src="${key(it.src)}" data-ctx='${esc(ctx).replace(/'/g,"&#39;")}' title="${esc(it.value)}">`
      + esc(dec.decode(bytes.slice(it.out[0], it.out[1]))) + `</span>`;
    pos = it.out[1];
  }
  html += esc(dec.decode(bytes.slice(pos)));
  $("#output").innerHTML = html || "<span style='color:var(--dim)'>(empty)</span>";

  // Rust pane with template→Rust provenance (linked by the same template span).
  const rust = insp.emittedRust ?? null;
  if (rust === null) { $("#rust").textContent = "// emit error: " + (insp.emitError || ""); }
  else {
    const rb = enc.encode(rust);
    const srcKeys = new Set(interps.map(i => key(i.src)));
    const tiles = (insp.rustMap || []).filter(t => srcKeys.has(key(t.src))).sort((a,b) => a.rust[0] - b.rust[0]);
    let rh = "", rp = 0;
    for (const t of tiles) {
      if (t.rust[0] < rp) continue;
      rh += esc(dec.decode(rb.slice(rp, t.rust[0])));
      rh += `<span class="rtile" data-src="${key(t.src)}">` + esc(dec.decode(rb.slice(t.rust[0], t.rust[1]))) + `</span>`;
      rp = t.rust[1];
    }
    rh += esc(dec.decode(rb.slice(rp)));
    $("#rust").innerHTML = rh;
  }
  status(`${interps.length} interpolation(s)`);
}

function diagnostics(insp) {
  cm.clearGutter("diag");
  const mark = (line, cls, title) => {
    const el = document.createElement("div"); el.className = cls; el.textContent = "●"; el.title = title;
    cm.setGutterMarker(line, "diag", el);
  };
  const lineOf = m => { const mm = /^(\d+):(\d+):/.exec(m || ""); return mm ? +mm[1] - 1 : 0; };
  if (!insp.rendered) mark(lineOf(insp.output), "diag-err", insp.output);
  else if (!insp.aotCompatOk && insp.aotCompatError) mark(lineOf(insp.aotCompatError), "diag-warn", insp.aotCompatError);
}

// Cross-pane linking + the Context Inspector.
function hover(e) {
  const t = e.target.closest("[data-src]"); if (!t) return;
  const on = e.type === "mouseover";
  document.querySelectorAll(`[data-src="${t.dataset.src}"]`).forEach(el => el.classList.toggle("link-hi", on));
  if (t.dataset.ctx !== undefined) {
    $("#ctx").innerHTML = on ? `<b>this</b> = ${esc(t.dataset.ctx)}` : "<b>context</b> — hover an interpolation to see <code>this</code>";
  }
}
for (const id of ["#output", "#rust"]) { $(id).addEventListener("mouseover", hover); $(id).addEventListener("mouseout", hover); }
loadFiles();
</script>
</body>
</html>
