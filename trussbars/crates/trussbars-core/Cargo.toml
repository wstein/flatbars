[package]
name = "trussbars-core"
description = "Value-free runtime core for Trussbars (the typed MaxBars→Rust compiler target): the Safe/ToText output layer, nonEmpty truthiness, and the borrowed-reference loop frame model that compiled templates link against."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["template", "maxbars", "codegen", "html"]
categories = ["template-engine"]

[features]
# Best-in-class by default; opt out with `--no-default-features` for the pure,
# zero-dependency, forbid(unsafe), `no_std` build — where f64 formatting falls back
# to Rust `Display` (the documented divergence from the reference engine, docs/01 §10).
default = ["std", "perf"]
# `std` gates nothing in the code (the crate only needs `alloc`); it exists so the
# default build is a normal std crate and `--no-default-features` is `no_std`.
std = []
# The pluggable performance backends — each is itself dependency-free:
perf = ["fast-int", "ecma-float"]
fast-int = ["dep:itoa"]             # fast integer formatting (byte-identical bytes)
ecma-float = ["dep:dragonbox_ecma"] # fast AND ECMA-262 byte-identical floats (JS `String(n)`)
# Re-export `#[derive(Trussbars)]` so a host can depend on `trussbars-core` alone.
derive = ["dep:trussbars-derive"]

# Pluggable, dependency-free backends behind features (the substrate stays
# auditable; `--no-default-features` is a first-class, tested zero-dep build).
[dependencies]
trussbars-derive = { path = "../trussbars-derive", version = "0.1.0", optional = true }
itoa = { version = "1", optional = true }
dragonbox_ecma = { version = "0.1.12", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "format"
harness = false

[lints]
workspace = true
