[package]
name = "trussbars-benchmarks"
version = "0.0.0"
edition = "2024"
publish = false

# Own workspace, independent of the trussbars/ workspace.
[workspace]

[dependencies]
trussbars-core = { path = "../crates/trussbars-core" }
trussbars-std = { path = "../crates/trussbars-std" }
trussbars-vm = { path = "../crates/trussbars-vm" }
serde = { version = "1", features = ["derive"] }
# Peers: the dynamic interpreter baselines (handlebars; liquid — the engine the
# Rust ecosystem reaches for runtime/user-authored templates, e.g. cobalt), the
# typed peer (askama), the fastest reference (sailfish), and vy (a compile-time
# HTML macro DSL — pre-sized, single-allocation).
handlebars = "6"
liquid = "0.26.11"
tera = "1"
askama = "0.16"
sailfish = "0.11"
vy = "0.2"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "render"
harness = false

# Codegen-strategy profiling (decision tool, not a headline comparison).
[[bench]]
name = "codegen_variants"
harness = false
