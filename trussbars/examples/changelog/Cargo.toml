[package]
name = "changelog-example"
version = "0.0.0"
edition = "2024"
publish = false

# Own workspace, independent of the trussbars/ workspace.
[workspace]

[lib]
name = "changelog_example"

[[bin]]
name = "changelog"
path = "src/main.rs"

[dependencies]
# The native v2 front-end: `truss!` compiles templates/*.truss at build time.
trussbars-macros = { path = "../../crates/trussbars-macros" }
# The runtime the generated code links against (default `perf` features).
trussbars-core = { path = "../../crates/trussbars-core" }
trussbars-i18n = { path = "../../crates/trussbars-i18n" }
trussbars-std = { path = "../../crates/trussbars-std" }
