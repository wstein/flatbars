[package]
name = "lab-example"
version = "0.0.0"
edition = "2024"
publish = false

# Own workspace, independent of the trussbars/ workspace (like the other examples).
[workspace]

[lib]
name = "trussbars_lab"

[[bin]]
name = "lab"
path = "src/main.rs"

[dependencies]
# The dynamic runtime engine — this northstar renders templates the AOT path
# structurally can't (host helpers, data shapes unknown at build time).
trussbars-vm = { path = "../../crates/trussbars-vm" }
# The blessed i18n format primitives (number / date / selectPlural / relative). The
# lab is the *host*: it owns the message catalog for `t` and wires `&[Value]` shims.
trussbars-i18n = { path = "../../crates/trussbars-i18n" }
# The engine lexer — drives the Template pane's syntax highlighting (applied to the
# tui-textarea via its custom-highlight API), straight from the real token stream.
trussbars-template = { path = "../../crates/trussbars-template" }
# The TUI: ratatui for layout/widgets over the crossterm terminal backend. crossterm
# is sourced through `ratatui::crossterm` in code (one version, no skew); pinned here
# explicitly to ratatui's so the dep is visible and the lock can't drift.
ratatui = "0.30"
crossterm = "0.29"
# The editable panes are tui-textarea widgets — a full editing experience (selection,
# undo/redo, word motions, internal scrolling). The `-2` fork tracks ratatui 0.30
# (ratatui-core 0.1); the original tui-textarea still pins ratatui 0.29.
tui-textarea = { package = "tui-textarea-2", version = "0.11" }
# The Data and i18n-catalog panes are edited as live YAML: the data is decoded into
# the VM's dynamic `Value`, the catalog into a locale→key→message map.
serde_yaml = "0.9"
