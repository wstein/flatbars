package:
  name: barebars-json
  publish:
    version: 0.1.0
    license: Apache-2.0
    location:
      githubOwner: barebars
      githubRepo: barebars
  dependencies:
    - prelude
    - either
    - tuples
    - ordered-collections
    # The `argonaut` umbrella re-exports Core + Parser through its own
    # `Data.Argonaut` module, which is what `BareBars.Json` imports. Depending on
    # the umbrella (rather than `argonaut-core` directly) means the declared dep
    # is the one actually imported, so `--pedantic-packages` stays green —
    # `argonaut-parser` (for `jsonParser`) has no standalone package-set entry.
    - argonaut
    - foreign-object
    - barebars
