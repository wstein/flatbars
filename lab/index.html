          if (dock.classList.contains("collapsed")) return;
          const cur = dock.offsetHeight;
          const step = e.shiftKey ? 48 : 16;
          let handled = true;
          if (e.key === "ArrowUp") apply(cur + step);
          else if (e.key === "ArrowDown") apply(cur - step);
          else if (e.key === "Home") apply(560);
          else if (e.key === "End") apply(80);
          else handled = false;
          if (handled) e.preventDefault();
        });
      })();

      function syncStandaloneUI() {
        const cb = byId("standalone-cb");
        if (cb) cb.checked = standalone;
      }

      byId("standalone-cb").addEventListener("change", (e) => {
        standalone = e.target.checked;
        run(); saveHash();
      });

      // ── Render Config (config.yaml popover) ────────────────────────
      // One home for the per-render options that were scattered across the
      // output strip (escape, trim whitespace) plus two that had no GUI at all
      // (the ADR-0013 transformer allow-list). Edited as a small YAML
      // doc with inline descriptions. `escape-select` / `standalone-cb` stay
      // the canonical backing state (share links, examples, restore all read
      // them), so Save syncs them and the rest of the app is unchanged.
      const RENDER_CFG_DEFAULTS = { escape: "", trim: true, allow: null };
      const VALID_ESCAPE = ["", "html", "xml", "json", "none"];

      // Serialise current state to the editable YAML (values inlined into a fixed
      // commented scaffold so the descriptions are always present).
      // Align an inline `# comment` to a fixed column — keeps the generated config
      // readable without per-line magic-number padding.
      function cfgLine(kv, comment) {
        return kv + " ".repeat(Math.max(1, 26 - kv.length)) + "# " + comment;
      }
      function buildConfigYaml(v = { escape: escapeMode, trim: standalone, allow: allowList }) {
        const esc = v.escape ? v.escape : '""';
        // `null` = unconstrained (the default); a real array (even empty)
        // locks the surface to that positive list. Mirrors the engine's
        // ADR-0013 `allow:` semantics — yaml `~` rounds-trips as null.
        const allow = v.allow === null ? "~" : "[" + v.allow.join(", ") + "]";
        return [
          "# Render config — applies to every compile + render.",
          "# Edits apply live as you type; fix any error shown in Problems.",
          "",
          cfgLine(`escape: ${esc}`, 'html · xml · json · none · "" (as-compiled)'),
          cfgLine(`trim_whitespace: ${v.trim}`, "strip standalone tag-only lines (ADR-0016)"),
          "",
          "transformers:",
          cfgLine(`  allow: ${allow}`, "ADR-0013 positive list — ~ = unconstrained (default); [eval] = only listed names render"),
          // MinBars-only: the truthiness rule (ADR-029). Replaces the old UI toggle.
          ...(ENGINE === "minbars"
            ? ["", "minbars:", cfgLine(`  truthiness: ${minbarsCompat ? "mustacheJs" : "spec"}`, 'mustacheJs (0/"" falsy, default) · spec (0/"" truthy)')]
            // t-surfaces: the active locale for catalog.yaml's messages (ADR-029),
            // plus the ADR-030 analyse path schema (paths the host guarantees safe).
            : ["", "i18n:", cfgLine(`  locale: ${labLocale}`, "the locale catalog.yaml is rendered in"),
              "", "analyse:", cfgLine(`  pathSchema: [${labPathSchema.join(", ")}]`, "ADR-030 — paths guaranteed safe; suppresses their potential/miss findings")]),
        ].join("\n");
      }

      // Parse + validate the YAML the user edited. Returns { ok, value } or
      // { ok:false, error } with a human message for the inline error line.
      function parseConfigYaml(text) {
        let cfg;
        try { cfg = loadYaml(text); }
        catch (err) { return { ok: false, error: "YAML · " + (err.message || "parse error") }; }
        if (cfg == null) cfg = {};
        if (typeof cfg !== "object" || Array.isArray(cfg))
          return { ok: false, error: "config must be a mapping (key: value pairs)" };

        let esc = cfg.escape == null ? "" : String(cfg.escape).trim();
        if (esc === "as compiled" || esc === "as-compiled" || esc === "raw") esc = "";
        if (!VALID_ESCAPE.includes(esc))
          return { ok: false, error: `escape: must be html, xml, json, none, or "" — got "${esc}"` };

        const trim = cfg.trim_whitespace !== false; // default on
        // MinBars truthiness (ADR-029): default mustacheJs (true); only "spec" opts out.
        const minbars = cfg.minbars && typeof cfg.minbars === "object" ? cfg.minbars : {};
        const mustacheJs = minbars.truthiness !== "spec";
        // i18n locale (ADR-029): the locale catalog.yaml renders in; default en.
        const i18n = cfg.i18n && typeof cfg.i18n === "object" ? cfg.i18n : {};
        const locale = typeof i18n.locale === "string" && i18n.locale ? i18n.locale : "en";

        // ADR-030 path schema: data paths the host guarantees safe — the Truthiness
        // panel suppresses their potential/miss findings. A list of bare paths;
        // missing/empty ⇒ no suppression (plain analyse).
        const analyse = cfg.analyse && typeof cfg.analyse === "object" ? cfg.analyse : {};
        let pathSchema = [];
        const rawSchema = analyse.pathSchema;
        if (rawSchema != null) {
          if (!Array.isArray(rawSchema))
            return { ok: false, error: "analyse.pathSchema: must be a list of data paths, e.g. [count, items]" };
          pathSchema = [...new Set(rawSchema.map((p) => String(p).trim()).filter(Boolean))];
        }

        // ADR-0013 allow-list: missing or `~` means unconstrained (null);
        // an explicit list (even empty) is the positive surface.
        let allow = null;
        const rawAllow = (cfg.transformers && cfg.transformers.allow) ?? cfg.allow;
        if (rawAllow != null) {
          if (!Array.isArray(rawAllow))
            return { ok: false, error: "transformers.allow: must be a list, e.g. [upcase, trim], or ~ for unconstrained" };
          allow = [...new Set(rawAllow.map((n) => String(n).trim()).filter(Boolean))];
          const unknown = allow.filter((n) => !engineBuiltins.includes(n));
          if (unknown.length)
            return { ok: false, error: `transformers.allow: unknown transformer${unknown.length > 1 ? "s" : ""} — ${unknown.join(", ")}` };
        }
        return { ok: true, value: { escape: esc, trim, allow, mustacheJs, locale, pathSchema } };
      }

      // Render config changed → refresh the explorer (the config.yaml row's
      // non-default dirty dot). The old toolbar chip + Render-button dot were
      // removed when the config moved to the explorer file, so this is now just
      // an explorer repaint kept under its original name for its many callers.
      function updateRenderStatus() {
        renderExplorer();
      }

      // config.yaml is edited as a normal file in the edit pane
      // (selectConfigTab / applyConfigText) — no popup. updateRenderStatus()
      // just refreshes the explorer's config-file dirty dot.
      updateRenderStatus();

      // Explorer: collapse-all toggles every group (→ expand-all when all closed).
      byId("exp-collapse-all").addEventListener("click", () => {
        const allClosed = EXP_GROUP_KEYS.every((k) => expCollapsed.has(k));
        if (allClosed) expCollapsed.clear();
        else EXP_GROUP_KEYS.forEach((k) => expCollapsed.add(k));
        saveExpCollapsed(); renderExplorer();
      });

      // The highlight picker is a filterable combobox: "Auto" (use the example's
      // format), "Plain text" (no highlight), then every CodeMirror language
      // (alphabetical). The list items are Preact-rendered (only matches are kept
      // in the DOM); the filter input + open/close stay light imperative glue.
      const OUT_LANG_NAMES = ["Auto", "Plain text",
        ...cmLanguages.map((l) => l.name).sort((a, b) => a.localeCompare(b))];
      let langQuery = "";
      let langActive = 0; // L-2 · highlighted option index for keyboard navigation
      function scrollLangActive() {
        const ul = byId("out-lang-list");
        const el = ul?.querySelector(".kbd-active");
        if (!ul || !el) return;
        const top = el.offsetTop, bottom = top + el.offsetHeight;
        if (top < ul.scrollTop) ul.scrollTop = top;
        else if (bottom > ul.scrollTop + ul.clientHeight) ul.scrollTop = bottom - ul.clientHeight;
      }

      function visibleLangs() {
        const s = langQuery.trim().toLowerCase();
        return s ? OUT_LANG_NAMES.filter((n) => n.toLowerCase().includes(s)) : OUT_LANG_NAMES;
      }
      function renderLangMenu() {
        const vis = visibleLangs();
        langActive = Math.max(0, Math.min(langActive, vis.length - 1));
        render(
          html`${vis.map((name, i) => html`<li id=${"out-lang-opt-" + i} class=${"dropdown-item" + (name === outLangChoice ? " active" : "") + (i === langActive ? " kbd-active" : "")} role="option" aria-selected=${i === langActive} data-name=${name} onClick=${() => selectLang(name)}>${name}</li>`)}`,
          byId("out-lang-list")
        );
        const filter = byId("out-lang-filter");
        if (filter) filter.setAttribute("aria-activedescendant", vis.length ? "out-lang-opt-" + langActive : "");
      }

      {
        renderLangMenu();
        updateLangPlaceholder();
        const trigger = byId("out-lang-trigger");
        const filter = byId("out-lang-filter");
        filter.setAttribute("role", "combobox");
        filter.setAttribute("aria-controls", "out-lang-list");
        filter.setAttribute("aria-autocomplete", "list");
        trigger.addEventListener("click", () => {
          byId("out-lang-menu").hidden ? openLangMenu() : closeLangMenu();
        });
        filter.addEventListener("input", () => filterLang(filter.value));
        filter.addEventListener("keydown", (e) => {
          const vis = visibleLangs();
          if (e.key === "Escape") { closeLangMenu(); trigger.focus(); }
          else if (e.key === "ArrowDown") { e.preventDefault(); langActive = Math.min(vis.length - 1, langActive + 1); renderLangMenu(); scrollLangActive(); }
          else if (e.key === "ArrowUp") { e.preventDefault(); langActive = Math.max(0, langActive - 1); renderLangMenu(); scrollLangActive(); }
          else if (e.key === "Home") { e.preventDefault(); langActive = 0; renderLangMenu(); scrollLangActive(); }
          else if (e.key === "End") { e.preventDefault(); langActive = vis.length - 1; renderLangMenu(); scrollLangActive(); }
          else if (e.key === "Enter") { e.preventDefault(); const pick = vis[langActive] || vis[0]; if (pick) selectLang(pick); }
        });
        document.addEventListener("pointerdown", (e) => {
          if (!byId("out-lang-menu").hidden && !byId("out-lang").contains(e.target)) closeLangMenu();
        });
      }

      function selectLang(name) {
        outLangChoice = name;
        updateOutLang(); persistOutLang(); updateLangPlaceholder();
        closeLangMenu();
      }
      function openLangMenu() {
        const filter = byId("out-lang-filter");
        filter.value = ""; langQuery = "";
        langActive = Math.max(0, visibleLangs().indexOf(outLangChoice));
        renderLangMenu(); // reflect the active language and reset the filter
        byId("out-lang-menu").hidden = false;
        byId("out-lang").dataset.open = "true";
        byId("out-lang-trigger").setAttribute("aria-expanded", "true");
        scrollLangActive();
        filter.focus();
      }
      function closeLangMenu() {
        byId("out-lang-menu").hidden = true;
        byId("out-lang").dataset.open = "false";
        byId("out-lang-trigger").setAttribute("aria-expanded", "false");
      }
      function filterLang(q) {
        langQuery = q;
        langActive = 0;
        renderLangMenu();
      }

      for (const b of document.querySelectorAll(".focus-toggle")) {
        b.addEventListener("click", () => toggleFocus(b.dataset.pane));
      }

      window.addEventListener("keydown", (e) => {
        const mod = e.metaKey || e.ctrlKey;
        if (mod && e.shiftKey && e.key.toLowerCase() === "f") {
          e.preventDefault(); showSearch();
        } else if (e.key === "Escape" && focusMode) {
          setFocus(null);
        }
      });

      window.addEventListener("resize", applySplits);

      // L-1 · collapse to stacked panes on narrow / embedded viewports (~720px —
      // the half-window & embedded-iframe case, not phones). While narrow, the
      // splitter's saved pixel split is overridden by CSS and restored (via
      // applySplits) when the viewport widens again.
      const narrowMq = window.matchMedia("(max-width: 720px)");
      function applyNarrow() {
        document.body.classList.toggle("is-narrow", narrowMq.matches);
        applySplits();
      }
      narrowMq.addEventListener("change", applyNarrow);

      // ── Boot ──────────────────────────────────────────────────────────
      buildExampleSelect();
      // Explorer ↔ editor-region split (explorer is always the left column).
      sizeExplorer = makeSplitter({
        el: byId("splitter-ex"), container: qs(".workspace"),
        first: byId("explorer"), second: qs(".editor-region"),
        axisRow: () => true, keyRow: "ex0", keyCol: "ex0", min: 150, ratio: 0.16,
      });
      // Sources ↔ Output split, now scoped to .editor-region so the explorer
      // width is excluded from the ratio.
      sizeWorkspace = makeSplitter({
        el: byId("splitter-1"), container: qs(".editor-region"),
        first: document.querySelectorAll(".pane")[0], second: document.querySelectorAll(".pane")[1],
        axisRow: () => !isStacked(), keyRow: "w0", keyCol: "h0", min: 240, ratio: 0.55,
      });
      sizeEditors = () => {}; // single edit pane — no inner editor splitter
      // Edit ↔ inspector split inside the Sources pane (edit on top, inspector below).
      sizeInspect = makeSplitter({
        el: byId("inspect-splitter"), container: qs(".pane-sources"),
        first: qs(".src-edit"), second: qs(".src-inspect"),
        axisRow: () => false, keyRow: "si0", keyCol: "si0", min: 120, ratio: 0.62,
      });
      applyTweaks();
      applyNarrow(); // L-1 · reflect current viewport width on boot
      setOutputView(outputView);
      renderDataTabs(); // paint both editor tab strips before the async example load
      showDataTab(); // populate the bottom (data) pane so it isn't blank on boot

      // The highlighter is a sticky preference. Capture it before the startup
      // load (which loads an example and resets the choice to "Auto"), then
      // re-apply it afterwards so a reload restores the user's last pick.
      const savedOutLang = (() => { try { return localStorage.getItem(LS_OUTLANG); } catch { return null; } })();

      // Default load is keyed by id, not array position, so reordering the
      // examples.json catalog (e.g. simple -> advanced) never breaks it.
      // A `?vendored=<id>` deep-link takes precedence over both the shared-state
      // hash and the default example.
      const vendoredParam = new URLSearchParams(location.search).get("vendored");
      if (vendoredParam) {
        await loadVendoredById(vendoredParam);
      } else if (!(await restoreHash())) {
        // Landing example: "greeting" (FullBars/MaxBars catalogs) or "hello"
        // (MinBars), else the first entry.
        const def = examples.findIndex((e) => e.id === "greeting" || e.id === "hello");
        await loadExample(def < 0 ? 0 : def);
        // On a fresh open (no share link), default the output to Plain Text rather
        // than the example's own view. A shared link keeps its saved view.
        setOutputView(validView("source"));
      }
      if (savedOutLang && savedOutLang !== "Auto") {
        outLangChoice = savedOutLang;
        updateLangPlaceholder();
        updateOutLang();
      }
      persistOutLang();
      applySplits();
      updateStatusMeta();
      restorePanels(); // restore persisted floating panels (Appearance)
    </script>
  </body>
</html>
