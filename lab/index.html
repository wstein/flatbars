<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load the web fonts without blocking first paint: the shell renders
         immediately in the system fallback, then the fonts swap in. The URL is the
         single source shared/fonts.mjs (this static copy is pinned by check:fonts). -->
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" />
    <title>FlatBars Lab — IDE</title>
    <!-- The shared umbrella topbar element, vendored from shared/ (a committed
         artifact like the engine bundle; regenerate with `npm run gen:topbar`, bump
         ?v= on change — check:topbar pins the copy). The chrome tokens it reads are
         generated into the `@chrome` fence in the inline <style> below by
         `npm run gen:tokens` (from shared/flatbars-chrome.css), inline so they are
         in place before first paint. -->
    <script type="module" src="./vendor/flatbars-topbar.mjs?v=6"></script>
    <style>
      /* ── Design tokens ───────────────────────────────────────────── */
      :root {
        /* The chrome design system — palette (--bg/--fg/--border/--accent/status),
           IBM Plex families, radius and shadows — is GENERATED into this fence from
           shared/flatbars-chrome.css by `npm run gen:tokens`, so it can't drift from
           the tutorials and the spec. The Lab's IDE-specific tokens, brand greens
           and the syntax palette (also generated) follow. */
        /* @chrome light · generated from shared/flatbars-chrome.css — edit there, run `npm run gen:tokens` */
        --font-ui: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        --bg: #ffffff;
        --bg-1: #faf8ff;
        --bg-2: #f2effc;
        --bg-3: #e8e3f8;
        --fg: #18181b;
        --fg-secondary: #3b1b6b;
        --fg-muted: #5b4d92;
        --fg-faint: #6f5f99;
        --border: #ddd6f8;
        --border-strong: #c8bff2;
        --accent: #6d28d9;
        --accent-2: #4c1d95;
        --accent-soft: color-mix(in srgb, var(--accent) 20%, var(--bg));
        --accent-softer: color-mix(in srgb, var(--accent) 9%, var(--bg));
        --danger: #b91c1c;
        --danger-faint: #fee2e2;
        --success: #10b981;
        --success-faint: #dcfce7;
        --warn: #b45309;
        --warn-faint: #fef3c7;
        --out-bg: #1b1923;
        --out-fg: #ece9f5;
        --radius: 6px;
        --radius-lg: 10px;
        --shadow-pop: 0 12px 32px -8px rgba(24, 24, 27, 0.18), 0 0 0 1px rgba(24, 24, 27, 0.06);
        --shadow-card: 0 1px 2px rgba(24, 24, 27, 0.04), 0 6px 20px -12px rgba(60, 27, 107, 0.22);
        /* @chrome end */

        /* IDE surfaces — DERIVED from the shared base so they track the umbrella in
           both themes (no per-theme overrides needed; the dark block drops them). */
        --bg-toolbar: var(--bg);
        --bg-statusbar: var(--bg-1);
        --bg-tab-active: var(--bg-2);
        --bg-tab-inactive: transparent;
        --bg-pane: var(--bg);
        --bg-gutter: var(--bg-1);

        /* Brand greens — Lab-only. */
        --stem-green: #10b981;    /* Growth Green · green-5 */
        --stem-mint: #3ee0a3;     /* mint · green-6 */

        --tok-tag: #7c4dff;       /* violet-6 */
        --tok-cmt: #6b7280;       /* WCAG AA comment grey (S-1) */
        --tok-key: #1d4ed8;
        --tok-str: #047857;
        --tok-num: #b45309;

        /* Syntax-tag palette — separately tuned from the long-form --tok-* so the
           `{{ }}` tags read as distinct chips against dense markup (the code
           vocabulary is muted by design; tags need to *pop*). This is the same
           seven-family system the tutorials use — one source for the legend AND
           the editor — retuned to clear WCAG AA on its own tint. Tags carry a
           fixed tint chip treatment; the legend popover reuses these tokens, so it
           is an honest key. Dark-mode overrides live in the [data-theme] blocks. */
        /* @palette light · generated from shared/flatbars-tokens.css — edit there, run `npm run gen:tokens` */
        --c-expr: #0550ae;
        --c-raw: #0a3069;
        --c-block: #cd1f2d;
        --c-partial: #116329;
        --c-inherit: #6f42c1;
        --c-delim: #953800;
        --c-comment: #57606a;
        --tint-mix: 12%;
        --directive-bg: #eaeef2;
        --tag-bg: #efe7fb;
        --tag-border: #c4a8ec;
        /* @palette end */

        --topbar-h: 44px;
        --statusbar-h: 26px;
        /* One tab height across every tab strip (template, output view, and the
           data sub-pane) for a consistent look. */
        --tabs-h: 24px;
      }

      /* First-paint background before the inline theme script runs, so a
         dark/System-dark load doesn't flash the light default. */
      html { background: #ffffff; }
      @media (prefers-color-scheme: dark) { html { background: #16141d; } }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        font-family: var(--font-ui);
        font-size: 13px; line-height: 1.45;
        color: var(--fg); background: var(--bg-1);
        -webkit-font-smoothing: antialiased;
      }

      button { font: inherit; color: inherit; }
      input, select { font: inherit; color: inherit; }
      kbd {
        font: 11px/1 var(--font-mono);
        background: var(--bg-2); border: 1px solid var(--border);
        border-bottom-width: 2px; padding: 2px 5px; border-radius: 4px;
        color: var(--fg-secondary);
      }

      /* ── App shell ───────────────────────────────────────────────── */
      #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

      /* ── Top bar ─────────────────────────────────────────────────── */
      .topbar {
        height: var(--topbar-h); flex: 0 0 auto;
        display: flex; align-items: center; gap: 14px; padding: 0 12px;
        background: var(--bg-toolbar); border-bottom: 1px solid var(--border);
        user-select: none;
      }
      /* The brand/wordmark + docs backlink now live in the shared
         <flatbars-topbar> above this toolbar (the Lab's umbrella row). */
      .topbar .divider { width: 1px; height: 18px; background: var(--border); }
      .topbar-group { display: flex; align-items: center; gap: 6px; }
      .field-label { color: var(--fg-muted); font-size: 12px; padding-right: 2px; }

      select.select {
        height: 26px; padding: 0 8px;
        border: 1px solid var(--border-strong); border-radius: var(--radius);
        background: var(--bg); color: var(--fg); font-size: 12px; cursor: pointer;
        transition: background 80ms ease, border-color 80ms ease;
      }
      select.select:hover { background: var(--bg-2); }
      select.select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

      /* Topbar tool buttons — flat and light (the diagnostics-toggle look the
         user preferred), with a leading icon, grouped into a tool bar. */
      /* `.btn` (not `button.btn`) so the toolbar's one anchor button — the Docs
         backlink — gets the same flat sizing, including the 13px icon cap; an
         unscoped <a> svg otherwise renders at its intrinsic size. */
      .btn {
        display: inline-flex; align-items: center; gap: 5px;
        height: 26px; padding: 0 9px;
        border: 1px solid var(--border); border-radius: var(--radius);
        background: transparent; color: var(--fg-secondary);
        font: 11px var(--font-ui); cursor: pointer; text-decoration: none;
        transition: background 80ms ease, border-color 80ms ease, color 80ms ease;
      }
      .btn:hover { background: var(--bg-2); color: var(--fg); }
      /* Toolbar action cluster: borderless (no dividers either) for a clean look. */
      .topbar .toolbar .btn { border-color: transparent; }
      .topbar .toolbar .btn:hover { background: var(--bg-2); border-color: transparent; }
      button.btn.active { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-softer); }
      .btn:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      .btn svg { width: 13px; height: 13px; flex: 0 0 auto; opacity: .85; }
      .btn .kbd-inline { color: var(--fg-faint); margin-left: 4px; font: 11px/1 var(--font-mono); }
      /* The action buttons sit together as one bar with hairline separators. */
      .toolbar { display: inline-flex; align-items: center; gap: 4px; }

      /* Custom example dropdown — always opens downward (top: 100%). */
      .dropdown { position: relative; }
      .dropdown-trigger {
        height: 26px; min-width: 210px; padding: 0 8px;
        display: inline-flex; align-items: center; justify-content: space-between; gap: 8px;
        border: 1px solid var(--border-strong); border-radius: var(--radius);
        background: var(--bg); color: var(--fg); font-size: 12px; cursor: pointer;
        transition: background 80ms ease, border-color 80ms ease;
      }
      .dropdown-trigger:hover { background: var(--bg-2); }
      .dropdown-trigger:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      .dropdown-trigger #example-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dropdown-caret { width: 11px; height: 11px; flex: 0 0 auto; opacity: .6; }
      .dropdown[data-open="true"] .dropdown-caret { transform: rotate(180deg); }
      .dropdown-menu {
        position: absolute; top: calc(100% + 4px); left: 0; z-index: 60;
        min-width: 100%; max-height: 60vh; overflow-y: auto;
        margin: 0; padding: 4px; list-style: none;
        background: var(--bg-pane); border: 1px solid var(--border); border-radius: 6px;
        box-shadow: 0 10px 30px rgba(0,0,0,.18);
      }
      .dropdown-menu[hidden] { display: none; }
      /* The Share menu sits at the far right, so its menu opens flush-right. */
      #share-menu { left: auto; right: 0; }
      .dropdown-item {
        padding: 5px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap;
        font: 12px var(--font-ui); color: var(--fg-secondary);
      }
      .dropdown-item:hover, .dropdown-item.active { background: var(--accent-soft); color: var(--accent-2); }
      .dropdown-item:focus-visible { outline: none; background: var(--accent-soft); color: var(--accent-2); box-shadow: inset 0 0 0 1px var(--border-strong); }
      .dropdown-item.kbd-active { background: var(--accent-soft); color: var(--accent-2); }
      .dropdown-item[hidden] { display: none; }

      /* Highlight-language combobox: a filter field pinned above a scrolling list. */
      .lang-dropdown[hidden] { display: none; }
      .lang-dropdown .dropdown-trigger { min-width: 150px; height: 26px; }
      .lang-menu { padding: 0; overflow: hidden; display: flex; flex-direction: column; min-width: 200px; }
      .lang-filter {
        flex: 0 0 auto; border: 0; border-bottom: 1px solid var(--border);
        padding: 7px 10px; background: var(--bg-pane); color: var(--fg);
        font: 12px var(--font-mono); outline: none;
      }
      .lang-menu ul { flex: 1 1 auto; list-style: none; margin: 0; padding: 4px; max-height: 280px; overflow-y: auto; }

      .spacer { flex: 1 1 auto; }
      .hint { font-size: 12px; color: var(--fg-muted); display: flex; align-items: center; gap: 6px; }

      /* Text input with a clear (×) button, shown only when it has content. */
      .input-wrap { position: relative; display: inline-flex; align-items: center; }
      .input-wrap > input { padding-right: 22px; }
      .input-wrap:has(> input[hidden]) { display: none; }
      .input-clear {
        position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
        width: 16px; height: 16px; display: grid; place-items: center; padding: 0;
        border: 0; border-radius: 50%; background: var(--bg-3); color: var(--fg-muted);
        cursor: pointer;
      }
      .input-clear svg { width: 9px; height: 9px; display: block; }
      .input-clear:hover { background: var(--border-strong); color: var(--fg); }
      .input-clear[hidden] { display: none; }
      /* The search input fills its container; the highlight input keeps its own
         width inside an inline wrap. */
      .search-bar .input-wrap { flex: 1 1 auto; min-width: 0; }
      .search-bar .input-wrap > input { width: 100%; }

      /* ── Workspace ───────────────────────────────────────────────── */
      .workspace {
        flex: 1 1 auto; min-height: 0;
        display: flex; flex-direction: row;
        background: var(--border);
      }
      .pane {
        flex: 1 1 0; min-width: 220px; background: var(--bg-pane);
        display: flex; flex-direction: column; min-height: 0; overflow: hidden;
      }

      /* ── Virtual file explorer (left rail) ─────────────────────────── */
      /* A navigator over every editable file, grouped by type. It drives the
         existing template/data tabs + the render-config popover; the per-pane
         tab strips remain as the open-editor row (and keep inline rename / +
         / the read-only inspectors). The two editor panes + their splitter
         live in .editor-region so the explorer stays a left column in every
         layout (split, stacked, narrow). */
      .editor-region {
        flex: 1 1 0; min-width: 0; min-height: 0;
        display: flex; flex-direction: row; background: var(--border);
      }
      .explorer {
        flex: 0 0 auto; min-width: 150px; background: var(--bg-1);
        display: flex; flex-direction: column; min-height: 0; overflow: hidden;
      }
      .exp-head {
        height: var(--tabs-h); flex: 0 0 auto; display: flex; align-items: center;
        gap: 4px; padding: 0 4px 0 12px; border-bottom: 1px solid var(--border);
      }
      .exp-title { font-size: 11px; letter-spacing: .07em; font-weight: 700; color: var(--fg-muted); flex: 1 1 auto; }
      .exp-head-act { width: 22px; height: 22px; display: grid; place-items: center; border: 0; background: none; color: var(--fg-faint); cursor: pointer; border-radius: 4px; }
      .exp-head-act:hover { background: var(--bg-2); color: var(--fg); }
      .exp-head-act svg { width: 14px; height: 14px; }
      .exp-scroll { flex: 1 1 auto; overflow: auto; padding: 4px 0 10px; }

      .exp-gh {
        display: flex; align-items: center; gap: 4px; height: 22px;
        padding: 0 8px 0 6px; cursor: pointer; user-select: none;
      }
      .exp-gh:hover { background: var(--bg-2); }
      .exp-gh:hover .exp-add { opacity: 1; }
      .exp-caret { width: 11px; height: 11px; color: var(--fg-faint); flex: 0 0 auto; transition: transform .12s ease; transform: rotate(90deg); }
      .exp-caret.closed { transform: rotate(0deg); }
      .exp-glabel { font-size: 10.5px; letter-spacing: .06em; font-weight: 700; color: var(--fg-muted); flex: 1 1 auto; text-transform: uppercase; }
      .exp-count { font: 10px var(--font-mono); color: var(--fg-faint); }
      .exp-add { opacity: .8; border: 0; background: none; color: var(--fg-muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 3px; border-radius: 3px; }
      .exp-add:hover { opacity: 1; color: var(--accent); background: var(--accent-soft); }

      .exp-rows[hidden] { display: none; }
      .exp-row {
        display: flex; align-items: center; gap: 7px; height: 23px;
        padding: 0 10px 0 24px; cursor: pointer; position: relative;
        color: var(--fg-secondary); font-size: 13px;
      }
      .exp-row:hover { background: var(--bg-2); }
      .exp-row:focus { outline: none; background: var(--bg-2); }
      .exp-row:focus-visible { outline: none; box-shadow: inset 0 0 0 1px var(--accent); }
      .exp-row.active { background: var(--accent-soft); color: var(--fg); }
      .exp-row.active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
      .exp-ico { flex: 0 0 16px; display: inline-grid; place-items: center; }
      .exp-ico svg { width: 15px; height: 15px; }
      .exp-ico.t-stem { color: var(--tok-tag); }
      .exp-ico.t-yaml { color: var(--success); }
      .exp-ico.t-fn { color: var(--tok-num); }
      .exp-ico.t-cfg { color: var(--fg-muted); }
      .exp-name { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* Modified-from-default highlight (replaces the old dirty ● dot): bold
         name + a neutral "M" marker — no colour. */
      .exp-row.mod .exp-name { font-weight: 700; }
      .exp-m {
        flex: 0 0 auto; margin-left: 4px; font-size: 10px; font-weight: 700;
        line-height: 1; color: var(--fg-muted); opacity: .9;
      }
      .exp-empty { padding: 1px 10px 3px 24px; font-size: 11px; color: var(--fg-faint); font-style: italic; }
      /* Delete-file affordance (× on hover) — distinct from a tab's close button:
         this removes the file, the tab close only hides the editor. */
      .exp-del {
        opacity: 0; margin-left: 4px; flex: 0 0 auto; border: 0; background: none;
        color: var(--fg-faint); cursor: pointer; font-size: 15px; line-height: 1;
        padding: 0 4px; border-radius: 3px;
      }
      .exp-row:hover .exp-del { opacity: .75; }
      .exp-del:hover { opacity: 1; color: var(--danger); background: var(--danger-faint); }
      .exp-rename {
        flex: 1 1 auto; min-width: 0; height: 19px; padding: 0 5px;
        font: 13px var(--font-ui); color: var(--fg); background: var(--bg);
        border: 1px solid var(--accent); border-radius: 4px; outline: none;
      }
      .exp-rename:focus { box-shadow: 0 0 0 2px var(--accent-soft); }

      /* ── Splitter ────────────────────────────────────────────────── */
      .splitter {
        flex: 0 0 6px; background: var(--border); cursor: col-resize;
        position: relative; transition: background 100ms ease;
      }
      .splitter::after { content: ""; position: absolute; inset: 0; margin: 0 -3px; }
      .splitter:hover, .splitter.dragging { background: var(--accent); }
      .splitter:focus-visible, .esplitter:focus-visible {
        outline: none; background: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }
      body.dragging-col { cursor: col-resize !important; }
      body.dragging-row { cursor: row-resize !important; }
      body.dragging-col *, body.dragging-row * { user-select: none !important; }
      body.dragging-col iframe, body.dragging-row iframe { pointer-events: none !important; }

      /* L-1 · narrow / embedded viewport (~720px): stack Sources over Output and
         hide the workspace splitter. Overrides the inline pixel split applied by
         the splitter JS; the split is restored when the viewport widens. */
      body.is-narrow .editor-region { flex-direction: column; }
      body.is-narrow .editor-region > .pane { flex: 1 1 0 !important; min-width: 0; min-height: 160px; }
      body.is-narrow #splitter-1 { display: none; }

      /* The icon buttons (copy, then the focus/maximize toggle) are grouped at
         the far right of the tab strip (the panes have no separate title header).
         The first one carries the `auto` margin that pushes the group right. */
      .tabs-wrap > .focus-toggle { flex: 0 0 auto; align-self: center; margin-right: 6px; }
      .tabs-wrap > #out-copy { margin-left: auto; margin-right: 0; }
      #out-copy.copied { color: #10b981; }

      /* ── Tabs ────────────────────────────────────────────────────── */
      .tabs-wrap {
        flex: 0 0 var(--tabs-h); height: var(--tabs-h);
        display: flex; align-items: stretch;
        border-bottom: 1px solid var(--border); background: var(--bg-2); min-width: 0;
      }
      .tabs {
        flex: 1 1 0; min-width: 0; height: 100%;
        display: flex; align-items: flex-end; padding: 0 4px; gap: 1px;
        overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
      }
      .tabs::-webkit-scrollbar { height: 4px; }
      .tabs::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

      .tab {
        flex: 0 0 auto; height: calc(var(--tabs-h) - 1px);
        display: inline-flex; align-items: center; gap: 3px;
        padding: 0 5px; border-right: 1px solid var(--border);
        background: var(--bg-tab-inactive); color: var(--fg-secondary);
        font-size: 11px; font-family: var(--font-mono);
        cursor: pointer; position: relative; user-select: none; white-space: nowrap;
      }
      .tab:hover { background: var(--bg-3); color: var(--fg); }
      .tab.active { background: var(--bg-tab-active); color: var(--fg); font-weight: 600; }
      .tab.active::after {
        content: ""; position: absolute; left: 0; right: 0; top: 0;
        height: 2px; background: var(--accent);
      }
      .tab.is-main::before { content: none; }
      .tab .close {
        width: 14px; height: 14px; display: grid; place-items: center;
        border-radius: 3px; color: var(--fg-faint); font-size: 12px; margin-left: 1px;
      }
      .tab .close:hover { background: var(--border); color: var(--fg); }
      .tab-add {
        flex: 0 0 auto; height: calc(var(--tabs-h) - 1px);
        padding: 0 10px; border: 0; background: transparent;
        color: var(--fg-muted); font-family: var(--font-mono); font-size: 12px;
        cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
      }
      .tab-add:hover { color: var(--accent); background: var(--bg-3); }

      /* ── Inline tab rename (active partial tab) ──────────────────── */
      .tab .tab-edit, .data-tab .tab-edit {
        border: 0; background: transparent; color: inherit;
        font: inherit; padding: 0; margin: 0; outline: none; min-width: 3ch;
      }
      .tab-edit.invalid { color: var(--danger); }
      /* Data overlay tabs reuse `.data-tab` styling and add a close button. */
      .data-tab.data-overlay-tab {
        position: relative; padding-right: 18px;
      }
      .data-tab.data-overlay-tab .close {
        position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
        cursor: pointer; color: var(--fg-muted); font-size: 11px;
        line-height: 1; padding: 1px 3px; border-radius: 2px;
      }
      .data-tab.data-overlay-tab .close:hover { color: var(--fg); background: var(--bg-3); }
      /* ── Tab-strip separators ─────────────────────────────────────── */
      /* A thin vertical divider that pushes the inspector tabs (`Context
         Inspector`, `Syntax Tree`) to the right, away from the editable
         tabs. Symmetric in the template pane between the partials/`+`
         column and the JSONata transform pseudo-tab on the right. */
      .data-tab-separator, .tab-separator {
        flex: 1 1 auto; align-self: center; height: 60%;
        border-left: 1px dashed var(--border);
        margin: 0 8px;
      }
      .tab-separator { border-left-color: var(--border); }
      .tab.tab-transform {
        font-style: italic; color: var(--fg-secondary);
      }
      .tab.tab-transform.active { font-style: normal; color: var(--fg); }

      /* ── Editor panes (CodeMirror) ───────────────────────────────── */
      /* Template + data editors shown together, perpendicular to the workspace:
         stacked when the workspace is split (the default), side-by-side when the
         workspace is stacked. A draggable .esplitter sits between them. */
      .editors { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; min-width: 0; position: relative; }
      .editors > .editor-pane { flex: 1 1 0; min-height: 0; }
      /* Single edit pane: only the active surface (template / data) is shown. */
      .editors > .editor-pane[hidden] { display: none; }
      /* Sources = edit pane on top, inspector pane below (vertical stack). */
      .pane-sources { flex-direction: column; }
      .src-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .src-inspect { flex: 0 0 38%; } /* the bottom (data / overlay) editor pane */
      .src-edit { flex: 1 1 0; }
      .src-esplitter { flex: 0 0 6px; width: 100%; height: 6px; cursor: row-resize; }
      /* Empty edit pane (all tabs closed). */
      .edit-empty {
        flex: 1 1 auto; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 8px; padding: 24px; text-align: center;
        color: var(--fg-faint); background: var(--bg-pane);
      }
      .edit-empty[hidden] { display: none; }
      .edit-empty svg { width: 34px; height: 34px; opacity: .5; }
      .edit-empty p { margin: 0; font-size: 14px; font-weight: 600; color: var(--fg-muted); }
      .edit-empty span { font-size: 12px; max-width: 240px; }
      .editor-cell { flex: 1 1 0; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .editor-cell > .editor-pane { flex: 1 1 auto; }
      .cell-label {
        flex: 0 0 auto; height: 24px; display: flex; align-items: center; gap: 6px;
        padding: 0 12px; font: 11px/1 var(--font-mono); color: var(--tok-key);
        background: var(--accent-softer); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      }
      .data-tabs {
        flex: 0 0 auto; height: var(--tabs-h); display: flex;
        background: var(--accent-softer); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      }
      .data-tab {
        height: 100%; display: inline-flex; align-items: center; gap: 6px;
        padding: 0 12px; border: 0; border-right: 1px solid var(--border);
        background: transparent; color: var(--fg-faint);
        font: 11px/1 var(--font-mono); cursor: pointer;
      }
      .data-tab:hover { color: var(--fg-secondary); }
      .data-tab.active { color: var(--tok-key); background: var(--bg-pane); }
      .data-tab .yaml-ver { margin-left: 0; }
      /* Output-pane view tabs: flat underline tabs in a tab strip (.tabs-wrap),
         sitting flush with its bottom border (no pill borders — real tabs).
         The strip flexes + scrolls horizontally so the copy/focus buttons to its
         right stay visible even when all the view tabs don't fit. */
      .view-tabs {
        display: flex; flex: 1 1 0; min-width: 0; align-self: stretch; height: 100%;
        overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
      }
      .view-tabs::-webkit-scrollbar { display: none; }
      .view-tab {
        flex: 0 0 auto; white-space: nowrap;
        height: 100%; display: inline-flex; align-items: center; padding: 0 12px;
        border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
        background: transparent; color: var(--fg-faint);
        font: 11px/1 var(--font-mono); cursor: pointer; white-space: nowrap;
      }
      .view-tab:hover { color: var(--fg-secondary); }
      .view-tab.active { color: var(--tok-key); border-bottom-color: var(--accent); }
      /* Contextual controls row: only the controls relevant to the active view
         (Highlight for Plain Text, Escape for rendered views, Allow scripts for
         previews). Hidden entirely when the view needs none. */
      .view-controls {
        flex: 0 0 auto; min-height: 30px; display: flex; align-items: center; gap: 8px;
        padding: 4px 12px; border-bottom: 1px solid var(--border); background: var(--bg-pane);
      }
      .view-controls[hidden] { display: none; }
      .yaml-ver {
        margin-left: auto; color: var(--fg-faint);
        font-size: 10px; font-weight: bold; letter-spacing: .02em; opacity: .7;
      }
      .editor-pane { display: block; overflow: hidden; min-width: 0; min-height: 0; }

      .esplitter {
        flex: 0 0 6px; background: var(--border); position: relative;
        cursor: row-resize; transition: background 100ms ease;
      }
      .esplitter::after { content: ""; position: absolute; inset: -3px; }
      .workspace.stacked .esplitter { cursor: col-resize; }
      .esplitter:hover, .esplitter.dragging { background: var(--accent); }

      .editor-pane .cm-editor { height: 100%; font-size: var(--editor-font-size, 13px); }
      /* The picked editor font applies to the file content only (CodeMirror sets
         the family on .cm-scroller); the tab/UI chrome keeps --font-mono. */
      .editor-pane .cm-scroller { overflow: auto; font-family: var(--editor-font, var(--font-mono)); }
      /* Coverage gutter — dead-branch lines are dimmed so the user sees at a
         glance which arm of an #if/#unless/#each/#with never fires against the
         current data. The dock's Coverage tab carries the exhaustive list. */
      .cm-dead-line { background: repeating-linear-gradient(
        135deg, transparent 0 6px, color-mix(in srgb, var(--fg-muted) 8%, transparent) 6px 7px); }
      .cm-dead-line .cm-line { opacity: 0.55; }
      /* The output view (.src-view) shares the editors' gutter theme, so the
         line-number column reads the same on both sides (no stray light strip). */
      .editor-pane .cm-gutters,
      .src-view .cm-gutters {
        background: var(--bg-gutter); border-right: 1px solid var(--border);
        color: var(--fg-faint); min-width: 38px;
      }
      /* Line numbers off → remove the gutter entirely (the line-number + active-line
         gutters drop via the compartment; this also hides the lint gutter so no
         empty column is left behind). Lint still shows as inline underlines. */
      body:not(.show-line-numbers) .editor-pane .cm-gutters,
      body:not(.show-line-numbers) .src-view .cm-gutters { display: none; }
      .editor-pane .cm-activeLineGutter,
      .src-view .cm-activeLineGutter { background: var(--accent-softer); color: var(--fg-muted); }
      .editor-pane .cm-content { padding: 8px 0; }
      .editor-pane .cm-line { padding: 0 12px; }
      .editor-pane .cm-selectionBackground { background: var(--accent-soft) !important; }
      /* The text caret. CM6 treats an un-flagged theme as LIGHT and so applies its
         baseTheme `&light .cm-content { caret-color: black }`, which is invisible on
         our dark theme (the Lab themes CM via --bg/--fg, never telling it it's dark).
         Drive the caret from --fg so it stays visible in BOTH themes — and follows a
         live theme toggle without reconfiguring the editors. `!important` beats CM's
         `.cm-light .cm-content` rule. The `.cm-cursor` border covers the drawn-cursor
         path too, should drawSelection ever be added. */
      .cm-content { caret-color: var(--fg) !important; }
      .cm-cursor, .cm-dropCursor { border-left-color: var(--fg) !important; }

      /* Stem tag colours for CM decorations. Stem syntax sits inside HTML, so
         the whole class set is bold + chip-tinted — without that lift the
         tags blur into the surrounding markup at typical editor sizes
         (the cheat-sheet and Group-dictionary examples make this visible).
         Each family gets its own hue (the unified `--c-*` palette at the top of
         this file, shared with the legend) so eye-scanning separates structure
         from interpolation from composition from an unescaped raw emit without
         reading every tag's body:

           EXPR     green,  weight 600  — the common interpolation case
           RAW      deep green, 700     — the SSTI-adjacent unescaped emit (care)
           BLOCK    orange, weight 700  — control-flow skeleton + clause keywords
           PARTIAL  blue,   weight 700  — runtime dispatch
           INHERIT  violet, weight 700  — layout / overridable-block sigils
           DELIM    rose,   weight 700  — the set-delimiters directive
           COMMENT  grey, italic, no bg — out-of-band notes

         Tags carry a fixed tint chip treatment; the `{{ }}` delimiters themselves
         are dimmed (`.cm-hb-pn`) so the sigil + name stay the loud part. A small
         horizontal `padding` would read more like a chip but would shift the
         editor's character grid and break cursor positioning at tag boundaries;
         the background/outline + `border-radius` alone chunk the tag. */
      /* Each tag class sets --c from the unified palette; tint = a color-mix of
         --c into the page so the chip reads without a layout-shifting padding.
         inherit (violet) + delim (rose) are their own families now, matching the
         tutorials, instead of folding into partial / comment. */
      .cm-hb-expr    { --c: var(--c-expr);    color: var(--c); background: color-mix(in srgb, var(--c) var(--tint-mix), transparent); font-weight: 700; border-radius: 3px; }
      .cm-hb-raw     { --c: var(--c-raw);     color: var(--c); background: color-mix(in srgb, var(--c) var(--tint-mix), transparent); font-weight: 700; border-radius: 3px; }
      .cm-hb-block   { --c: var(--c-block);   color: var(--c); background: color-mix(in srgb, var(--c) var(--tint-mix), transparent); font-weight: 700; border-radius: 3px; }
      .cm-hb-partial { --c: var(--c-partial); color: var(--c); background: color-mix(in srgb, var(--c) var(--tint-mix), transparent); font-weight: 700; border-radius: 3px; }
      .cm-hb-inherit { --c: var(--c-inherit); color: var(--c); background: color-mix(in srgb, var(--c) var(--tint-mix), transparent); font-weight: 700; border-radius: 3px; }
      .cm-hb-delim   { --c: var(--c-delim);   color: var(--c); background: color-mix(in srgb, var(--c) var(--tint-mix), transparent); font-weight: 700; border-radius: 3px; }
      .cm-hb-comment { color: var(--c-comment); font-style: italic; font-weight: 700; }
      /* The whole tag is bold from first `{` to last `}`; the braces are only
         lightly recessed so the sigil + name stay marginally louder. */
      .cm-hb-pn      { opacity: 0.7; }
      /* Inner-token classes (the VS Code 2026-dark look) — emitted by the shared
         painter (highlight-paint.mjs), the SAME .tk-* classes the tutorials use.
         Each token kind maps to a --c-* family colour; everything inside a tag is
         bold (tk-in is the bold default for identifiers / paths / operators). */
      .tk-punct, .tk-keyword { color: var(--c-block); }
      .tk-operation          { color: var(--c-inherit); }
      .tk-number             { color: var(--c-expr); }
      .tk-string             { color: var(--c-raw); }
      .tk-delim              { color: var(--c-delim); }
      .tk-comment            { color: var(--c-comment); font-style: italic; }
      .tk-error              { text-decoration: underline wavy var(--danger); text-decoration-skip-ink: none; }
      .tk-punct, .tk-keyword, .tk-operation, .tk-number, .tk-string,
      .tk-delim, .tk-comment, .tk-in { font-weight: 700; }
      /* The plate behind a whole tag ({ … }, braces included) — a rose FILL
         (--tag-bg) + visible rose BORDER (--tag-border) so each tag reads as one
         clearly-outlined pill. The border is a 1px box-shadow ring (not `border`)
         that hugs the fill, so it adds no width — editor glyphs never shift. */
      .tk-tag { background: var(--tag-bg); border-radius: 3px; box-shadow: 0 0 0 1px var(--tag-border); }
      /* A lexer error span (ADR-014): today `highlightSpans` degrades to no
         spans, so this is the defensive style for the `error` kind. */
      .cm-hb-error   { text-decoration: underline wavy #ef4444; text-decoration-skip-ink: none; }

      /* YAML scalar keywords (true/false/null/…) and numbers — the YAML grammar
         leaves these as plain content, so they are highlighted via a decorator. */
      .cm-yaml-kw    { color: var(--tok-tag); font-weight: 600; }
      .cm-yaml-num   { color: var(--tok-num); }

      /* ── Output pane ─────────────────────────────────────────────── */
      .output-body {
        flex: 1 1 auto; min-height: 0; position: relative;
        background: var(--bg-pane); overflow: hidden;
      }
      .output-body iframe { width: 100%; height: 100%; border: 0; background: var(--bg); display: block; }
      /* The Plain Text + Render Data outputs share one read-only CodeMirror editor
         (syntax-highlighted, language auto-switched). It overlays the iframe area. */
      .src-view { position: absolute; inset: 0; background: var(--bg-1); }
      #output-text .cm-editor { height: 100%; font-size: var(--editor-font-size, 13px); }
      #output-text .cm-scroller { font-family: var(--editor-font, var(--font-mono)); }
      .output-body[data-empty="true"]::after {
        content: "no output"; position: absolute; inset: 0;
        display: grid; place-items: center;
        color: var(--fg-faint); font-size: 12px; pointer-events: none;
      }

      /* Plain Text view: each run of output is a segment (a CM mark decoration)
         tracing back to the file (and, for expressions, the tag) that produced it.
         Hover to highlight + tooltip; click (or Enter on the cursor) to jump. */
      #output-text .seg { border-radius: 2px; cursor: pointer; }
      #output-text .seg-expr {
        font-weight: 700; color: var(--tok-key);
        box-shadow: inset 0 -1px 0 var(--accent-soft);
      }
      /* The full-segment hover/caret link highlight is applied as a JS decoration
         (.cm-out-linked) over the run's whole range, so a run that wraps across
         output lines lights up on every line — not just the fragment under the
         pointer (which is all a per-element `.seg:hover` could reach). */
      #output-text .cm-out-linked {
        background: var(--accent-soft);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      /* The editor/tab side of the link: hovering an output run highlights its
         source span in the editor (if shown) or tints its tab (if not). Visually
         kin to .seg:hover, distinct from the text selection and lint marks. */
      .cm-link-highlight {
        background: var(--accent-soft);
        box-shadow: inset 0 0 0 1px var(--accent);
        border-radius: 2px;
      }
      .tab.tab-linked { box-shadow: inset 0 -2px 0 var(--accent); }
      .seg-tip {
        position: fixed; z-index: 60; max-width: 340px; padding: 6px 9px;
        border-radius: 7px; background: var(--bg-pane); color: var(--fg);
        border: 1px solid var(--border); box-shadow: var(--shadow-pop);
        font: 11.5px/1.45 system-ui, sans-serif; pointer-events: none;
      }
      .seg-tip .seg-tip-file { color: var(--accent-2); font-weight: 600; }
      .seg-tip code {
        display: block; margin-top: 3px; font: 11px/1.4 var(--font-mono);
        color: var(--fg-secondary); word-break: break-all;
      }
      .seg-tip .seg-tip-hint {
        display: flex; align-items: center; gap: 4px; margin-top: 5px;
        padding-top: 4px; border-top: 1px solid var(--border);
        color: var(--fg-faint); font-size: 10.5px;
      }
      .seg-tip[hidden] { display: none; }

      /* ── Diagnostics dock ────────────────────────────────────────── */
      .dock {
        flex: 0 0 auto; height: 240px; min-height: 28px;
        display: flex; flex-direction: column;
        background: var(--bg-pane); border-top: 1px solid var(--border);
        position: relative;
      }
      .dock[hidden] { display: none; }
      .dock.collapsed { height: 30px; }
      .dock-grip {
        position: absolute; top: -3px; left: 0; right: 0; height: 6px;
        cursor: row-resize; background: transparent;
      }
      .dock-grip:hover, .dock-grip.dragging { background: var(--accent); }
      .dock-grip:focus-visible { outline: none; background: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
      /* While dragging the dock grip, let the iframe not swallow the pointer. */
      body.dragging-dock { cursor: row-resize; user-select: none; }
      body.dragging-dock #output-preview { pointer-events: none; }
      /* Problem-count badge — lives on the toolbar Diagnostics button. */
      .badge {
        font: 10px var(--font-mono); padding: 0 5px; border-radius: 8px;
        background: var(--bg-3); color: var(--fg-muted);
      }
      .badge.danger  { background: var(--danger-faint); color: var(--danger); }
      .badge.warn    { background: var(--warn-faint); color: var(--warn); }
      .badge.success { background: var(--success-faint); color: var(--success); }
      /* The dock has no title bar (Problems is its only view); a single close
         button floats top-right over the content. */
      .dock-close {
        position: absolute; top: 6px; right: 8px; z-index: 2;
        appearance: none; border: 0; background: transparent; cursor: pointer;
        color: var(--fg-muted); padding: 4px; border-radius: 4px; display: flex;
      }
      .dock-close:hover { background: var(--bg-2); color: var(--fg); }
      .dock-close svg { width: 12px; height: 12px; }
      .dock-body { flex: 1 1 auto; overflow: auto; min-height: 0; }
      .dock.collapsed .dock-body { display: none; }

      .problem {
        display: grid; grid-template-columns: 18px 130px 1fr auto;
        gap: 10px; align-items: baseline;
        padding: 8px 14px; border-bottom: 1px solid var(--bg-2);
        font-size: 12px;
      }
      .problem { cursor: pointer; }
      .problem:hover { background: var(--bg-1); }
      .problem .sev {
        width: 14px; height: 14px; border-radius: 3px; color: #fff;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 10px; font-weight: 700;
      }
      .problem.error .sev, .problem.render .sev { background: var(--danger); }
      .problem.cap .sev { background: var(--warn); }
      .problem .where { color: var(--fg-muted); font-family: var(--font-mono); font-size: 11px; }
      .problem .msg { color: var(--fg); }
      .problem .src { color: var(--fg-muted); font-family: var(--font-mono); font-size: 11px; }
      .problem-empty { padding: 20px; text-align: center; color: var(--fg-faint); font-size: 12px; }
      .problem-empty b { color: var(--success); }
      .problem-action {
        display: inline-flex; align-items: center; gap: 3px;
        margin-left: 8px; padding: 1px 6px; border-radius: 3px;
        font-size: 10px; font-weight: 600; cursor: pointer;
        color: var(--accent); background: var(--accent-softer);
        border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
        white-space: nowrap; vertical-align: middle; line-height: 14px;
      }
      .problem-action:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); }
      /* ── Dock tabs (Problems | Transformers) ─────────────────────── */
      .dock-tabs {
        display: flex; gap: 0; border-bottom: 1px solid var(--border);
        background: var(--bg-pane); flex-shrink: 0; padding-right: 32px;
      }
      .dock-tab {
        padding: 5px 12px; font-size: 11px; cursor: pointer; border: none;
        background: transparent; color: var(--fg-muted); border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .dock-tab:hover { color: var(--fg); }
      .dock-tab.active { color: var(--fg); border-bottom-color: var(--accent); }
      /* ── Used-transformers report ─────────────────────────────────── */
      .tx-section { padding: 10px 14px; }
      .tx-header {
        display: flex; align-items: center; gap: 8px;
        font-size: 11px; color: var(--fg-muted); margin-bottom: 8px;
      }
      .tx-header strong { color: var(--fg); }
      .tx-copy {
        margin-left: auto; padding: 2px 8px; border-radius: 3px; font-size: 10px;
        cursor: pointer; border: 1px solid var(--border); background: var(--bg-2);
        color: var(--fg-muted);
      }
      .tx-copy:hover { color: var(--fg); background: var(--bg-3); }
      .tx-empty { font-size: 12px; color: var(--fg-faint); }

      /* SVG dependency graph (rendered by renderDepsGraph into the Partials
         dock panel's right column). ADR-0014: recursion is legal (the
         runtime caps invoke depth), so cycle edges/nodes draw in the
         accent rather than the error red. */
      .dep-svg-wrap { position: relative; overflow: auto; width: 100%; height: 100%; }
      .dep-svg { display: block; width: 100%; height: 100%; }
      .dep-node rect { fill: var(--bg); stroke: var(--border-strong); stroke-width: 1.2; }
      .dep-node.main rect { fill: var(--accent-softer); stroke: var(--accent); stroke-width: 1.6; }
      .dep-node.recursive rect { stroke: var(--accent); stroke-width: 1.6; }
      .dep-node.missing rect { fill: var(--warn-faint); stroke: var(--warn); stroke-dasharray: 3 2; }
      .dep-node text { font: 11.5px var(--font-mono); fill: var(--fg); }
      .dep-node.main text { fill: var(--accent-2); font-weight: 600; }
      .dep-edge { stroke: var(--border-strong); stroke-width: 1.4; fill: none; marker-end: url(#dep-arrow); }
      .dep-edge.recursive { stroke: var(--accent); stroke-width: 1.8; stroke-dasharray: 5 3; }
      .dep-edge.missing { stroke: var(--warn); stroke-dasharray: 3 2; }

      .ctx-pane { padding: 12px 14px; display: grid; gap: 10px; }
      .ctx-hint {
        padding: 8px 12px; border-radius: 6px; font-size: 12px;
        background: var(--accent-softer); border: 1px dashed var(--accent-soft);
        color: var(--accent-2);
      }
      .ctx-snap { border: 1px solid var(--border); border-radius: 6px; background: var(--bg-1); overflow: hidden; }
      .ctx-snap-head {
        display: flex; align-items: center; gap: 8px; padding: 6px 12px;
        background: var(--bg-2); border-bottom: 1px solid var(--border);
        font-family: var(--font-mono); font-size: 11px;
      }
      .ctx-snap-head .ix { background: var(--accent); color: #fff; padding: 1px 6px; border-radius: 3px; font-weight: 700; }
      .ctx-snap-head .src { color: var(--accent-2); background: var(--accent-softer); padding: 1px 5px; border-radius: 3px; }
      .ctx-snap-table {
        display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 4px 12px;
        padding: 8px 12px; font: 11.5px/1.45 var(--font-mono);
      }
      .ctx-snap-table .key { color: var(--accent-2); font-weight: 600; align-self: start; }
      /* min-width:0 lets the 1fr value wrap instead of overflowing (and being
         clipped by .ctx-snap); a bounded height keeps one big object from
         dominating — it scrolls within the cell. */
      .ctx-snap-table .val {
        color: var(--fg); white-space: pre-wrap; word-break: break-word;
        min-width: 0; max-height: 220px; overflow: auto;
      }
      .ctx-snap-table .val .ty { color: var(--fg-faint); font-style: italic; margin-left: 6px; }

      /* ── Transformers v2 (rows with call-site jumps) ──────────────── */
      .tx-rows { display: flex; flex-direction: column; gap: 6px; }
      .tx-row {
        display: grid; grid-template-columns: minmax(120px, max-content) max-content 1fr;
        gap: 12px; align-items: baseline; padding: 4px 0;
      }
      .tx-sites-count { color: var(--fg-muted); font-size: 11px; font-family: var(--font-mono); }
      .tx-sites { display: flex; flex-wrap: wrap; gap: 4px; }
      .tx-site {
        font-family: var(--font-mono); font-size: 10.5px; cursor: pointer;
        padding: 1px 6px; border-radius: 3px; border: 1px solid var(--border);
        background: var(--bg-1); color: var(--fg-secondary);
      }
      .tx-site:hover { background: var(--accent-softer); color: var(--accent-2); }
      /* Purpose-grouped chips (ADR-0013). Every purpose shares one subdued
         palette so the catalog reads as a glossary, not a security tier —
         capability groups are gone. The lone exception is `dynamic` (only
         `eval` today): it keeps the danger palette so the policy signal
         the user cares about ("did this template just reach for eval?")
         stays visible at a glance. `host` (custom resolver names) uses the
         accent tint to set them apart from the engine built-ins. */
      .tx-purpose-encoding,
      .tx-purpose-strings,
      .tx-purpose-collections,
      .tx-purpose-access,
      .tx-purpose-logic,
      .tx-purpose-predicates  { background: var(--bg-2); border-color: var(--border); }
      .tx-purpose-dynamic     { background: var(--danger-faint); border-color: var(--danger); color: var(--fg); font-weight: 600; }
      .tx-purpose-host        { background: var(--accent-softer); border-color: var(--accent-soft); }
      /* Available-transformers collapsible section */
      /* Panel-level two-column layout: "Used transformers" on the left,
         "Available transformers" catalog on the right. The catalog gets
         twice the weight (a short used-list shouldn't claim half the dock).
         Collapses to one column under ~600px via the media query. */
      .tx-section {
        display: grid; gap: 14px 22px;
        grid-template-columns: minmax(220px, 1fr) minmax(0, 2fr);
        align-items: start;
      }
      .tx-section > * { min-width: 0; }
      @media (max-width: 600px) {
        .tx-section { grid-template-columns: 1fr; }
      }

      /* Catalog summary acts as the right-column heading — same weight as
         "Used transformers" on the left so neither out-shouts the other. */
      .tx-avail summary {
        font-size: 12px; color: var(--fg); cursor: pointer; font-weight: 600;
        list-style: none; display: flex; align-items: center; gap: 6px; user-select: none;
        margin-bottom: 8px;
      }
      .tx-avail summary::before { content: "▶"; font-size: 9px; display: inline-block; transition: transform 0.15s; color: var(--fg-muted); }
      .tx-avail[open] summary::before { transform: rotate(90deg); }
      .tx-avail summary:hover { color: var(--accent); }
      .tx-avail-count { color: var(--fg-faint); font-weight: 400; font-size: 11px; }

      /* Tier sections flow as auto-fitted cards inside the catalog: at wide
         widths low-population tiers sit side-by-side; at narrow widths they
         stack. minmax(180px, 1fr) is the breakpoint. */
      .tx-avail-tiers {
        display: grid; gap: 12px 16px;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }
      .tx-avail-tier { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
      .tx-avail-tier-head {
        font-size: 10px; color: var(--fg-faint); text-transform: uppercase;
        letter-spacing: 0.04em; font-weight: 600;
      }
      .tx-avail-tier-sub {
        color: var(--fg-faint); font-weight: 400; text-transform: none;
        letter-spacing: 0; margin-left: 4px;
      }
      .tx-avail-chips { display: flex; flex-wrap: wrap; gap: 4px; }
      .tx-avail-chip {
        font-size: 11px; font-family: var(--font-mono); padding: 1px 6px;
        border-radius: 3px; border: 1px solid; opacity: 0.55;
      }
      .tx-avail-chip.tx-avail-used { opacity: 1; font-weight: 600; }
      /* ── Data Access (#1) ─────────────────────────────────────────── */
      .dx-section, .wt-section, .pg-section, .cp-section, .pf-section, .cv-section { padding: 10px 14px; }
      .dx-head, .wt-head, .pg-head, .cp-head, .pf-head, .cv-head {
        display: flex; gap: 6px; align-items: baseline;
        font-size: 11px; color: var(--fg-muted); margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .dx-head strong, .wt-head strong, .pg-head strong,
      .cp-head strong, .pf-head strong, .cv-head strong { color: var(--fg); }
      .dx-hint, .wt-hint, .cv-hint {
        font-size: 11px; color: var(--fg-faint); margin-bottom: 6px;
      }
      .dx-empty, .wt-empty, .pg-empty, .cp-empty, .pf-empty, .cv-empty {
        padding: 14px; text-align: center; color: var(--fg-faint); font-size: 12px;
      }
      .dx-pill {
        padding: 1px 6px; border-radius: 999px; font-size: 10.5px; font-family: var(--font-mono);
        background: var(--bg-2); color: var(--fg);
      }
      .dx-pill.ok { background: var(--success-faint); color: var(--success); }
      .dx-pill.warn { background: var(--warn-faint); color: var(--warn); }
      .dx-pill.danger { background: var(--danger-faint); color: var(--danger); }
      .dx-pill.muted { color: var(--fg-muted); }
      .dx-contract {
        padding: 6px 0; margin-bottom: 8px; display: flex; flex-wrap: wrap;
        gap: 4px 6px; align-items: baseline; font-size: 11px; color: var(--fg-secondary);
      }
      .dx-assign {
        font-family: var(--font-mono); padding: 1px 6px; border-radius: 3px;
        background: var(--success-faint); color: var(--success); font-size: 10.5px;
      }
      .dx-assign.missing { background: var(--warn-faint); color: var(--warn); font-weight: 600; }
      .dx-contract-warn { color: var(--warn); margin-left: 6px; }
      .dx-rows { display: flex; flex-direction: column; }
      .dx-row {
        display: grid; grid-template-columns: 90px 1fr 1fr 160px auto;
        gap: 10px; align-items: baseline;
        padding: 4px 6px; border-radius: 3px; cursor: pointer;
        font-family: var(--font-mono); font-size: 11px;
      }
      .dx-save {
        font-size: 10px; padding: 1px 6px; border-radius: 3px;
        border: 1px solid var(--border); background: var(--bg-2);
        color: var(--fg-muted); cursor: pointer; font-family: inherit;
      }
      .dx-save:hover { color: var(--accent-2); background: var(--accent-softer); border-color: var(--accent-soft); }
      .dx-row:hover { background: var(--bg-1); }
      .dx-status { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
      .dx-row.ok    .dx-status { color: var(--success); }
      .dx-row.warn  .dx-status { color: var(--warn); }
      .dx-row.danger .dx-status { color: var(--danger); }
      .dx-row.muted .dx-status { color: var(--fg-muted); }
      .dx-path { color: var(--fg); }
      .dx-val { color: var(--fg-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dx-where { color: var(--fg-faint); text-align: right; }
      /* ── Whitespace (#2) ──────────────────────────────────────────── */
      .wt-rows { display: flex; flex-direction: column; }
      .wt-row {
        display: grid; grid-template-columns: 60px 160px 1fr; gap: 10px;
        align-items: baseline; padding: 4px 6px; border-radius: 3px;
        cursor: pointer; font-size: 11px;
      }
      .wt-row:hover { background: var(--bg-1); }
      .wt-kind { font-family: var(--font-mono); color: var(--accent-2); font-weight: 700; }
      .wt-row.wt-standalone .wt-kind { color: var(--warn); }
      .wt-where { font-family: var(--font-mono); color: var(--fg-faint); }
      .wt-desc { color: var(--fg-secondary); }
      .wt-hint { padding: 8px 0 0; font-size: 11px; color: var(--warn); }
      /* ── Partials panel (#3) — list on the left, SVG graph on the right ── */
      .pg-split {
        display: grid; grid-template-columns: minmax(360px, 1.4fr) minmax(280px, 1fr);
        gap: 16px; align-items: stretch; min-height: 240px;
      }
      .pg-graph {
        border-left: 1px solid var(--border); padding-left: 12px;
        min-height: 240px; display: flex; align-items: center; justify-content: center;
      }
      .pg-graph .dep-svg-wrap { width: 100%; height: 100%; max-height: 360px; }
      .pg-code {
        font-family: var(--font-mono); font-size: 11px;
        background: var(--bg-2); color: var(--accent-2);
        padding: 1px 5px; border-radius: 3px;
      }
      .dep-edge-count {
        font: 600 11px var(--font-mono); fill: var(--accent-2);
        paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
      }
      .pg-rows { display: flex; flex-direction: column; }
      .pg-row {
        display: grid; grid-template-columns: 200px 140px 1fr auto;
        gap: 10px; align-items: baseline;
        padding: 5px 6px; border-radius: 3px; cursor: pointer;
        font-size: 11px;
      }
      .pg-row:hover { background: var(--bg-1); }
      .pg-row.missing { color: var(--warn); }
      .pg-name { font-family: var(--font-mono); color: var(--fg); font-weight: 600; }
      .pg-tags { font-size: 10px; color: var(--fg-faint); }
      .pg-deg { color: var(--fg-muted); font-family: var(--font-mono); font-size: 10.5px; }
      .pg-warn { color: var(--warn); margin-left: 4px; }
      .pg-cycle { color: var(--accent-2); margin-left: 4px; }
      .pg-cycles {
        margin-top: 10px; padding: 8px 10px; border-radius: 4px;
        background: var(--accent-softer); font-size: 11px;
        font-family: var(--font-mono); color: var(--accent-2);
      }
      .pg-cycles strong { display: block; margin-bottom: 4px; color: var(--accent-2); }
      .pg-cycle-row { color: var(--accent-2); padding: 1px 0; }
      /* ── Capabilities (#5) ────────────────────────────────────────── */
      .cp-policy { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin-bottom: 12px; }
      .cp-policy-row { display: contents; }
      .cp-policy-k { font-size: 11px; color: var(--fg-muted); }
      .cp-policy-v { font-size: 11px; font-family: var(--font-mono); color: var(--fg); }
      .cp-policy-row.warn .cp-policy-v { color: var(--warn); }
      .cp-policy-row.danger .cp-policy-v { color: var(--danger); font-weight: 600; }
      .cp-policy-row.ok .cp-policy-v { color: var(--fg); }
      .cp-tiers { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
      .cp-tier {
        display: inline-flex; gap: 6px; align-items: baseline;
        padding: 3px 8px; border-radius: 3px; font-size: 11px;
        border: 1px solid var(--border); background: var(--bg-2);
      }
      .cp-tier-k { color: var(--fg-secondary); }
      .cp-tier-v { font-family: var(--font-mono); color: var(--fg); font-weight: 600; }
      .cp-tier.cp-risk-eval { background: var(--danger-faint); border-color: var(--danger); }
      .cp-tier.cp-risk-transform { background: var(--warn-faint); border-color: var(--warn); }
      .cp-tier.cp-risk-format { background: var(--success-faint); border-color: var(--success); }
      .cp-emit { font-size: 11px; color: var(--fg-secondary); }
      .cp-emit strong { color: var(--fg); display: block; margin-bottom: 4px; }
      .cp-emit-row { font-family: var(--font-mono); color: var(--fg); }
      .cp-warn { color: var(--warn); margin-top: 6px; font-size: 11px; }
      /* ── Performance (#6) ─────────────────────────────────────────── */
      .pf-grid { display: grid; grid-template-columns: 220px 100px 1fr; gap: 4px 14px; font-size: 11px; }
      .pf-k { color: var(--fg-secondary); }
      .pf-v { font-family: var(--font-mono); color: var(--fg); }
      .pf-sub { color: var(--fg-faint); }
      .pf-warn { color: var(--warn); margin-top: 10px; font-size: 11px; }
      /* ── Coverage (#7) ────────────────────────────────────────────── */
      .cv-rows { display: flex; flex-direction: column; }
      .cv-row {
        display: grid; grid-template-columns: 80px 1fr 160px; gap: 10px;
        align-items: baseline; padding: 4px 6px; border-radius: 3px;
        cursor: pointer; font-size: 11px;
      }
      .cv-row:hover { background: var(--bg-1); }
      .cv-kind { font-family: var(--font-mono); color: var(--accent-2); font-weight: 600; }
      .cv-row.dead { opacity: 0.6; }
      .cv-row.dead .cv-kind { color: var(--fg-faint); }
      .cv-label { color: var(--fg); }
      .cv-where { color: var(--fg-faint); font-family: var(--font-mono); text-align: right; }

      .ast-pane { padding: 6px 0; font: 12px/1.6 var(--font-mono); }
      .ast-row { display: flex; align-items: baseline; padding: 1px 14px 1px 0; color: var(--fg-secondary); }
      .ast-row.linked { cursor: pointer; color: var(--fg); }
      .ast-row.linked:hover { background: var(--accent-softer); }
      .ast-ln {
        flex: 0 0 auto; width: 38px; text-align: right; padding-right: 12px;
        color: var(--fg-faint); user-select: none;
      }
      .ast-content { flex: 1 1 auto; min-width: 0; white-space: pre; }
      .ast-kw { color: var(--tok-key); }

      /* ── Status bar ──────────────────────────────────────────────── */
      .statusbar {
        flex: 0 0 var(--statusbar-h); height: var(--statusbar-h);
        display: flex; align-items: center; gap: 14px; padding: 0 12px;
        background: var(--bg-statusbar); border-top: 1px solid var(--border);
        font-size: 11.5px; color: var(--fg-secondary); user-select: none;
      }
      .statusbar .status-pill {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 2px 8px; border-radius: 999px;
      }
      .statusbar .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--success); display: inline-block;
      }
      .statusbar.has-error .dot { background: var(--danger); }
      .statusbar.has-error .status-pill {
        background: var(--danger-faint); color: var(--danger); font-weight: 500;
      }
      .statusbar:not(.has-error) .status-pill { color: var(--success); }
      .statusbar .status-msg { color: inherit; font-family: var(--font-mono); }
      .statusbar .meta { color: var(--fg-muted); font-family: var(--font-mono); font-size: 11px; }
      .statusbar .status-sub { color: var(--fg-faint); font-family: var(--font-mono); font-size: 11px; }
      .statusbar .status-sub:empty { display: none; }
      .statusbar .status-ver { color: var(--fg-faint); font-family: var(--font-mono); font-size: 11px; }
      .statusbar .status-ver:empty { display: none; }
      .statusbar .meta b { color: var(--fg-secondary); font-weight: 600; }

      /* I-1 · "recomputing…" indicator shown during the debounce window between
         a source edit and the render that follows it. */
      .recompute-ind {
        display: inline-flex; align-items: center; gap: 6px;
        color: var(--accent-2); font-family: var(--font-mono); font-size: 11px;
      }
      .recompute-ind[hidden] { display: none; }
      .recompute-spin {
        width: 9px; height: 9px; border-radius: 50%;
        border: 1.5px solid var(--accent-soft); border-top-color: var(--accent);
        animation: recompute-spin .6s linear infinite;
      }
      @keyframes recompute-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .recompute-spin { animation: none; } }


      /* Toast */
      .toast {
        position: fixed; bottom: calc(var(--statusbar-h) + 12px); left: 50%;
        transform: translateX(-50%) translateY(8px); opacity: 0;
        background: #18181b; color: #fff; padding: 8px 14px; border-radius: 6px;
        font-size: 12px; z-index: 200; pointer-events: none;
        transition: opacity 160ms ease, transform 160ms ease;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      /* ── Focus mode ──────────────────────────────────────────────── */
      .workspace.focus-sources .pane:not(.pane-sources),
      .workspace.focus-sources .splitter,
      .workspace.focus-output .pane:not(.pane-output),
      .workspace.focus-output .splitter { display: none; }
      .workspace.focus-sources .pane-sources,
      .workspace.focus-output .pane-output { flex: 1 1 100% !important; }

      .focus-toggle {
        width: 24px; height: 24px; border-radius: 4px;
        border: 1px solid transparent; background: transparent;
        display: grid; place-items: center; cursor: pointer; color: var(--fg-faint);
      }
      .focus-toggle:hover { background: var(--bg-2); color: var(--fg); }
      .focus-toggle.on { background: var(--accent-soft); color: var(--accent-2); }
      .focus-toggle svg { width: 13px; height: 13px; }

      /* ── Themes ──────────────────────────────────────────────────── */
      /* Dark — mid-dark violet. Used by the explicit Dark theme, and by
         System when the OS prefers a dark color scheme. Light is :root. */
      body[data-theme="dark"] {
        /* Shared chrome dark — bg/fg/border/accent/status/shadow — generated into
           this fence from shared/flatbars-chrome.css's [data-theme="dark"]. */
        /* @chrome dark · generated from shared/flatbars-chrome.css — edit there, run `npm run gen:tokens` */
        --bg: #16141d;
        --bg-1: #1b1925;
        --bg-2: #232030;
        --bg-3: #2c2940;
        --fg: #ece9f5;
        --fg-secondary: #c5bedd;
        --fg-muted: #968fb0;
        --fg-faint: #8a83a6;
        --border: #2c2940;
        --border-strong: #423c5c;
        --accent: #9b7dff;
        --accent-2: #bca6ff;
        --danger: #f87171;
        --danger-faint: #3a1414;
        --success: #4ade80;
        --success-faint: #14321f;
        --warn: #fbbf24;
        --warn-faint: #3a2e10;
        --out-bg: #0e0d13;
        --out-fg: #ece9f5;
        --shadow-pop: 0 12px 32px -8px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 0, 0, 0.4);
        --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -14px rgba(0, 0, 0, 0.7);
        /* @chrome end */
        /* IDE surfaces are var(--bg…) of the base. Custom properties resolve at
           their DECLARING scope, so the :root copies bake in the light base and
           inherit unchanged into this (body-scoped) dark theme — leaving the editor
           panes white. Re-derive them here so var() re-resolves against the dark base. */
        --bg-toolbar: var(--bg);
        --bg-statusbar: var(--bg-1);
        --bg-tab-active: var(--bg-2);
        --bg-tab-inactive: transparent;
        --bg-pane: var(--bg);
        --bg-gutter: var(--bg-1);
        /* Lab-only dark accent tints — shared leaves --accent-soft/softer to its
           :root color-mix; the Lab tunes them for the editor surfaces. */
        --accent-soft: #2e2747; --accent-softer: #221d36;
        --tok-tag: #c4b5fd; --tok-cmt: #8a84a0; --tok-key: #93c5fd;
        --tok-str: #86efac; --tok-num: #fbbf24;
        /* @palette dark · generated from shared/flatbars-tokens.css — edit there, run `npm run gen:tokens` */
        --c-expr: #79c0ff;
        --c-raw: #a5d6ff;
        --c-block: #ff7b72;
        --c-partial: #7ee787;
        --c-inherit: #d2a8ff;
        --c-delim: #ffa657;
        --c-comment: #969fab;
        --tint-mix: 20%;
        --directive-bg: #21262d;
        --tag-bg: #2e2646;
        --tag-border: #5b4d96;
        /* @palette end */
        background-color: var(--bg) !important;
      }
      body[data-theme="dark"] iframe { background: #16141d; }
      /* "System" is resolved to an explicit light|dark on <body> by the
         anti-flash script + applyTweaks (and an OS-theme listener), so the dark
         tokens above are the single source — no duplicated [data-theme="system"]
         block. The html-background hint below covers the pre-script first paint. */

      /* Find-in-files Search panel (draggable/resizable). */
      .search-panel {
        position: fixed; z-index: 150;
        width: 460px; height: 520px; min-width: 320px; min-height: 240px;
        background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
        box-shadow: var(--shadow-pop); display: flex; flex-direction: column;
        overflow: hidden; resize: both;
      }
      .search-panel[hidden] { display: none; }
      .search-panel .tw-header { flex: 0 0 auto; }
      /* Two columns — a flexible input field + a fixed 92px control slot — so the
         Search and Replace rows put their input fields in an identical column and
         line up exactly (the toggles and Replace All differ in natural width). */
      .search-bar { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 92px; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
      .search-bar input[type="text"] {
        flex: 1 1 auto; height: 28px; padding: 0 8px;
        border: 1px solid var(--border-strong); border-radius: 5px;
        background: var(--bg-pane); color: var(--fg); font: 12px var(--font-mono);
      }
      .search-bar input[type="text"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      /* Equal-width right controls so the Search and Replace input fields line
         up (the toggles and the Replace All button differ in natural width). */
      .search-opts { box-sizing: border-box; display: inline-flex; gap: 2px; }
      .search-opt {
        font: 11px var(--font-mono); color: var(--fg-muted); cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 24px; height: 24px; padding: 0 5px; border-radius: 4px;
        border: 1px solid transparent; white-space: nowrap; user-select: none;
      }
      .search-opt:hover { background: var(--bg-2); }
      .search-opt input { display: none; }
      .search-opt u { text-decoration: underline; text-underline-offset: 2px; }
      .search-opt:has(input:checked) { color: var(--accent-2); background: var(--accent-soft); border-color: var(--accent-soft); }
      .replace-bar { border-top: 0; }
      .search-replace-all {
        box-sizing: border-box; height: 28px; padding: 0 10px; cursor: pointer;
        border: 1px solid var(--border-strong); border-radius: 5px;
        background: var(--bg); color: var(--fg); font: 11px var(--font-ui);
      }
      .search-replace-all:hover { background: var(--bg-2); border-color: var(--accent-soft); color: var(--accent-2); }
      .hit-replace {
        flex: 0 0 auto; visibility: hidden; align-self: center;
        border: 1px solid var(--border); border-radius: 4px; background: var(--bg);
        color: var(--accent-2); font: 10px var(--font-ui); padding: 1px 6px; cursor: pointer;
      }
      .search-hit:hover .hit-replace { visibility: visible; }
      .hit-replace:hover { background: var(--accent-soft); }
      .search-results { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 0; }
      .search-file { padding: 6px 10px 2px; font: 600 11px var(--font-mono); color: var(--tok-key); position: sticky; top: 0; background: var(--bg); }
      .search-file .n { color: var(--fg-faint); font-weight: 400; margin-left: 6px; }
      .search-hit { display: flex; gap: 8px; padding: 2px 10px 2px 18px; cursor: pointer; font: 12px/1.5 var(--font-mono); color: var(--fg-secondary); }
      .search-hit:hover { background: var(--accent-softer); }
      .search-hit .ln { flex: 0 0 auto; width: 52px; text-align: right; color: var(--fg-faint); }
      .search-hit .txt { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: pre; }
      .search-hit .txt mark { background: var(--accent-soft); color: var(--accent-2); border-radius: 2px; padding: 0 1px; }
      .search-empty { padding: 18px; color: var(--fg-muted); font: 12px var(--font-ui); text-align: center; }

      /* ── Tweaks panel ────────────────────────────────────────────── */
      .tw-panel {
        position: fixed; right: 18px; bottom: 42px; width: 300px;
        background: var(--bg); border: 1px solid var(--border);
        border-radius: 10px; box-shadow: var(--shadow-pop); z-index: 150;
        font-family: var(--font-ui); color: var(--fg); overflow: hidden;
      }
      .tw-header {
        display: flex; align-items: center; gap: 8px; padding: 10px 12px;
        border-bottom: 1px solid var(--border); background: var(--bg-1); cursor: move;
      }
      .tw-title {
        display: flex; align-items: center; gap: 8px;
        font-weight: 600; font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
      }
      .tw-pill {
        width: 8px; height: 8px; border-radius: 2px;
        background: linear-gradient(135deg, #7c4dff 0%, #10b981 100%);
      }
      .tw-close {
        margin-left: auto; width: 22px; height: 22px; border: 0;
        background: transparent; color: var(--fg-muted); font-size: 18px;
        line-height: 1; border-radius: 4px; cursor: pointer;
      }
      .tw-close:hover { background: var(--bg-2); color: var(--fg); }
      .tw-section { padding: 12px 12px 14px; border-bottom: 1px solid var(--border); }
      .tw-section:last-of-type { border-bottom: 0; }
      .tw-section-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
      .tw-section-title {
        font-size: 10px; font-weight: 700; letter-spacing: .1em;
        text-transform: uppercase; color: var(--fg-secondary);
      }
      .tw-section-hint { font-size: 11px; color: var(--fg-faint); margin-left: auto; }
      .tw-section-body { display: flex; gap: 6px; flex-wrap: wrap; }
      .tw-segmented { display: flex; flex: 1 1 100%; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
      .tw-segmented button {
        flex: 1 1 0; border: 0; background: var(--bg); padding: 8px 10px;
        display: flex; align-items: center; justify-content: center; gap: 6px;
        font-size: 12px; font-weight: 500; color: var(--fg-secondary); cursor: pointer;
        transition: background 120ms ease, color 120ms ease;
      }
      .tw-segmented button svg { width: 14px; height: 14px; flex: 0 0 auto; }
      .tw-segmented button + button { border-left: 1px solid var(--border); }
      .tw-segmented button:hover { background: var(--bg-1); }
      .tw-segmented button.on { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }
      .tw-foot {
        padding: 8px 12px 10px; font-size: 11px; color: var(--fg-faint);
        background: var(--bg-1); border-top: 1px solid var(--border);
      }

      /* ── Render config: button, status chip, popover ─────────────────── */
      .render-group { position: relative; gap: 8px; }
      /* Status chip: a quiet monospace readout of the live render config, sitting
         beside the Render button so the (previously scattered + hidden) options
         are visible at a glance. Clickable — opens the same popover. */
      .render-status {
        display: inline-flex; align-items: center; gap: 5px; height: 22px;
        padding: 0 9px; border-radius: 11px; background: var(--bg-2);
        font: 11px/1 var(--font-mono); color: var(--fg-muted); cursor: pointer;
        border: 1px solid transparent;
      }
      .render-status:hover { border-color: var(--border); color: var(--fg-secondary); }
      .render-status .rs-k { color: var(--accent-2); }
      .render-status .rs-sep { color: var(--fg-faint); }
      /* A dot signalling a non-default config — the only render-state cue that
         survives icon-only (compact) mode, where the chip is hidden. */
      button.btn .cfg-dot {
        width: 6px; height: 6px; border-radius: 50%; background: var(--stem-green);
        margin-left: 1px; flex: 0 0 auto; display: none;
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--stem-green) 20%, transparent);
      }
      button.btn.has-config .cfg-dot { display: inline-block; }


      /* ── Compact (icon-only) toolbar — Appearance ▸ Toolbar = Compact ──
         Hides button text + inline shortcuts + field labels + the render chip,
         collapsing every tool to an icon square. Tooltips (title=) carry the
         labels. The example dropdown stays (it shows the loaded example name). */
      body.compact-toolbar .topbar .btn-label,
      body.compact-toolbar .topbar .kbd-inline,
      body.compact-toolbar .topbar .field-label,
      body.compact-toolbar .render-status { display: none; }
      body.compact-toolbar .topbar .btn { padding: 0 7px; }
      body.compact-toolbar .topbar #share-btn { padding: 0 8px; }
      body.compact-toolbar .render-group { gap: 4px; }
    </style>
  </head>
  <body>
    <!-- Apply the saved theme before first paint (the module below loads
         CodeMirror from a CDN and would otherwise set it seconds later, flashing
         the light default). This is the umbrella anti-flash seed: the single
         shared `flatbars-theme` key (the one the shared <flatbars-topbar> writes,
         shared across the whole umbrella), OS fallback on first visit. The Lab's
         dark design tokens live under `body[data-theme="dark"]`, while the shared
         topbar (and chrome tokens) key off `html[data-theme]`, so the seed sets
         BOTH and the theme bridge below keeps them in sync on every change. -->
    <script>
      (function () {
        try {
          var k = "flatbars-theme";
          var t = localStorage.getItem(k);
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
          document.body.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <div id="app">
      <!-- ── Umbrella topbar: the shared <flatbars-topbar> (the SAME element the
           tutorials app and the Starlight spec mount). It owns the wordmark, the
           context switcher (Home · Tutorials · Spec · Lab) and the Theme control;
           `base` is set at runtime from the path so the switcher resolves on every
           origin. The topbar's unified search palette (search-index) spans the whole
           umbrella; the Lab keeps its own in-workbench "find in files" too. ── -->
      <flatbars-topbar section="lab" version="v0.1.0" search-index="/search-index.json"></flatbars-topbar>
      <script>
        // Resolve the umbrella base from the path so the switcher links are right
        // on every origin (/lab/ at root in dev, /flatbars/lab/ in production), and
        // bridge the theme: the shared bar themes off html[data-theme], the Lab's
        // own dark tokens off body[data-theme] — keep body in sync on every change.
        (function () {
          var bar = document.querySelector("flatbars-topbar");
          if (!bar) return;
          var m = location.pathname.match(/^(.*)\/lab\//);
          bar.setAttribute("base", m ? m[1] : "");
          bar.setAttribute("lab-engine", "minbars");
          function mirror() {
            document.body.dataset.theme =
              document.documentElement.dataset.theme === "dark" ? "dark" : "light";
          }
          addEventListener("flatbars:themechange", mirror);
          addEventListener("storage", function (e) { if (e.key === "flatbars-theme") mirror(); });
        })();
      </script>

      <!-- ── Workbench toolbar: the Lab's own controls (engine · example · search ·
           appearance · diagnostics · share). The brand + docs backlink moved up
           into the shared topbar. ── -->
      <header class="topbar" style="flex-direction: row; justify-content: flex-start">
        <div class="topbar-group">
          <span class="field-label">Engine</span>
          <select id="engine-select" class="select" aria-label="Engine">
            <option value="rawbars">RawBars — no sugar</option>
            <option value="minbars">MinBars — Mustache like</option>
            <option value="fullbars">FullBars — Handlebars like</option>
            <option value="maxbars">MaxBars — operators &amp; pipes</option>
          </select>
        </div>
        <div class="divider"></div>
        <div class="topbar-group">
          <span class="field-label">Example</span>
          <!-- Custom dropdown (not a native <select>) so the menu always opens
               downward — a native select centres its popup on the selection and
               can overflow above the control. -->
          <div id="example-select" class="dropdown">
            <button id="example-trigger" class="select dropdown-trigger" type="button"
                    aria-haspopup="listbox" aria-expanded="false" aria-label="Load example">
              <span id="example-label">(custom)</span>
