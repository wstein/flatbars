        t: "format", translate: "format",
        // constructors — always on (same tier as minimum)
        list: "default", dict: "default",
        // arithmetic · comparison · boolean logic (Stem.Transformers.Logic) —
        // pure scalar ops, no host access; part of the always-on minimum floor.
        add: "default", sub: "default", mul: "default", div: "default", mod: "default",
        eq: "default", ne: "default", lt: "default", lte: "default", gt: "default", gte: "default",
        and: "default", or: "default", not: "default",
        // eval — dynamic, opt-in only
        eval: "eval",
      };

      // Any built-in missing from TRANSFORMER_RISK falls back to "host" tier at
      // render time.

      let lastTimings = null;       // #6: { parseMs, compileMs, renderMs, totalMs, outBytes }
      let lastAst = null;           // shared cache: { main: nodes, partials: { name: nodes } }
      let lastDataAccess = [];      // #1: [{ path, status, file, start, end, value? }]
      let lastWhitespace = [];      // #2: [{ file, start, end, kind, line, col }]
      let lastDeps = null;          // #3: dependency graph
      let lastCalls = [];           // #4: [{ name, file, start, end }]
      let lastEscapeRuns = null;    // #5: { html, plain, raw, total }
      let lastCoverage = [];        // #7: [{ kind, file, start, end, line, col, executed, count }]
      let lastAnalyse = { ok: true, findings: [] }; // ADR-022: truthiness portability (Truthiness panel)
      let lastAnalyseSuppressed = 0; // ADR-030: count of potential/miss findings the pathSchema removed
      let lastLint = { ok: true, findings: [] }; // ADR-019: canonicalization lint findings (Lint panel)
      let lastRequiredAssigns = []; // engine reflection: assign names the program reads
      let lastMissingAssigns = [];  // intersection: requiredAssigns NOT in current data

      // Whether the given output view has content to show (drives the empty-state
      // placeholder): the Render Data needs data, Bytecode needs a compiled program,
      // the rest need rendered output.
      function outputHasContent(view) {
        if (view === "data") return lastData != null;
        if (view === "bytecode") return lastProgram != null;
        if (view === "compiled") return true; // depends only on the template source
        if (view === "migrated") return true; // depends only on the template source
        return !!lastOutput;
      }

      function setOutput(str, segments = []) {
        lastOutput = str;
        lastSegments = segments;
        paintTextView();
        renderPreview();
        qs(".output-body").dataset.empty = outputHasContent(outputView) ? "false" : "true";
        renderDock();
        renderDataInspect();
        refreshSearchPanel();
      }

      // Copy the active output to the clipboard. For the text views (Plain Text /
      // Render Data / Bytecode) that is exactly what the read-only editor shows;
      // for the rendered/markdown iframe views it is the raw rendered string.
      function copyOutput() {
        const text = byId("output-text").hidden ? lastOutput : outputEditor.state.doc.toString();
        const flash = () => {
          const btn = byId("out-copy");
          btn.querySelector(".ico-copy").hidden = true;
          btn.querySelector(".ico-done").hidden = false;
          btn.classList.add("copied");
          setTimeout(() => {
            btn.querySelector(".ico-copy").hidden = false;
            btn.querySelector(".ico-done").hidden = true;
            btn.classList.remove("copied");
          }, 1100);
        };
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(text).then(flash, () => {});
        }
      }

      // ── Download: bundle the workspace as a Markdown doc or a zip ──────
      //
      // A fenced block whose backtick run is longer than any in the content, so
      // template/output text containing backticks can't break out of the fence.
      function mdFence(content, lang) {
        let max = 0;
        for (const m of String(content).matchAll(/`+/g)) max = Math.max(max, m[0].length);
        const f = "`".repeat(Math.max(3, max + 1));
        return `${f}${lang || ""}\n${content}\n${f}`;
      }

      // One Markdown document: each template tab, the data, the transform (if
      // any), and the rendered output, each in a fenced block.
      async function buildMarkdownDoc() {
        await saveHash(); // refresh the share URL to the current workspace before embedding it
        const out = [
          "# Stem playground example",
          "",
          `[Open in the Stem playground](${location.href})`,
          "",
        ];
        for (const t of tabs) {
          out.push(`## ${t.name === "main" ? "Template — main" : "Partial — " + t.name}`, "");
          out.push(mdFence(t.source, TEMPLATE_FENCE), "");
        }
        out.push("## Data", "", mdFence(yamlSrc, "yaml"), "");
        if (transformSrc.trim()) out.push(
          "## Transform (JSONata)", "",
          mdFence(transformSrc, "jsonata"), "");
        out.push("## Output", "", mdFence(lastOutput, ""), "");
        return out.join("\n");
      }

      // The workspace as separate files for the zip: each template, the data, the
      // transform (if any), the output, and the Markdown doc as a README.
      async function buildFiles() {
        const files = tabs.map((t) => ({
          name: t.name === "main" ? `main.${TEMPLATE_EXT}` : `partials/${t.name}.${TEMPLATE_EXT}`,
          content: t.source,
        }));
        files.push({ name: "data.yaml", content: yamlSrc });
        if (transformSrc.trim()) files.push({
          name: "transform.jsonata",
          content: transformSrc,
        });
        if (helpersSrc.trim()) files.push({ name: "helpers.js", content: helpersSrc });
        files.push({ name: "output.txt", content: lastOutput });
        files.push({ name: "README.md", content: await buildMarkdownDoc() });
        return files;
      }

      function crc32(bytes) {
        let crc = 0xffffffff;
        for (let i = 0; i < bytes.length; i++) {
          let c = (crc ^ bytes[i]) & 0xff;
          for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
          crc = (crc >>> 8) ^ c;
        }
        return (crc ^ 0xffffffff) >>> 0;
      }

      // A minimal store-only (uncompressed) zip — no build-step dependency. Files
      // are small, so skipping deflate is fine.
      function makeZip(files) {
        const enc = new TextEncoder();
        const u16 = (n) => [n & 0xff, (n >>> 8) & 0xff];
        const u32 = (n) => [n & 0xff, (n >>> 8) & 0xff, (n >>> 16) & 0xff, (n >>> 24) & 0xff];
        const chunks = [];
        const central = [];
        let offset = 0;
        for (const f of files) {
          const name = enc.encode(f.name);
          const data = enc.encode(f.content);
          const crc = crc32(data);
          const header = [
            ...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
            ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0),
            ...name,
          ];
          chunks.push(new Uint8Array(header), data);
          central.push({ crc, size: data.length, name, offset });
          offset += header.length + data.length;
        }
        const cdStart = offset;
        let cdSize = 0;
        for (const c of central) {
          const cd = [
            ...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
            ...u32(c.crc), ...u32(c.size), ...u32(c.size), ...u16(c.name.length), ...u16(0), ...u16(0),
            ...u16(0), ...u16(0), ...u32(0), ...u32(c.offset), ...c.name,
          ];
          chunks.push(new Uint8Array(cd));
          cdSize += cd.length;
        }
        chunks.push(new Uint8Array([
          ...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(central.length), ...u16(central.length),
          ...u32(cdSize), ...u32(cdStart), ...u16(0),
        ]));
        const total = chunks.reduce((n, c) => n + c.length, 0);
        const zip = new Uint8Array(total);
        let p = 0;
        for (const c of chunks) { zip.set(c, p); p += c.length; }
        return zip;
      }

      function downloadFile(name, content, mime) {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = Object.assign(document.createElement("a"), { href: url, download: name });
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      async function downloadWorkspace(fmt) {
        if (fmt === "zip") downloadFile("stem-playground.zip", makeZip(await buildFiles()), "application/zip");
        else downloadFile("stem-playground.md", await buildMarkdownDoc(), "text/markdown");
      }

      // Paint the read-only output editor for the active text view. The "View
      // Model" view shows the view-model as highlighted YAML (no provenance); the
      // "Plain Text" view shows the output, highlighted in the example's output
      // language, with the source-map provenance as decorations.
      function paintTextView() {
        if (outputView === "bytecode") {
          lastSegViews = [];
          setOutputDoc(lastProgram ? disassemble(lastProgram) : "", Decoration.none);
        } else if (outputView === "data") {
          let text = "";
          if (lastData != null) {
            try { text = dumpYaml(lastData, { indent: 2, lineWidth: -1, noRefs: true }); }
            catch { text = String(lastData); }
          }
          lastSegViews = [];
          setOutputDoc(text, Decoration.none);
        } else if (outputView === "compiled") {
          // The template compiled to a JS module (the `compile-js` engine
          // extension). Errors come back as a `// …` comment so the pane stays
          // valid-looking JS.
          lastSegViews = [];
          let text = "// this engine has no compiler";
          if (typeof renderer.compileToJs === "function") {
            const r = renderer.compileToJs(templateSourceFor("main"), partialsMap(), { compat: minbarsCompat });
            text = r.ok ? r.value : "// compile error: " + r.error;
          }
          setOutputDoc(text, Decoration.none);
        } else if (outputView === "migrated") {
          // The template rewritten from Handlebars to MaxBars source (the
          // `migrate` engine extension). Residuals the migrator could not safely
          // rewrite are surfaced as leading `{{! … }}` MaxBars comments, so the
          // pane stays valid MaxBars and a clean migration shows pure source.
          lastSegViews = [];
          let text = "{{! this engine has no migrator }}";
          if (typeof renderer.migrate === "function") {
            const r = renderer.migrate(templateSourceFor("main"));
            if (!r.ok) {
              text = "{{! migrate error: " + r.error + " }}";
            } else {
              const head = (r.residuals || []).map((x) =>
                "{{! residual — " + x.kind + ": " + x.message +
                (x.suggestion ? " — " + x.suggestion : "") + " }}").join("\n");
              text = head ? head + "\n" + r.source : r.source;
            }
          }
          setOutputDoc(text, Decoration.none);
        } else {
          const { segViews, deco } = buildProvenance(lastOutput, lastSegments);
          lastSegViews = segViews;
          setOutputDoc(lastOutput, deco);
        }
        updateOutLang();
      }

      // Output highlight language. The choice is "Auto" (follow the example's
      // output format), "Plain text", or any of the ~140 languages in the
      // CodeMirror language registry (cmLanguages). Each registry entry lazy-loads
      // its grammar via desc.load() on first use (cached here), so the playground
      // stays light. (AsciiDoc has no CodeMirror grammar, so it is not listed.)
      let outLangChoice = "Auto";
      let lastExView = "source"; // view kind of the last loaded example; survives markCustom()

      function exViewLangName(view) {
        return view === "markdown" ? "Markdown" : view === "rendered" ? "HTML" : "Plain text";
      }
      // Reflect the current choice on the combobox trigger. "Auto" also hints the
      // format it resolves to from the active example.
      function updateLangPlaceholder() {
        byId("out-lang-val").textContent =
          outLangChoice === "Auto" ? `Auto · ${exViewLangName(lastExView)}` : outLangChoice;
      }
      const langCache = new Map(); // language name -> resolved Extension

      async function resolveLangByName(name) {
        if (name === "Plain text") return [];
        if (langCache.has(name)) return langCache.get(name);
        const desc = cmLanguages.find((l) => l.name === name);
        if (!desc) return null;
        let ext;
        try { ext = await desc.load(); } catch { ext = []; }
        langCache.set(name, ext);
        return ext;
      }

      // Resolve the active output language and apply it to the read-only editor's
      // language compartment. Render Data is always YAML; Plain Text uses the manual
      // pick, or the example's output format when "Auto". The autoswitch cases use
      // the statically-imported grammars (instant); manual picks may lazy-load, so
      // the highlight appears as soon as the grammar resolves.
      // The highlight choice is a sticky UI preference (persisted across reloads),
      // reset to "Auto" whenever an example is loaded.
      function persistOutLang() {
        try { localStorage.setItem(LS_OUTLANG, outLangChoice); } catch {}
      }

      async function updateOutLang() {
        if (outputView === "data") {
          outputEditor.dispatch({ effects: outLangComp.reconfigure([yaml(), yamlHighlighting]) });
          return;
        }
        if (outputView === "bytecode") {
          outputEditor.dispatch({ effects: outLangComp.reconfigure([bytecodeLang]) });
          return;
        }
        if (outputView === "compiled") {
          outputEditor.dispatch({ effects: outLangComp.reconfigure([jsLang]) });
          return;
        }
        if (outputView === "migrated") {
          // Migrated output is MaxBars template source — highlight it with the
          // engine's own template grammar, like the source editor.
          outputEditor.dispatch({ effects: outLangComp.reconfigure([htmlLang(), flatbarsHighlighting]) });
          return;
        }
        if (outputView !== "source") return;
        if (outLangChoice === "Auto") {
          const kind = loadedExampleIdx !== -1 ? examples[loadedExampleIdx].view : lastExView;
          const ext = kind === "markdown" ? markdown() : kind === "source" ? [] : htmlLang();
          outputEditor.dispatch({ effects: outLangComp.reconfigure(ext) });
          return;
        }
        const ext = await resolveLangByName(outLangChoice);
        if (ext != null) outputEditor.dispatch({ effects: outLangComp.reconfigure(ext) });
      }

      // Swap the output editor's document and provenance in one programmatic
      // transaction (and clear any stale caret-link highlight). Language is applied
      // separately by updateOutLang, which may lazy-load a grammar.
      function setOutputDoc(text, provenanceDeco) {
        const cur = outputEditor.state.doc.toString();
        outputEditor.dispatch({
          changes: cur === text ? undefined : { from: 0, to: cur.length, insert: text },
          effects: [
            setProvenance.of(provenanceDeco),
            setOutLink.of(Decoration.none),
          ],
        });
        caretLinkKey = null;
      }

      // Map the renderer's byte-offset segments to output character ranges in one
      // forward pass (monotonic cursor; UTF-8 widths computed arithmetically), and
      // build the provenance mark decorations. Each mark carries its index in
      // lastSegViews via data-i so hover/click can recover the segment.
      function buildProvenance(output, segments) {
        const segViews = [];
        if (!segments.length) return { segViews, deco: Decoration.none };
        let ci = 0, bytes = 0;
        const charAt = (targetByte) => {
          while (bytes < targetByte && ci < output.length) {
            const cp = output.codePointAt(ci);
            bytes += cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4;
            ci += cp > 0xffff ? 2 : 1;
          }
          return ci;
        };
        const ranges = [];
        for (const seg of segments) {
          const from = charAt(seg.out);
          if (from >= output.length) continue; // nothing to mark at/after EOF
          let to = Math.max(from + 1, charAt(seg.out + seg.len));
          if (to > output.length) to = output.length;
          const i = segViews.length;
          segViews.push({
            from, to, file: seg.file, kind: seg.kind,
            start: typeof seg.start === "number" ? seg.start : null,
            end: typeof seg.end === "number" ? seg.end : null,
          });
          ranges.push(Decoration.mark({
            class: "seg" + (seg.kind === "emit" ? " seg-expr" : ""),
            attributes: { "data-i": String(i) },
          }).range(from, to));
        }
        return { segViews, deco: Decoration.set(ranges, true) };
      }

      // Fill the iframe for the current iframe view: raw output HTML for
      // "Preview", or the output interpreted as Markdown for "Markdown". Both
      // honour the "Allow scripts" toggle, swapping to an isolated `allow-scripts`
      // sandbox (no `allow-same-origin`, so it cannot reach this page).
      function renderPreview() {
        const scripts = (outputView === "rendered" || outputView === "markdown") && allowScripts;
        const frame = byId("output-preview");
        // Only (re)assign `sandbox` when it actually changes. Re-setting the
        // attribute — even to the same value — reloads the iframe asynchronously,
        // and that reload races with the `srcdoc` set below: on load the preview
        // paints blank and only an edit (which sets `srcdoc` without re-touching
        // `sandbox`) recovers it. Guarding the attribute makes the first paint stick.
        const wantSandbox = scripts ? "allow-scripts" : "allow-same-origin";
        if (frame.getAttribute("sandbox") !== wantSandbox) frame.setAttribute("sandbox", wantSandbox);
        const body = outputView === "markdown" ? marked.parse(lastOutput) : lastOutput;
        frame.srcdoc = previewDoc(body, scripts);
      }

      // The file behind a segment ("main" is tab 0; partials are the rest).
      function tabIndexByFile(file) {
        return file === "main" ? 0 : tabs.findIndex((t, i) => i > 0 && t.name === file);
      }
      function fileSource(file) {
        const i = tabIndexByFile(file);
        return i >= 0 ? tabs[i].source : "";
      }

      function run() {
        // run() is synchronous, so once it returns the output and its segments
        // match the current sources again — clear the stale-offset guard.
        renderPending = false;
        setRecomputing(false); // I-1 · debounce window ended; clear before sync work
        lastData = null; // reset; reassigned once data is parsed + transformed below
        dockProblems = []; // success leaves this empty; error paths populate it below
        // Reset per-run analyses so a stale value never leaks into the dock.
        lastTimings = null; lastAst = null; lastDataAccess = []; lastWhitespace = [];
        lastDeps = null; lastCalls = []; lastEscapeRuns = null; lastCoverage = [];
        lastAnalyse = { ok: true, findings: [] };
        lastLint = { ok: true, findings: [] };
        lastRequiredAssigns = []; lastMissingAssigns = [];
        const dataSource = yamlSrc; // the YAML tab's source (editor may show the transform)
        const mainSource = tabs[0].source;
        const tCompileStart = performance.now();
        // Compile with span provenance so the rendered output can be mapped back
        // to its source files/tags in the Source view.
        const compiled = renderer.compile(mainSource, partialsMap(), { map: true, standalone });
        const tCompileEnd = performance.now();

        if (compiled.errors) {
          lastProgram = null;
          lastUsedTransformers = [];
          // The compiler reports every recoverable parse error in one pass, in
          // source order. Each names the file ("main" or a partial) it occurred
          // in; map its byte span into that file's source for line/column, and
          // underline only the errors in the tab currently shown.
          const activeFile = tabs[activeTabIdx]?.name;
          const diags = [];
          const seen = new Set();
          const problems = [];
          for (const e of compiled.errors) {
            const file = e.file || "main";
            const src = fileSource(file);
            const [from, to] = byteRangeToCharRange(src, e.start, e.end);
            const pos = charToLineColumn(src, from);
            // Dedupe identical errors (e.g. a partial expanded at several sites).
            const key = `${file}:${pos.line}:${pos.column}:${e.message}`;
            if (seen.has(key)) continue;
            seen.add(key);
            if (file === activeFile) diags.push({ from, to, severity: "error", message: e.message });
            problems.push({ severity: "error", file, line: pos.line, col: pos.column, message: e.message });
          }
          updateDiagnostics(diags);
          const more = problems.length > 1 ? ` (+${problems.length - 1} more)` : "";
          const first = problems[0];
          setError(`compile error: ${first.file} · ${first.message} (Ln ${first.line}, Col ${first.col})${more}`);
          dockProblems = problems;
          renderDock();
          setOutput(""); saveHash(); return;
        }

        lastProgram = compiled.program;
        lastUsedTransformers = renderer.usedTransformers(compiled.program);
        lastRequiredAssigns = renderer.requiredAssigns(compiled.program);
        clearDiagnostics();

        // Static analyses — every panel that doesn't need rendered output runs
        // here. parseAst is best-effort: a parse error on a partial leaves an
        // empty AST for that file so the dock degrades gracefully.
        const tParseStart = performance.now();
        const astsByFile = {};
        const mainAst = renderer.parseAst(mainSource);
        astsByFile.main = mainAst.ast ? mainAst.ast.nodes : [];
        for (const [name, src] of Object.entries(partialsMap())) {
          const a = renderer.parseAst(src);
          astsByFile[name] = a.ast ? a.ast.nodes : [];
        }
        lastAst = astsByFile;
        lastCalls = analyseCalls(astsByFile);
        lastEscapeRuns = analyseEscapeRuns(astsByFile);
        lastDeps = buildDependencyGraph(astsByFile);
        lastWhitespace = [];
        for (const [file, src] of [["main", mainSource]].concat(Object.entries(partialsMap()))) {
          for (const w of analyseWhitespace(src, file)) lastWhitespace.push(w);
        }
        const tParseEnd = performance.now();

        let data;
        try {
          data = loadYaml(dataSource || "null");
          if (typeof data === "undefined") data = null;
        } catch (err) {
          setError("invalid YAML: " + err.message);
          dockProblems = [{ severity: "error", file: "data.yaml", line: (err.mark?.line ?? 0) + 1, col: (err.mark?.column ?? 0) + 1, message: "YAML · " + err.message }];
          setOutput(""); saveHash(); return;
        }

        // Data overlays (Phase 3) — parse each overlay's YAML, then deep-merge
        // them onto `data` in tab order. A per-overlay YAML parse error fails
        // the whole render the same way `data.yaml` does, attributed to the
        // overlay's tab. Type clashes (`object` vs `scalar` at the same path)
        // become warn-severity Problems rows but don't abort the render.
        const parsedOverlays = [];
        for (const ov of dataOverlays) {
          if (!ov.source.trim()) continue;
          try {
            const value = loadYaml(ov.source);
            parsedOverlays.push({ name: ov.name, value });
          } catch (err) {
            setError("invalid YAML: " + ov.name + " · " + err.message);
            dockProblems = [{
              severity: "error", file: ov.name,
              line: (err.mark?.line ?? 0) + 1, col: (err.mark?.column ?? 0) + 1,
              message: "YAML · " + err.message,
            }];
            setOutput(""); saveHash(); return;
          }
        }
        const overlayResult = mergeDataOverlays(data, parsedOverlays);
        data = overlayResult.merged;
        for (const c of overlayResult.clashes) {
          dockProblems.push({
            severity: "missing", // re-use the warn-colour Problems styling
            file: "data.yaml", line: 1, col: 1,
            message: `overlay clash at \`${c.path || "(root)"}\` — ${c.was} replaced by ${c.now}`,
          });
        }

        // Transform step: a JSONata data → view-model preprocess (all engines).
        // Custom helpers are a separate concern, applied at render below.
        if (transformSrc.trim()) {
          try {
            data = jsonata(transformSrc).evaluate(data);
          } catch (err) {
            lastData = null;
            const message = "transform · " + (err.message || err.code || "invalid JSONata");
            setError("transform error: " + (err.message || err.code || "invalid JSONata"));
            dockProblems = [{ severity: "error", file: "transform", line: 1, col: 1, message }];
            setOutput(""); saveHash(); return;
          }
        }
        lastData = data; // expose the view-model to the "Render Data" output view

        // Inject catalog-driven transformer lists for the cheat-sheet example so
        // the template never hard-codes transformer metadata. The original data.yaml
        // carries `categories` / `overrides` / `entries` on each group; this step
        // populates `transformers` from the live engine catalog.
        if (loadedExampleIdx >= 0 && examples[loadedExampleIdx]?.id === "cheat-sheet") {
          data = buildCheatSheetData(data, renderer.catalog());
          lastData = data;
        }

        // Data-aware analyses, now that the view-model is finalized. Coverage
        // uses the engine's default truthiness for dead-branch classification.
        lastDataAccess = analyseDataAccess(astsByFile, data);
        lastCoverage = analyseCoverage(astsByFile, data);
        // ADR-022: trace the render and collect the truthiness portability
        // findings for the Truthiness dock panel (FlatBars engine only). ADR-030:
        // when config.yaml declares safe paths, route through analyzeWith so the
        // panel suppresses those paths' potential + miss findings.
        lastAnalyseSuppressed = 0;
        if (typeof renderer.analyze !== "function") {
          lastAnalyse = { ok: true, findings: [] };
        } else if (labPathSchema.length && typeof renderer.analyzeWith === "function") {
          // ADR-030: the schema'd pass is what the panel shows; an unschema'd pass
          // counts how many potential/miss findings the schema removed (advisory
          // findings only — observed findings are never suppressed).
          lastAnalyse = renderer.analyzeWith((p) => !labPathSchema.includes(p), { source: mainSource }, data);
          const unsch = renderer.analyze({ source: mainSource }, data);
          const advisory = (r) => (r.findings || []).filter((f) => f.kind === "potential" || f.kind === "miss").length;
          if (lastAnalyse.ok && unsch.ok) lastAnalyseSuppressed = Math.max(0, advisory(unsch) - advisory(lastAnalyse));
        } else {
          lastAnalyse = renderer.analyze({ source: mainSource }, data);
        }
        // ADR-019: deprecated-alias + non-canonical scoped-variable findings for
        // the active dialect (the Lint dock panel; FlatBars engines only).
        lastLint = typeof renderer.lint === "function"
          ? renderer.lint(mainSource)
          : { ok: true, findings: [] };
        refreshCoverageGutter();
        // Engine-reported assigns that aren't present at the data root — a
        // tight, false-positive-free "missing assigns" signal (Data Access).
        const dataKeys = (data && typeof data === "object" && !Array.isArray(data))
          ? new Set(Object.keys(data)) : new Set();
        lastMissingAssigns = lastRequiredAssigns.filter((n) => !dataKeys.has(n));
        // Promote each missing assign to a Problems row at warn severity, so
        // the dock's auto-open behaviour fires for a missing key just like it
        // does for compile errors. The first source span that references the
        // assign is the jump target; locating it by re-using the data-access
        // walk (which already classifies bare identifiers).
        for (const name of lastMissingAssigns) {
          const firstHit = lastDataAccess.find((r) => r.path === name || r.path.startsWith(name + "."));
          const file = firstHit?.file || "main";
          const src = fileSource(file);
          const pos = firstHit && typeof firstHit.start === "number"
            ? charToLineColumn(src, byteRangeToCharRange(src, firstHit.start, firstHit.end)[0])
            : { line: 1, column: 1 };
          dockProblems.push({
            severity: "missing",
            file, line: pos.line, col: pos.column,
            message: `missing assign '${name}' — referenced by the template but not present in data`,
          });
        }

        const tRenderStart = performance.now();
        // Transformer allow-list (Render Config, ADR-0013) — refuse to render
        // when the compiled program calls a name outside the configured
        // positive list. `allowList === null` (the default) means "no
        // constraint": every built-in is callable. Mirrors a host policy
        // refusal: amber "cap" Problems row, no output. Analyses above still
        // ran, so the dock can show what was used and why it was blocked.
        const denied = allowList !== null
          ? [...new Set(lastUsedTransformers.filter((n) => !allowList.includes(n)))]
          : [];
        if (denied.length) {
          const plural = denied.length > 1 ? "s" : "";
          setError(`not in allow-list: transformer${plural} '${denied.join("', '")}'`);
          dockProblems.push({
            severity: "cap", file: "main", line: 1, col: 1,
            message: `transformer${plural} '${denied.join("', '")}' not in the render-config allow-list — add to \`transformers.allow\` to render`,
          });
          setOutput(""); renderDock(); saveHash();
          lastTimings = null;
          return;
        }
        try {
          const program = applyEscape(compiled.program, escapeMode);
          // Custom-helper render (ADR-018/019): the registerHelper source runs in
          // the Worker sandbox, out of band. Use the cached result when it
          // matches the current inputs; otherwise show "rendering…" and let the
          // async render re-run. Provenance segments aren't produced for helper
          // renders (as the in-process renderWith path also returns none).
          // Both helpers.js and the catalog (t/number/…) work on every FlatBars
          // dialect — the t-surfaces RawBars/FullBars/MaxBars (ADR-029) — MinBars
          // excluded (logic-less). The Worker routes each to the dialect's
          // operations-aware entry (renderRawWith/renderWith/renderMaxWith), with
          // the locale from config.yaml.
          const helperSrc = (ENGINE !== "minbars") ? (helpersSrc || "").trim() : "";
          const catSrc = (ENGINE !== "minbars") ? (catalogSource || "").trim() : "";
          let output, segments;
          if (helperSrc || catSrc) {
            const key = helperKey(mainSource, partialsMap(), data, helperSrc, catSrc, labLocale, ENGINE);
            if (helperCache.key !== key) {
              requestHelperRender(key, { dialect: ENGINE, template: mainSource, data, partials: partialsMap(), helperSrc, catalogSrc: catSrc, locale: labLocale });
              setOutput("rendering…"); setError(""); renderDock(); saveHash(); lastTimings = null;
              return;
            }
            if (helperCache.error) {
              setError(helperCache.error); setOutput(""); renderDock(); saveHash(); lastTimings = null;
              return;
            }
            output = helperCache.output; segments = [];
          } else {
            ({ output, segments } = renderer.render(program, data, { map: true, compat: minbarsCompat }));
          }
          setOutput(output, segments);
          setError("");
        } catch (err) {
          // `err.kind === "policy"` flags an allow-list / `eval`-gate refusal
          // (badged amber); anything else is a runtime render error (red).
          const isPolicy = err && err.kind === "policy";
          // The engine prefixes a located error with `line:col: ` — lift that into
          // the problem's position so the header reads e.g. `main:15:1` (not the
          // default `main:1:1`), and drop the now-redundant prefix from the message.
          let line = 1, col = 1, message = (err && err.message) || String(err);
          const at = /^(\d+):(\d+):\s*/.exec(message);
          if (at) { line = +at[1]; col = +at[2]; message = message.slice(at[0].length); }
          setError("render error: " + message);
          dockProblems = [{ severity: isPolicy ? "cap" : "render", file: "main", line, col, message }];
          setOutput("");
        }
        const tRenderEnd = performance.now();
        lastTimings = {
          parseMs: tParseEnd - tParseStart,
          compileMs: tCompileEnd - tCompileStart,
          renderMs: tRenderEnd - tRenderStart,
          totalMs: (tCompileEnd - tCompileStart) + (tParseEnd - tParseStart) + (tRenderEnd - tRenderStart),
          outBytes: (lastOutput || "").length,
        };
        renderDock();
        saveHash();
        // Re-apply the caret→output highlight against the freshly rendered runs.
        caretLinkKey = null;
        syncOutputToCaret();
      }

      const debouncedRun = debounce(run, 100);

      // True between a source edit and the debounced render that follows it: in
      // that window the output segments still carry the pre-edit byte offsets, so
      // the hover link-highlight is suppressed to avoid pointing at stale source.
      let renderPending = false;
      function scheduleRun() { markCustom(); renderPending = true; setRecomputing(true); debouncedRun(); }

      function updateDiagnostics(diags) {
        templateDiagnostics = diags;
        templateView.dispatch({ effects: setDiagnosticsEffect.of(diags) });
      }
      function clearDiagnostics() {
        if (!templateDiagnostics.length) return;
        templateDiagnostics = [];
        templateView.dispatch({ effects: setDiagnosticsEffect.of([]) });
      }

      // ── Status bar ────────────────────────────────────────────────────
      // I-1 · toggles the "recomputing…" indicator during the debounce window.
      function setRecomputing(on) {
        const ind = byId("recompute-ind");
        if (ind) ind.hidden = !on;
      }

      function setError(msg) {
        const bar = qs(".statusbar");
        const txt = byId("status-msg");
        if (msg) { bar.classList.add("has-error"); txt.textContent = msg; }
        else { bar.classList.remove("has-error"); txt.textContent = "no errors"; }
      }

      function escapeHtml(s) {
        return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      }

      function updateStatusMeta() {
        // The inspector tabs have no editor/caret — show a plain label.
        if (activeView === "data" && isInspectTab(dataTab)) {
          const name = dataTab === "context" ? "Context Inspector" : "Syntax Tree";
          byId("status-meta").innerHTML = `<b>${name}</b>  ·  read-only`;
          return;
        }
        const view = (activeView === "data" || activeView === "config" || activeView === "catalog") ? dataView : templateView;
        const sel  = view.state.selection.main;
        const line = view.state.doc.lineAt(sel.head);
        const col  = sel.head - line.from + 1;
        // Active source filename for the status bar. In the template pane:
        // either an overlay name, the JSONata transform, or the current
        // template tab. In the data pane: an overlay name or `data.yaml`.
        const overlay = activeView === "data" ? overlayByName(dataFile) : null;
        const fileName = activeView === "config" ? "config.yaml"
          : activeView === "catalog" ? "catalog.yaml"
          : activeView !== "data"
            ? (templateMode === "transform" ? "transform" : templateMode === "helpers" ? "helpers.js" : activeTab().name)
            : overlay ? overlay.name + ".yaml" : "data.yaml";
        // Just the caret location — the language is implied by the active tab and
        // the encoding is always UTF-8, so both were noise.
        byId("status-meta").innerHTML =
          `<b>${escapeHtml(fileName)} · Ln ${line.number}, Col ${col}</b>`;
      }

      // ── Output view ───────────────────────────────────────────────────
      // Valid output views; anything else — an old share link, or a view the
      // loaded engine doesn't expose (ADR-0020 gate, e.g. `bytecode` without
      // `bytecode-wire`) — falls back to the always-present iframe Preview.
      const validView = (v) => ovValidView(v, engineFeatures);

      // The output view tabs + the visible/valid decisions live in
      // lab/output-view.mjs (extracted for testability). These thin wrappers bind
      // the engine's advertised features so existing call sites stay arg-free.
      const visibleViews = () => ovVisibleViews(engineFeatures);

      function templateSourceFor(file) {
        if (file === "main") return tabs[0]?.source || "";
        return partialsMap()[file] || "";
      }

      function renderViewTabs() {
        const bar = byId("view-tabs");
        bar.innerHTML = "";
        for (const { view, label } of visibleViews()) {
          const b = document.createElement("button");
          b.className = "view-tab" + (outputView === view ? " active" : "");
          b.setAttribute("role", "tab");
          b.setAttribute("aria-selected", outputView === view ? "true" : "false");
          b.textContent = label;
          b.addEventListener("click", () => {
            if (outputView === view) return;
            setOutputView(view);
            run();
          });
          bar.append(b);
        }
      }

      function setOutputView(view) {
        outputView = view;
        // Text views (Plain Text / Render Data / Bytecode / Compiled JS /
        // Truthiness) paint into the editor; "rendered"/"markdown" use the iframe.
        // `applyView` (lab/output-view.mjs) toggles the panes and reports the kind.
        const isText =
          applyView({ text: byId("output-text"), preview: byId("output-preview") }, view) === "text";
        hideSegTip(); clearLink();
        renderViewTabs();
        // Contextual controls row: only the highlight-language picker, shown for
        // the Plain Text (Source) view. (Scripts always run in previews now; the
        // escape/trim options live in the Render Config file.)
        const showLang = view === "source";
        byId("out-lang").hidden = !showLang;
        byId("out-lang-label").hidden = !showLang;
        byId("view-controls").hidden = !showLang;
        // Text views paint synchronously. The preview iframe is deferred to the
        // next frame: switching *to* the preview (on example load / a shared
        // "rendered" deep-link) runs before run() has recomputed `lastOutput`, so a
        // synchronous paint would show the PREVIOUS example's output ("renders to
        // old content"), and the visibility change races the srcdoc set. By the
        // time the frame fires, run() has updated `lastOutput` and layout settled —
        // one clean paint of the current render. (Edits paint via setOutput, which
        // calls renderPreview directly, so they stay instant.)
        if (isText) { paintTextView(); outputEditor.requestMeasure(); }
        else requestAnimationFrame(renderPreview);
        qs(".output-body").dataset.empty = outputHasContent(view) ? "false" : "true";
        caretLinkKey = null; syncOutputToCaret();
        // Re-render the dock (Coverage panel) and the inspector pane (Context
        // Inspector) so their render-only placeholders show when switching
        // into a render-only view and revert to live data on switch back.
        renderDock();
        renderDataInspect();
      }

      // ── Source-map interactions (Source view) ─────────────────────────
      const segTip = byId("seg-tip");
      function hideSegTip() { segTip.hidden = true; }

      function appendHint() {
        const hint = document.createElement("div");
        hint.className = "seg-tip-hint";
        hint.textContent = "click to jump to source";
        segTip.append(hint);
      }

      function showSegTip(sv, anchorEl) {
        const file = sv.file;
        const isExpr = sv.kind === "emit";
        const isError = sv.kind === "error";
        segTip.textContent = "";

        // Header forms:
        //   render emit/literal:  "expression from main template"
        //   transpile emit/lit.:  "expression transpiled from main template"
        //   transpile error:      "transpile error at main template"
        const head = document.createElement("div");
        const kindEl = document.createElement("b");
        kindEl.textContent = isError
          ? "transpile error"
          : isExpr ? "expression" : "literal";
        const connector = isError ? " at " : " from ";
        head.append(kindEl, document.createTextNode(connector));
        const fileEl = document.createElement("span");
        fileEl.className = "seg-tip-file";
        fileEl.textContent = file;
        head.append(fileEl, document.createTextNode(file === "main" ? " template" : " partial"));
        segTip.append(head);

        // For expressions, show the originating tag (literals just echo the
        // output, so a snippet would be redundant).
        if (isExpr && sv.start !== null) {
          const src = fileSource(file);
          const [s, e] = byteRangeToCharRange(src, sv.start, sv.end);
          const tag = src.slice(s, e).trim();
          if (tag) {
            const code = document.createElement("code");
            code.textContent = tag;
            segTip.append(code);
          }
        }

        appendHint();

        // Position above the segment, flipping below / clamping to the viewport.
        segTip.hidden = false;
        const r = anchorEl.getBoundingClientRect();
        const t = segTip.getBoundingClientRect();
        let top = r.top - t.height - 6;
        if (top < 4) top = r.bottom + 6;
        let left = Math.min(r.left, window.innerWidth - t.width - 6);
        segTip.style.top = `${top}px`;
        segTip.style.left = `${Math.max(4, left)}px`;
      }

      // Mirror an output-run hover into the source. `linkState` (the run's
      // "file:start:end") dirty-checks the editor/tab mutation so a sweep across
      // many segments doesn't thrash; `linkedTabEl` tracks any tinted tab.
      let linkState = null;
      let linkedTabEl = null;
      let outHoverActive = false; // whether the output hover decoration is set

      // Highlight the hovered run across its WHOLE output range (every wrapped
      // line), and clear it. Separate from clearLink's tab/source bookkeeping so
      // the scroll handler can clear cheaply without a redundant transaction.
      function setOutSegHover(sv) {
        outputEditor.dispatch({ effects: setOutHover.of(Decoration.set([outHoverMark.range(sv.from, sv.to)])) });
        outHoverActive = true;
      }
      function clearOutSegHover() {
        if (!outHoverActive) return;
        outputEditor.dispatch({ effects: setOutHover.of(Decoration.none) });
        outHoverActive = false;
      }

      function clearLink() {
        clearOutSegHover();
        if (linkState === null && !linkedTabEl) return;
        linkState = null;
        if (linkedTabEl) { linkedTabEl.classList.remove("tab-linked"); linkedTabEl = null; }
        templateView.dispatch({ effects: setLinkHighlight.of(null) });
      }

      // If the run's source file is the one shown in the template editor,
      // highlight its span there (no caret move); otherwise tint that file's tab.
      // Suppressed mid-edit (renderPending), when the segment offsets are stale.
      function linkHover(sv) {
        if (renderPending || sv.start === null) return;
        const file = sv.file;
        const start = sv.start, end = sv.end;
        const idx = tabIndexByFile(file);
        const active = idx === activeTabIdx;

        // Refine the tooltip hint every hover (the tooltip is rebuilt each time).
        const hint = segTip.querySelector(".seg-tip-hint");
        if (hint) {
          hint.textContent = active ? "click to place the cursor"
            : idx >= 0 ? `click to open the ${file} tab`
            : "click to jump to source";
        }

        const key = `${file}:${start}:${end}`;
        if (key === linkState) return; // highlight already applied — skip the work
        linkState = key;
        if (linkedTabEl) { linkedTabEl.classList.remove("tab-linked"); linkedTabEl = null; }

        if (active) {
          const [from, to] = byteRangeToCharRange(tabs[idx].source, start, end);
          templateView.dispatch({ effects: setLinkHighlight.of({ from, to }) });
        } else {
          templateView.dispatch({ effects: setLinkHighlight.of(null) });
          const tabEl = idx >= 0 ? byId("tmpl-tabs").children[idx] : null;
          if (tabEl) { tabEl.classList.add("tab-linked"); linkedTabEl = tabEl; }
        }
      }

      // Reverse direction: the template caret highlights the output run(s) it
      // produced, as a `.cm-out-linked` decoration over their output ranges. A
      // caret byte offset matches a run when the file agrees and start <= byte < end.
      let caretLinkKey = null; // dirty-check: `${file}:${byteOffset}`
      // Suppress auto-paint on the default caret-at-byte-0 position that a
      // fresh switch into Plain Text would otherwise hit: a literal-text
      // segment that covers byte 0 would light up its whole (often multi-line)
      // output range with no user interaction to attribute it to. Flips true
      // on the first source-editor selection change (click / arrow / type)
      // and never resets — once the user has interacted, all subsequent
      // moves sync as expected.
      let userMovedCaret = false;

      function syncOutputToCaret() {
        // Suppressed mid-render (offsets stale), when the Plain Text view is
        // not showing, and on the default boot caret before any user interaction.
        if (renderPending || outputView !== "source" || !userMovedCaret) {
          outputEditor.dispatch({ effects: setOutLink.of(Decoration.none) });
          caretLinkKey = null;
          return;
        }
        const file = activeTabIdx === 0 ? "main" : activeTab().name;
        const src = templateView.state.doc.toString();
        const caretChar = templateView.state.selection.main.head;
        const byte = charToByte(src, caretChar);

        // A `{{> name}}` tag expands inline and emits no run of its own, so a
        // caret on it has no covering span; map it to every run that partial
        // produced instead.
        const partial = partialNameAt(src, caretChar);
        const key = partial ? `>${partial}` : `${file}:${byte}`;
        if (key === caretLinkKey) return;
        caretLinkKey = key;
        const ranges = [];
        for (const sv of lastSegViews) {
          const hit = partial
            ? sv.file === partial
            : (sv.file === file && sv.start !== null && sv.start <= byte && byte < sv.end);
          if (hit) ranges.push(outLinkMark.range(sv.from, sv.to));
        }
        outputEditor.dispatch({ effects: setOutLink.of(Decoration.set(ranges, true)) });
      }

      // Jump from a rendered run to the file/tag that produced it: open the file's
      // tab and, for an expression, select its source span in the editor.
      function openSourceLocation(file, start, end) {
        const idx = tabIndexByFile(file);
        if (idx < 0) return;
        clearLink();
        selectTemplateTab(idx);
        templateView.focus();
        if (start !== null) {
          const [from, to] = byteRangeToCharRange(tabs[idx].source, start, end);
          templateView.dispatch({ selection: { anchor: from, head: to }, scrollIntoView: true });
        }
        hideSegTip();
      }

      // Keyboard parity: Enter on the output editor jumps from the run under the
      // cursor to its source (arrows/Home/End navigate via the default keymap).
      function jumpToSourceAtCursor(view) {
        if (outputView !== "source" || !lastSegViews.length)
          return false;
        const pos = view.state.selection.main.head;
        const sv = lastSegViews.find((s) => pos >= s.from && pos < s.to)
          || lastSegViews.find((s) => pos === s.to);
        if (!sv) return false;
        openSourceLocation(sv.file, sv.start, sv.end);
        return true;
      }

      // Hover/click on the output editor's runs. The provenance marks render as
      // `.seg` spans carrying data-i (index into lastSegViews); event delegation
      // on the stable contentDOM survives CM's viewport re-rendering.
      (() => {
        const content = outputEditor.contentDOM;
        const svOf = (el) => { const s = el?.closest?.(".seg"); return s ? lastSegViews[Number(s.dataset.i)] : null; };
        // Debounce hover so sweeping the pointer across many runs only shows the
        // tooltip + link-highlight for the run the pointer settles on.
        let hoverTimer = null;
        const cancelHover = () => { if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; } };
        content.addEventListener("mouseover", (e) => {
          const el = e.target.closest?.(".seg");
          const sv = svOf(el);
          if (!sv) return;
          cancelHover();
          hoverTimer = setTimeout(() => { hoverTimer = null; showSegTip(sv, el); linkHover(sv); setOutSegHover(sv); }, 55);
        });
        content.addEventListener("mouseout", (e) => {
          if (e.target.closest?.(".seg")) { cancelHover(); hideSegTip(); clearLink(); }
        });
        outputEditor.scrollDOM.addEventListener("scroll", () => { cancelHover(); hideSegTip(); clearLink(); });
        content.addEventListener("click", (e) => {
          const sv = svOf(e.target);
          if (!sv) return;
          openSourceLocation(sv.file, sv.start, sv.end);
          // Context Inspector reads scope at a Plain-Text output span; other
          // views share the seg/click model only for caret navigation, so the
          // dock auto-switch would be a surprise here.
          if (outputView === "source") setContextTarget(sv);
        });
      })();

      // ── Splitter ──────────────────────────────────────────────────────
      let splits = { w0: null, h0: null, ew: null, eh: null };
      try { const r = localStorage.getItem(LS_SPLIT); if (r) splits = { ...splits, ...JSON.parse(r) }; } catch {}

      function saveSplits() { try { localStorage.setItem(LS_SPLIT, JSON.stringify(splits)); } catch {} }

      function isStacked() { return false; } // layout is always split (Sources ←→ Output)

      // Generic two-child flex splitter. axisRow() reports whether the container
      // currently lays its children in a row (resize width) or column (resize
      // height) — so one helper drives both the workspace and the editors, whose
      // orientations are perpendicular and flip with the layout.
      function makeSplitter({ el, container, first, second, axisRow, keyRow, keyCol, min, ratio }) {
        // Splits are stored as a fraction of the usable space (not pixels), so a
        // browser-canvas resize keeps the panes' proportions instead of pinning
        // the first pane to a fixed width.
        function size() {
          if (!container) return;
          const row = axisRow();
          const total = row ? container.clientWidth : container.clientHeight;
          if (total <= 0) return;
          const usable = total - 6;
          const key = row ? keyRow : keyCol;
          const minR = min / usable;
          let r = splits[key] ?? ratio;
          r = Math.max(minR, Math.min(1 - minR, r));
          splits[key] = r;
          first.style.flex = `0 0 ${r * usable}px`;
          second.style.flex = "1 1 0";
          // L-2 · expose the live ratio to assistive tech.
          el.setAttribute("aria-orientation", row ? "vertical" : "horizontal");
          el.setAttribute("aria-valuemin", "0");
          el.setAttribute("aria-valuemax", "100");
          el.setAttribute("aria-valuenow", String(Math.round(r * 100)));
        }
        el.addEventListener("mousedown", (e) => {
          e.preventDefault();
          el.classList.add("dragging");
          const row = axisRow();
          document.body.classList.add(row ? "dragging-col" : "dragging-row");
          const rect = container.getBoundingClientRect();
          const key = row ? keyRow : keyCol;
          const usable = (row ? rect.width : rect.height) - 6;
          const startPx = (splits[key] ?? ratio) * usable;
          const startPos = row ? e.clientX : e.clientY;
          const onMove = (ev) => {
            const cur = row ? ev.clientX : ev.clientY;
            const px = Math.max(min, Math.min(usable - min, startPx + (cur - startPos)));
            splits[key] = px / usable;
            size();
          };
          const onUp = () => {
            el.classList.remove("dragging");
            document.body.classList.remove("dragging-col", "dragging-row");
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
            saveSplits();
          };
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        });
        el.addEventListener("dblclick", () => {
          splits[keyRow] = null; splits[keyCol] = null; size(); saveSplits();
        });
        // L-2 · keyboard a11y — a focusable separator resized with the arrow keys
        // (Shift = larger step), reset with Enter/Space, snapped with Home/End.
        el.setAttribute("role", "separator");
        el.tabIndex = 0;
        if (!el.getAttribute("aria-label"))
          el.setAttribute("aria-label", "Resize panes — arrow keys to move, Enter to reset");
        el.addEventListener("keydown", (e) => {
          const row = axisRow();
          const key = row ? keyRow : keyCol;
          const step = e.shiftKey ? 0.05 : 0.02;
          const cur = splits[key] ?? ratio;
          let handled = true;
          if (e.key === "ArrowLeft" || e.key === "ArrowUp") splits[key] = cur - step;
          else if (e.key === "ArrowRight" || e.key === "ArrowDown") splits[key] = cur + step;
          else if (e.key === "Home") splits[key] = 0;
          else if (e.key === "End") splits[key] = 1;
          else if (e.key === "Enter" || e.key === " ") { splits[keyRow] = null; splits[keyCol] = null; }
          else handled = false;
          if (handled) { e.preventDefault(); size(); saveSplits(); }
        });
        return size;
      }

      let sizeWorkspace = () => {};
      let sizeEditors = () => {};
      let sizeExplorer = () => {};
      let sizeInspect = () => {};
      function applySplits() { sizeExplorer(); sizeWorkspace(); sizeEditors(); sizeInspect(); }

      // ── Focus mode ────────────────────────────────────────────────────
      function setFocus(mode) {
        focusMode = mode;
        const ws = qs(".workspace");
        ws.classList.remove("focus-sources", "focus-output");
        for (const b of document.querySelectorAll(".focus-toggle")) b.classList.remove("on");
        if (mode) {
          ws.classList.add("focus-" + mode);
          const btn = document.querySelector(`.focus-toggle[data-pane="${mode}"]`);
          if (btn) btn.classList.add("on");
        }
      }
      function toggleFocus(mode) { setFocus(focusMode === mode ? null : mode); }

      // ── Examples ──────────────────────────────────────────────────────
      // The example picker is a custom dropdown (see the markup note): build the
      // menu items, wire the trigger to open it downward, and close on
      // click-outside / Escape.
      // The example dropdown items are Preact-rendered into the static
      // `#example-menu` <ul>; the trigger toggles the menu's `hidden`. Re-rendered
      // on open so the loaded example shows as active.
      function renderExampleMenu() {
        render(
          html`${examples.map((ex, i) => html`<li class=${"dropdown-item" + (i === loadedExampleIdx ? " active" : "")} role="option" onClick=${() => { closeExampleMenu(); loadExample(i); }}>${ex.label}</li>`)}`,
          byId("example-menu")
        );
      }

      // L-2 · keyboard navigation for the custom menu dropdowns (example, share).
      // The trigger opens on ↓/↑/Enter/Space and moves focus into the list; within
      // the list ↑/↓/Home/End roam, Enter/Space activate, Esc/Tab close and return
      // focus to the trigger. Items are queried live each time so a re-rendered
      // menu (the example list is Preact-rendered on open) is always current.
      function wireMenuKeyboard(trigger, menu, { open, close, isOpen }) {
        const items = () => Array.from(menu.querySelectorAll(".dropdown-item:not([hidden])"));
        const focusAt = (list, i) => {
          list.forEach((el, j) => { el.tabIndex = j === i ? 0 : -1; });
          list[i]?.focus();
        };
        trigger.addEventListener("keydown", (e) => {
          if (["ArrowDown", "ArrowUp", "Enter", " "].includes(e.key)) {
            e.preventDefault();
            if (!isOpen()) open();
            requestAnimationFrame(() => {
              const list = items();
              if (list.length) focusAt(list, e.key === "ArrowUp" ? list.length - 1 : 0);
            });
          }
        });
        menu.addEventListener("keydown", (e) => {
          const list = items();
          if (!list.length) return;
          const i = list.indexOf(document.activeElement);
          if (e.key === "ArrowDown") { e.preventDefault(); focusAt(list, i < 0 ? 0 : (i + 1) % list.length); }
          else if (e.key === "ArrowUp") { e.preventDefault(); focusAt(list, i <= 0 ? list.length - 1 : i - 1); }
          else if (e.key === "Home") { e.preventDefault(); focusAt(list, 0); }
          else if (e.key === "End") { e.preventDefault(); focusAt(list, list.length - 1); }
          else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); (list[i] || document.activeElement)?.click(); }
          else if (e.key === "Escape" || e.key === "Tab") { close(); trigger.focus(); }
        });
      }

      function buildExampleSelect() {
        renderExampleMenu();
        byId("example-trigger").addEventListener("click", () => {
          byId("example-menu").hidden ? openExampleMenu() : closeExampleMenu();
        });
        wireMenuKeyboard(byId("example-trigger"), byId("example-menu"), {
          open: openExampleMenu, close: closeExampleMenu,
          isOpen: () => !byId("example-menu").hidden,
        });
      }

      function openExampleMenu() {
        renderExampleMenu(); // reflect the loaded example as active
        byId("example-menu").hidden = false;
        byId("example-select").dataset.open = "true";
        byId("example-trigger").setAttribute("aria-expanded", "true");
      }

      function closeExampleMenu() {
        byId("example-menu").hidden = true;
        byId("example-select").dataset.open = "false";
        byId("example-trigger").setAttribute("aria-expanded", "false");
      }

      function setExampleLabel(text) {
        byId("example-label").textContent = text;
      }

      async function loadExample(idx) {
        const ex = examples[idx];
        if (!ex) return;
        const dir = `${EXAMPLES_BASE}${ex.id}/`;
        const [mainSrc, dataText, ...partialSrcs] = await Promise.all([
          fetch(dir + ex.main).then((r) => r.text()),
          fetch(dir + ex.data).then((r) => r.text()),
          // Partials share the entry template's extension (`.stem` for Stem,
          // `.hbs` for the Handlebars catalog), derived from `ex.main`.
          ...ex.partials.map((name) =>
            fetch(`${dir}${name}.${ex.main.split(".").pop()}`).then((r) => r.text())),
        ]);
        tabs = [{ name: "main", source: mainSrc }];
        ex.partials.forEach((name, i) => tabs.push({ name, source: partialSrcs[i] }));
        activeTabIdx = 0; activeView = "tmpl";
        // Examples ship their data as YAML; an optional transform is the Controller.
        yamlSrc = dataText;
        transformSrc = ex.transform
          ? await fetch(dir + ex.transform).then((r) => r.text())
          : "";
        helpersSrc = ""; // catalog examples carry no custom helpers
        catalogSource = ""; catalogDirty = false; labLocale = "en"; // i18n reset (ADR-029)
        labPathSchema = []; // ADR-030 path-schema reset
        // Reset + load data overlays from the manifest, if any. Each entry
        // is `{ name, file }` — name is the slash-path the overlay mounts
        // at, file is fetched alongside data.yaml. A stale overlay from
        // the previous workspace would silently affect this example's
        // render, so the reset is unconditional.
        dataOverlays = [];
        if (Array.isArray(ex.overlays) && ex.overlays.length) {
          const overlayTexts = await Promise.all(
            ex.overlays.map((o) => fetch(dir + o.file).then((r) => r.text()))
          );
          ex.overlays.forEach((o, i) => {
            dataOverlays.push({ name: o.name, source: overlayTexts[i], dirty: false });
          });
        }
        dataTab = "edit"; dataFile = "data"; openEditors = autoOpenEditors();
        templateMode = "tmpl";
        showDataTab();
        escapeMode = "";
        byId("escape-select").value = "";
        standalone = true;
        minbarsCompat = true; // default mustacheJs (ADR-029)
        allowList = null;
        syncStandaloneUI();
        updateRenderStatus();
        setExampleLabel(ex.label);
        { const s = byId("vendored-source"); if (s) s.hidden = true; } // catalog example: no vendored source
        loadedExampleIdx = idx;
        exampleModified = false;
        tabs.forEach(t => { t.dirty = false; });
        yamlDirty = false; transformDirty = false;
        outLangChoice = "Auto";
        persistOutLang();
        lastExView = ex.view;
        updateLangPlaceholder();
        setOutputView(validView(ex.view));
        showActiveTab(); run();
      }

      // ── Vendored conformance fixtures (example-loader-spec.md §8, E2) ──────
      // `?vendored=<id>` deep-links a fixture from the vendored corpus
      // (lab/examples/vendored/<id>.json). The fixture must run under
      // its own dialect engine, so if the boot engine differs we re-navigate with
      // the right `?engine=`. The whole path is gated on the param — it never runs
      // for a normal Lab session.
      async function loadVendoredById(id) {
        let fx;
        try {
          const res = await fetch(`./examples/vendored/${id}.json`);
          if (!res.ok) throw new Error("HTTP " + res.status);
          fx = await res.json();
        } catch (e) {
          // Fall back to the default example so the Lab still boots usefully.
          const def = examples.findIndex((e2) => e2.id === "greeting" || e2.id === "hello");
          await loadExample(def < 0 ? 0 : def);
          setExampleLabel(`vendored ${id} — not found`);
          return;
        }
        if (fx.dialect && fx.dialect !== ENGINE) {
          const u = new URL(location.href);
          u.searchParams.set("engine", fx.dialect);
          location.href = u.toString(); // reload under the fixture's dialect engine
          return;
        }
        loadVendored(fx);
      }

      // Load a vendored fixture into the workspace and render it, then frame the
      // result as expected-vs-actual: a `conformance-failure` miss (Mustache) is a
      // defect, an `expected-difference` miss (Handlebars) is a by-design divergence.
      // Mirrors loadExample's state setup, but from the fixture (no per-file fetch).
      function loadVendored(fx) {
        const ws = vendoredWorkspace(fx);
        tabs = [{ name: "main", source: ws.template, dirty: false }];
        ws.partials.forEach((p) => tabs.push({ name: p.name, source: p.source, dirty: false }));
        activeTabIdx = 0; activeView = "tmpl";
        yamlSrc = ws.dataText;
        transformSrc = "";
        helpersSrc = "";
        catalogSource = ""; catalogDirty = false; labLocale = "en"; // i18n reset (ADR-029)
        labPathSchema = []; // ADR-030 path-schema reset
        dataOverlays = [];
        dataTab = "edit"; dataFile = "data"; openEditors = autoOpenEditors();
        templateMode = "tmpl";
        showDataTab();
        escapeMode = "";
        byId("escape-select").value = "";
        standalone = true;
        minbarsCompat = true; // default mustacheJs (ADR-029)
        allowList = null;
        syncStandaloneUI();
        updateRenderStatus();
        loadedExampleIdx = -1;
        exampleModified = false;
        yamlDirty = false; transformDirty = false;
        outLangChoice = "Auto";
        persistOutLang();
        updateLangPlaceholder();
        setOutputView(validView("rendered"));
        showActiveTab();
        run(); // synchronous render — populates lastOutput
        const verdict = vendoredVerdict(fx, lastOutput);
        setExampleLabel(`vendored ${fx.id} — ` + (verdict.match ? "✓ conforms" : "✗ " + verdict.severity));
        // Show the link back to the upstream source the fixture was copied from.
        const srcEl = byId("vendored-source");
        const url = fx.source && fx.source.url;
        if (srcEl && url) {
          srcEl.href = url; srcEl.textContent = "source ↗"; srcEl.title = url; srcEl.hidden = false;
        } else if (srcEl) {
          srcEl.hidden = true;
        }
      }

      // Once the user edits anything, the state no longer matches a shipped
      // example: flag it custom so the URL state reflects that. The dropdown
      // keeps showing the example name but appends ● to signal modification.
      function markCustom() {
        if (loadedExampleIdx === -1) return;
        if (exampleModified) return;
        const prevIdx = loadedExampleIdx;
        exampleModified = true;
        loadedExampleIdx = -1;
        // The dropdown keeps showing the example name; the URL state flips to
        // custom (-1) so a share link records the edits, not the pristine example.
        setExampleLabel(examples[prevIdx].label);
      }

      // ── URL state ─────────────────────────────────────────────────────
      function snapshotState() {
        return {
          tabs: tabs.map((t) => ({ n: t.name, s: t.source })),
          d: yamlSrc,
          t: transformSrc,
          // Custom-helper source (ADR-018), a separate field from the transform.
          ...(helpersSrc.trim() ? { h: helpersSrc } : {}),
          // i18n (ADR-029): the message catalog + the active locale (default en omitted).
          ...(catalogSource.trim() ? { cat: catalogSource } : {}),
          ...(labLocale && labLocale !== "en" ? { loc: labLocale } : {}),
          // ADR-030 analyse path schema — persisted so a "watch suppression" link round-trips.
          ...(labPathSchema.length ? { ps: labPathSchema } : {}),
          // Data overlays — each entry is { n: name, s: source }. Omitted when
          // there are none so legacy/short links stay compact.
          ...(dataOverlays.length ? { do: dataOverlays.map((o) => ({ n: o.name, s: o.source })) } : {}),
          e: escapeMode, v: outputView,
          sa: standalone ? 1 : 0,       // ADR-0016 standalone flag
          ...(allowList !== null ? { al: allowList } : {}), // ADR-0013 transformer allow-list
          av: activeView, ai: activeTabIdx,
          // MinBars truthiness toggle (ADR-022 S2); omitted when off so links stay compact.
          ...(minbarsCompat ? {} : { mj: 0 }), // default mustacheJs; persist only the spec opt-out
          // Active template-pane mode (1 = transform tab, 0/omitted = tmpl).
          // Persisted so a shared "I'm editing the transform" link round-trips.
          ...(templateMode === "transform" ? { tm: 1 } : {}),
          ...(templateMode === "helpers" ? { hm: 1 } : {}),
          x: loadedExampleIdx, // which example (or -1 for an edited "custom" state)
        };
      }

      // Encoding the state is async (CompressionStream), so rapid edits could
      // finish out of order; a sequence token keeps only the newest write.
      let hashSeq = 0;
      async function saveHash() {
        const seq = ++hashSeq;
        try {
          const hash = "#" + await encodeState(snapshotState());
          if (seq === hashSeq) history.replaceState(null, "", hash);
        } catch {}
      }

      async function restoreHash() {
        if (!location.hash.length) return false;
        try {
          const s = await decodeState(location.hash.slice(1));
          // Hashes written before example tracking carry no `x`: treat them as
          // "no state" so a stale browsing snapshot doesn't pin the page to it.
          if (s.x === undefined) return false;
          // A clean example reference: reload it fresh so it reflects the current
          // example files and selects the dropdown (not a stale embedded copy).
          if (Number.isInteger(s.x) && s.x >= 0 && examples[s.x]) {
            await loadExample(s.x);
            return true;
          }
          // Otherwise it is a genuine custom edit (x === -1): restore verbatim.
          tabs = Array.isArray(s.tabs) && s.tabs.length
            ? s.tabs.map((t, i) => ({ name: i === 0 ? "main" : (t.n ?? "partial"), source: t.s ?? "", dirty: false }))
            : [{ name: "main", source: "", dirty: false }];
          activeTabIdx = Math.max(0, Math.min(tabs.length - 1, s.ai ?? 0));
          activeView = s.av === "data" ? "data" : "tmpl";
          yamlSrc = s.d ?? "";
          transformSrc = s.t ?? "";
          helpersSrc = s.h ?? ""; // custom-helper source (ADR-018), separate field
          catalogSource = s.cat ?? ""; // i18n message catalog (ADR-029)
          labLocale = s.loc ?? "en";   // i18n active locale
          labPathSchema = Array.isArray(s.ps) ? s.ps.map((p) => String(p)) : []; // ADR-030 path schema
          // Data overlays — accept only entries whose name passes the same
          // validator the UI enforces, dedupe by name (last write wins so
          // the shared snapshot's order is preserved as far as possible).
          dataOverlays = [];
          if (Array.isArray(s.do)) {
            const seen = new Set();
            for (const o of s.do) {
              if (!o || typeof o !== "object") continue;
              const name = String(o.n ?? "");
              if (validateOverlayName(name) || seen.has(name)) continue;
              seen.add(name);
              dataOverlays.push({ name, source: String(o.s ?? ""), dirty: false });
            }
          }
          yamlDirty = false; transformDirty = false;
          exampleModified = false;
          dataTab = "edit"; dataFile = "data"; openEditors = autoOpenEditors();
          templateMode = s.hm === 1 ? "helpers" : s.tm === 1 ? "transform" : "tmpl";
          showDataTab();
          escapeMode = s.e ?? "";
          byId("escape-select").value = escapeMode;
          standalone   = s.sa !== 0;  // default true; explicit 0 opts out
          minbarsCompat = s.mj !== 0; // default mustacheJs; explicit mj:0 = spec (ADR-029)
          allowList = Array.isArray(s.al) ? s.al.map(String) : null;
          syncStandaloneUI();
          updateRenderStatus();
          loadedExampleIdx = -1;
          setExampleLabel("(custom)");
          setOutputView(validView(s.v));
          // A shared "Lint" link opens the requested dock panel (feature-gated
          // like any tab, so it no-ops under an engine that lacks the feature).
          if (typeof s.dk === "string") {
            const dt = dockTabById(s.dk);
            if (dt && tabVisible(dt)) { dockActiveTab = s.dk; setDockVisible(true); }
          }
          showActiveTab(); run();
          return true;
        } catch { return false; }
      }

      // ── Share menu ────────────────────────────────────────────────────
      // A simple dropdown of the share/export actions (the only ones worth a
      // menu). Other actions live on their own controls: Add partial on the tab
      // strip's +, focus on each pane's maximize toggle, layout reset by
      // double-clicking a splitter.
      const SHARE_ACTIONS = {
        link: copyShareLink,
        md: copyMarkdown,
        "dl-md": () => downloadWorkspace("md"),
        "dl-zip": () => downloadWorkspace("zip"),
      };
      function openShareMenu() {
        byId("share-menu").hidden = false;
        byId("share").dataset.open = "true";
        byId("share-btn").setAttribute("aria-expanded", "true");
      }
      function closeShareMenu() {
        byId("share-menu").hidden = true;
        byId("share").dataset.open = "false";
        byId("share-btn").setAttribute("aria-expanded", "false");
      }

      // ── Toast ─────────────────────────────────────────────────────────
      function toast(msg) {
        let t = qs(".toast");
        if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.append(t); }
        t.textContent = msg;
        requestAnimationFrame(() => t.classList.add("show"));
        clearTimeout(t._hide);
        t._hide = setTimeout(() => t.classList.remove("show"), 1400);
      }

      async function copyShareLink() {
        await saveHash();
        try { await navigator.clipboard?.writeText(location.href); toast("Link copied to clipboard"); }
        catch { toast("Couldn't copy (permission?)"); }
      }

      async function copyMarkdown() {
        try { await navigator.clipboard?.writeText(await buildMarkdownDoc()); toast("Markdown copied to clipboard"); }
        catch { toast("Couldn't copy (permission?)"); }
      }

      // ── Tweaks panel ──────────────────────────────────────────────────
      const TWEAK_OPTS = {
        // Monospace families only — code reads best fixed-width. Each is a stack
        // that degrades gracefully when the preferred face isn't installed.
        font: [
          { value: "plex",    label: "Plex Mono", stack: '"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace' },
          { value: "system",  label: "System",    stack: 'ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' },
          { value: "courier", label: "Courier",   stack: '"Courier New", Courier, monospace' },
        ],
        fontSize: [12, 13, 14, 16],
      };

      // Theme is no longer a tweak: it's owned by the umbrella anti-flash seed +
      // the shared <flatbars-topbar> (single `flatbars-theme` key, html[data-theme],
      // mirrored to body by the bridge near the topbar). The Appearance panel keeps
      // the editor-only tweaks (layout, line numbers, font).
      let tweaks = { layout: "split", lineNumbers: true, font: "plex", fontSize: 13, compactToolbar: false };
      try { const r = localStorage.getItem(LS_TWEAKS); if (r) tweaks = { ...tweaks, ...JSON.parse(r) }; } catch {}
      delete tweaks.theme; // retired (was light|dark|system) — now the shared topbar owns it
      tweaks.lineNumbers = tweaks.lineNumbers !== false; // default on
      if (!TWEAK_OPTS.font.some((o) => o.value === tweaks.font)) tweaks.font = "plex";
      if (!TWEAK_OPTS.fontSize.includes(tweaks.fontSize)) tweaks.fontSize = 13;
      delete tweaks.mood;
      delete tweaks.chipstyle; // retired (was tint|outline|solid) — tags now use the fixed tint look

      // Follow a live OS theme flip only while no explicit preference is stored
      // (matches the umbrella seed's first-visit fallback); keep html + body synced.
      const prefersDark = matchMedia("(prefers-color-scheme: dark)");
      prefersDark.addEventListener("change", () => {
        let stored;
        try { stored = localStorage.getItem("flatbars-theme"); } catch (e) {}
        if (stored !== "light" && stored !== "dark") {
          const t = prefersDark.matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
          document.body.dataset.theme = t;
        }
      });

      function applyTweaks() {
        document.body.classList.toggle("compact-toolbar", !!tweaks.compactToolbar);
        document.body.classList.toggle("show-line-numbers", tweaks.lineNumbers);
        const lineNumberExt = tweaks.lineNumbers ? [lineNumbers(), highlightActiveLineGutter()] : [];
        for (const view of [templateView, dataView, outputEditor])
          view.dispatch({ effects: lineNumberComp.reconfigure(lineNumberExt) });
        // Editor file-content font + size only (the UI chrome keeps --font-mono).
        const fontOpt = TWEAK_OPTS.font.find((o) => o.value === tweaks.font) || TWEAK_OPTS.font[0];
        const root = document.documentElement.style;
        root.setProperty("--editor-font", fontOpt.stack);
        root.setProperty("--editor-font-size", tweaks.fontSize + "px");
        window.dispatchEvent(new Event("resize"));
      }
      function saveTweaks() { try { localStorage.setItem(LS_TWEAKS, JSON.stringify(tweaks)); } catch {} }

      function mkEl(tag, attrs = {}, children = []) {
        const n = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "class") n.className = v;
          else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
          else if (v != null && v !== false) n.setAttribute(k, v);
        }
        for (const c of [].concat(children)) {
          if (c != null) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
        }
        return n;
      }

      // The Appearance panel is a Preact component. `tweaksMount` is its host;
      // tweak state lives in the global `tweaks` object (applied + persisted by
      // setTweak), and a local bump re-renders after each change.
      let tweaksMount = null;

      function TwSection({ title, hint, children }) {
        return html`
          <div class="tw-section">
            <div class="tw-section-head">
              <span class="tw-section-title">${title}</span>
              ${hint ? html`<span class="tw-section-hint">${hint}</span>` : null}
            </div>
            <div class="tw-section-body">${children}</div>
          </div>`;
      }

      // A row of mutually-exclusive buttons bound to one tweak key. An option may
      // carry inline `html` (icon + label, set verbatim) or a plain `label`.
      function TwSegmented({ tweakKey, options, set }) {
        return html`
          <div class="tw-segmented">
            ${options.map((o) => html`
              <button class=${tweaks[tweakKey] === o.value ? "on" : ""} title=${o.title || null} style=${o.style || null}
                onClick=${() => set(tweakKey, o.value)}
                dangerouslySetInnerHTML=${o.html ? { __html: o.html } : null}>${o.html ? null : o.label}</button>`)}
