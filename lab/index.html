          </div>`;
      }

      function TweaksPanel() {
        const [, bump] = useState(0);
        const panelRef = useRef(null);
        const set = (k, v) => { setTweak(k, v); bump((n) => n + 1); };

        useEffect(() => {
          const panel = panelRef.current;
          applyPanelPos(panel, panelState.appearance);
          makeDraggable(panel, panel.querySelector(".tw-header"), panelState.appearance);
        }, []);

        return html`
          <div class="tw-panel" role="dialog" aria-label="Appearance" ref=${panelRef}>
            <div class="tw-header">
              <div class="tw-title"><span class="tw-pill"></span>Appearance</div>
              <button class="tw-close" title="Close" onClick=${hideTweaks}>×</button>
            </div>
            <${TwSection} title="Toolbar" hint=${tweaks.compactToolbar ? "icons only" : "icons + labels"}>
              <${TwSegmented} tweakKey="compactToolbar" set=${set}
                options=${[{ value: false, label: "Labels" }, { value: true, label: "Compact" }]} />
            <//>
            <${TwSection} title="Line numbers">
              <${TwSegmented} tweakKey="lineNumbers" set=${set}
                options=${[{ value: true, label: "On" }, { value: false, label: "Off" }]} />
            <//>
            <${TwSection} title="Editor font" hint="monospace">
              <${TwSegmented} tweakKey="font" set=${set}
                options=${TWEAK_OPTS.font.map((o) => ({ value: o.value, label: o.label, style: { fontFamily: o.stack } }))} />
            <//>
            <${TwSection} title="Font size">
              <${TwSegmented} tweakKey="fontSize" set=${set}
                options=${TWEAK_OPTS.fontSize.map((px) => ({ value: px, label: px + "px" }))} />
            <//>
            <div class="tw-foot">Edits persist across reloads.</div>
          </div>`;
      }

      function setTweak(key, value) {
        tweaks[key] = value;
        applyTweaks(); saveTweaks();
      }

      // Persisted floating-panel layout (open + position + size), so the GUI
      // survives reloads. localStorage is the playground's persistence mechanism
      // (same as the splitters and Appearance settings).
      const LS_PANELS = "stem-playground:panels.v1";
      let panelState = { appearance: {}, search: {}, dock: {} };
      try {
        panelState = { appearance: {}, search: {}, dock: {}, ...JSON.parse(localStorage.getItem(LS_PANELS) || "{}") };
        panelState.search = panelState.search || {};
        panelState.dock = panelState.dock || {};
        delete panelState.deps; // dropped: dependency graph lives in the dock now
      } catch {}
      function savePanels() {
        try { localStorage.setItem(LS_PANELS, JSON.stringify(panelState)); } catch {}
      }

      // Position a floating panel. A panel the user has dragged carries a saved
      // {left, top}; restore it (clamped into the viewport). One never dragged
      // opens centred, so it appears where the eye expects rather than tucked in
      // a corner. Either way we switch to left/top anchoring.
      function applyPanelPos(panel, st) {
        const r = panel.getBoundingClientRect();
        const left = typeof st.left === "number" ? st.left : (window.innerWidth - r.width) / 2;
        const top = typeof st.top === "number" ? st.top : (window.innerHeight - r.height) / 2;
        panel.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, left)) + "px";
        panel.style.top = Math.max(8, Math.min(window.innerHeight - r.height - 8, top)) + "px";
        panel.style.right = "auto";
        panel.style.bottom = "auto";
      }

      // Drag a panel by its header, persisting the final position into `st`.
      function makeDraggable(panel, header, st) {
        header.addEventListener("mousedown", (e) => {
          if (e.target.classList.contains("tw-close")) return;
          const rect = panel.getBoundingClientRect();
          const dx = e.clientX - rect.left, dy = e.clientY - rect.top;
          const onMove = (ev) => {
            st.left = Math.max(8, Math.min(window.innerWidth - rect.width - 8, ev.clientX - dx));
            st.top = Math.max(8, Math.min(window.innerHeight - rect.height - 8, ev.clientY - dy));
            panel.style.left = st.left + "px";
            panel.style.top = st.top + "px";
            panel.style.right = "auto";
            panel.style.bottom = "auto";
          };
          const onUp = () => {
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
            savePanels();
          };
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        });
      }

      // Appearance/Dependencies/Search are command-like: a click on the toolbar
      // button opens them, and they dismiss on Escape or an outside click. Their
      // open/closed state is intentionally NOT persisted (they never reappear on
      // reload); only a dragged position/size carries over within reach of
      // makeDraggable/ResizeObserver.
      function showTweaks() {
        if (tweaksMount) { hideTweaks(); return; }
        tweaksMount = document.createElement("div");
        document.body.append(tweaksMount);
        render(html`<${TweaksPanel} />`, tweaksMount);
        byId("tweaks-btn").classList.add("active");
      }
      function hideTweaks() {
        if (tweaksMount) { render(null, tweaksMount); tweaksMount.remove(); tweaksMount = null; }
        byId("tweaks-btn").classList.remove("active");
      }

      // ── Find in all files (Search panel) ──────────────────────────────
      // The Search panel is a Preact component (the first migrated panel).
      // `searchMount` is its host element; `searchRefresh` is set by the mounted
      // component so external source changes can force a re-run.
      let searchMount = null;
      let searchRefresh = null;

      // Every searchable source: the template tabs (main + partials), the YAML
      // data, and the JSONata transform (when present). The rendered output is
      // generated, not a source, so it's excluded.
      function searchSources() {
        const out = tabs.map((t) => ({ file: t.name, kind: "tmpl", source: t.source }));
        out.push({ file: "data.yaml", kind: "data", source: yamlSrc });
        if (transformSrc.trim()) out.push({ file: "transform", kind: "transform", source: transformSrc });
        return out;
      }

      // Build the match regex from the query and options. Plain queries are
      // escaped to a literal; `regex` uses the query verbatim; `wholeWord` wraps
      // it in word boundaries. Returns null on an invalid regex pattern.
      function buildSearchMatcher(query, { caseSensitive, regex, wholeWord }) {
        let pattern = regex ? query : query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        if (wholeWord) pattern = `\\b(?:${pattern})\\b`;
        try {
          return new RegExp(pattern, "g" + (caseSensitive ? "" : "i"));
        } catch {
          return null;
        }
      }

      // Every occurrence of `query` across all sources, grouped by file, each hit
      // carrying its line/column, matched length, and the full line for a preview.
      // Returns `{ groups, error }` (error = invalid regex pattern).
      function searchAll(query, opts) {
        if (!query) return { groups: [], error: false };
        const re = buildSearchMatcher(query, opts);
        if (!re) return { groups: [], error: true };
        const groups = [];
        for (const f of searchSources()) {
          const hits = [];
          re.lastIndex = 0;
          let m;
          while ((m = re.exec(f.source)) !== null) {
            const idx = m.index;
            const lineStart = f.source.lastIndexOf("\n", idx - 1) + 1;
            const nl = f.source.indexOf("\n", idx);
            const lineEnd = nl === -1 ? f.source.length : nl;
            hits.push({
              index: idx,
              line: f.source.slice(0, idx).split("\n").length,
              col: idx - lineStart + 1,
              lineText: f.source.slice(lineStart, lineEnd),
              matchInLine: idx - lineStart,
              matchLen: m[0].length,
              // Capture the full match + every numbered group so per-hit
              // Replace can expand `$1`/`$2`/`$&` the same way Replace All
              // does. `m` is a RegExpExecArray; element 0 is the full match.
              groups: Array.from(m),
            });
            if (m[0].length === 0) re.lastIndex++; // avoid looping on zero-width matches
            if (hits.length >= 999) break; // guard against pathological inputs
          }
          if (hits.length) groups.push({ file: f.file, kind: f.kind, hits });
        }
        return { groups, error: false };
      }

      function fileSourceByKind(file, kind) {
        if (kind === "data") return yamlSrc;
        if (kind === "transform") return transformSrc;
        if (kind === "helpers") return helpersSrc;
        const i = tabIndexByFile(file);
        return i >= 0 ? tabs[i].source : "";
      }

      // Write a source back and keep the visible editor in sync.
      function setFileSource(file, kind, next) {
        if (kind === "data") {
          yamlSrc = next;
          if (activeView === "data" && dataTab === "edit" && dataFile === "data") setEditorText(dataView, next);
        } else if (kind === "transform") {
          transformSrc = next;
          // The transform now lives in the template pane.
          if (activeView === "tmpl" && templateMode === "transform") setEditorText(templateView, next);
        } else if (kind === "helpers") {
          helpersSrc = next;
          if (activeView === "tmpl" && templateMode === "helpers") setEditorText(templateView, next);
        } else {
          const i = tabIndexByFile(file);
          if (i < 0) return;
          tabs[i].source = next;
          if (i === activeTabIdx && activeView === "tmpl") setEditorText(templateView, next);
        }
      }

      // Replace a single occurrence. In regex mode the replacement may use
      // `$1`/`$2`/`$&` backrefs (matching Replace All); in literal mode every
      // `$` is taken verbatim. `hit.groups` is the regex match array captured
      // at scan time, so the expansion stays consistent even if the source
      // has shifted under us.
      function replaceOneHit(file, kind, hit, replacement, regex) {
        const src = fileSourceByKind(file, kind);
        const expanded = regex ? expandBackrefs(replacement, hit.groups || [hit.lineText]) : replacement;
        setFileSource(file, kind, src.slice(0, hit.index) + expanded + src.slice(hit.index + hit.matchLen));
        markCustom(); run();
      }

      // Expand `$&` (full match), `$$` (literal `$`), and `$1`–`$99` numbered
      // backrefs into `template` using `groups[0..n]`. Unknown groups (out of
      // range or non-numeric) pass through unchanged — that matches what
      // `String.prototype.replace` does in regex mode.
      function expandBackrefs(template, groups) {
        return template.replace(/\$(\$|&|\d{1,2})/g, (whole, key) => {
          if (key === "$") return "$";
          if (key === "&") return groups[0] ?? "";
          const n = Number(key);
          if (n >= 1 && n < groups.length) return groups[n] ?? "";
          return whole;
        });
      }

      // Replace every occurrence across all sources. In regex mode the
      // replacement may use $1 backrefs; in literal mode `$` is escaped.
      function replaceAllHits(opts, replaceValue) {
        const re = buildSearchMatcher(opts.query, opts);
        if (!re) return;
        const repl = opts.regex ? replaceValue : replaceValue.replace(/\$/g, "$$$$");
        let changed = false;
        for (const f of searchSources()) {
          const next = f.source.replace(re, repl);
          if (next !== f.source) { setFileSource(f.file, f.kind, next); changed = true; }
        }
        if (changed) { markCustom(); run(); }
      }

      // Open a hit: switch to its file/tab and select the matched range.
      function openSearchResult(file, kind, line, col, len) {
        const select = (view) => {
          const ln = Math.max(1, Math.min(view.state.doc.lines, line));
          const lineObj = view.state.doc.line(ln);
          const fromPos = Math.min(lineObj.to, lineObj.from + Math.max(0, col - 1));
          const toPos = Math.min(lineObj.to, fromPos + len);
          view.focus();
          view.dispatch({ selection: { anchor: fromPos, head: toPos }, scrollIntoView: true });
        };
        if (kind === "data" || kind === "transform") {
          selectDataTab(kind === "transform" ? "transform" : "data");
          select(dataView);
        } else {
          const idx = tabIndexByFile(file);
          if (idx >= 0) selectTemplateTab(idx);
          select(templateView);
        }
      }

      // An SVG cross centres crisply (a "×" glyph sits slightly off-centre).
      const CLEAR_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>';

      // A text input with a clear (×) button shown only when the field is
      // non-empty; clearing refocuses the field.
      function ClearableInput({ value, onValue, onKeyDown, inputRef, ...rest }) {
        const ref = inputRef || useRef(null);
        const clear = () => { onValue(""); ref.current?.focus(); };
        return html`
          <span class="input-wrap">
            <input ref=${ref} value=${value} onInput=${(e) => onValue(e.target.value)} onKeyDown=${onKeyDown} ...${rest} />
            <button type="button" class="input-clear" tabindex="-1" title="Clear" hidden=${!value}
              onClick=${clear} dangerouslySetInnerHTML=${{ __html: CLEAR_SVG }}></button>
          </span>`;
      }

      // The Search panel, as a Preact component. Query/replace/option state lives
      // in hooks; results derive from `searchAll` on each render (cheap for the
      // playground's small sources, so no debounce is needed). Position and size
      // are applied imperatively to the panel ref in an effect — never via vnode
      // style — so a re-render never resets a drag or resize in progress.
      function SearchPanel() {
        const [query, setQuery] = useState("");
        const [replace, setReplace] = useState("");
        const [caseSensitive, setCaseSensitive] = useState(false);
        const [wholeWord, setWholeWord] = useState(false);
        const [regex, setRegex] = useState(false);
        const [, bump] = useState(0); // external source edits force a re-run
        const panelRef = useRef(null);
        const inputRef = useRef(null);

        const opts = { query, caseSensitive, regex, wholeWord };
        const { groups, error } = query ? searchAll(query, opts) : { groups: [], error: false };
        const total = groups.reduce((n, g) => n + g.hits.length, 0);

        useEffect(() => {
          const panel = panelRef.current;
          // Restore a saved size first so applyPanelPos centres against the real
          // dimensions; position is then set (centred, or a saved drag) by it.
          if (typeof panelState.search.width === "number") {
            panel.style.width = panelState.search.width + "px";
            panel.style.height = panelState.search.height + "px";
          }
          applyPanelPos(panel, panelState.search);
          makeDraggable(panel, panel.querySelector(".tw-header"), panelState.search);
          const ro = new ResizeObserver(() => {
            panelState.search.width = panel.offsetWidth;
            panelState.search.height = panel.offsetHeight;
            savePanels();
          });
          ro.observe(panel);
          searchRefresh = () => bump((n) => n + 1);
          inputRef.current?.focus();
          return () => { ro.disconnect(); searchRefresh = null; };
        }, []);

        const countText = query && !error && total
          ? `${total} match${total === 1 ? "" : "es"} in ${groups.length} file${groups.length === 1 ? "" : "s"}`
          : "";

        return html`
          <div class="search-panel" role="dialog" aria-label="Search" ref=${panelRef}>
            <div class="tw-header">
              <div class="tw-title"><span class="tw-pill"></span>Search</div>
              <button class="tw-close" title="Close" onClick=${hideSearch}>×</button>
            </div>
            <div class="search-bar">
              <${ClearableInput} inputRef=${inputRef} value=${query} onValue=${setQuery}
                onKeyDown=${(e) => { if (e.key === "Escape") hideSearch(); }}
                class="search-input" type="text" placeholder="Find in all files…" autocomplete="off" spellcheck="false" />
              <div class="search-opts">
                <label class="search-opt" title="Case sensitive"><input type="checkbox" checked=${caseSensitive} onChange=${(e) => setCaseSensitive(e.target.checked)} />Aa</label>
                <label class="search-opt" title="Whole word"><input type="checkbox" checked=${wholeWord} onChange=${(e) => setWholeWord(e.target.checked)} /><u>ab</u></label>
                <label class="search-opt" title="Regular expression"><input type="checkbox" checked=${regex} onChange=${(e) => setRegex(e.target.checked)} />.*</label>
              </div>
            </div>
            <div class="search-bar replace-bar">
              <${ClearableInput} value=${replace} onValue=${setReplace}
                class="replace-input" type="text" placeholder="Replace…" autocomplete="off" spellcheck="false" />
              <button class="search-replace-all" title="Replace all occurrences" onClick=${() => replaceAllHits(opts, replace)}>Replace All</button>
            </div>
            <div class="search-count">${countText}</div>
            <div class="search-results">
              ${!query
                ? html`<div class="search-empty">Type to search all files.</div>`
                : error
                ? html`<div class="search-empty">Invalid regular expression.</div>`
                : !total
                ? html`<div class="search-empty">No matches.</div>`
                : groups.map((g) => html`
                    <div class="search-file">${g.file}<span class="n">${g.hits.length}</span></div>
                    ${g.hits.map((h) => html`
                      <div class="search-hit" title=${`${g.file}:${h.line}:${h.col}`}
                        onClick=${() => openSearchResult(g.file, g.kind, h.line, h.col, h.matchLen)}>
                        <span class="ln">${h.line}:${h.col}</span>
                        <span class="txt">${h.lineText.slice(0, h.matchInLine)}<mark>${h.lineText.slice(h.matchInLine, h.matchInLine + h.matchLen)}</mark>${h.lineText.slice(h.matchInLine + h.matchLen)}</span>
                        <button class="hit-replace" title="Replace this occurrence"
                          onClick=${(e) => { e.stopPropagation(); replaceOneHit(g.file, g.kind, h, replace, opts.regex); }}>Replace</button>
                      </div>`)}`)}
            </div>
          </div>`;
      }

      function showSearch() {
        if (searchMount) {
          const i = searchMount.querySelector(".search-input");
          if (i) { i.focus(); i.select(); }
          return;
        }
        searchMount = document.createElement("div");
        document.body.append(searchMount);
        render(html`<${SearchPanel} />`, searchMount);
        byId("search-btn").classList.add("active");
      }
      function hideSearch() {
        if (searchMount) { render(null, searchMount); searchMount.remove(); searchMount = null; searchRefresh = null; }
        byId("search-btn").classList.remove("active");
      }
      // The toolbar button toggles; ⌘⇧F opens/focuses but never closes.
      function toggleSearch() { searchMount ? hideSearch() : showSearch(); }
      // Re-run the open search when sources change (line numbers may have moved).
      function refreshSearchPanel() { searchRefresh?.(); }

      // Restore floating panels saved from a previous session. The command-like
      // panels (Appearance/Dependencies/Search) never auto-restore — they open
      // only on demand. The diagnostics dock keeps its persisted visibility.
      function restorePanels() {
        // Only restore a persisted active tab that is both known and visible
        // under the current engine (ADR-0020); otherwise renderDock falls back.
        const saved = panelState.dock.activeTab;
        if (saved && dockTabs.some((t) => t.id === saved) && tabVisible(dockTabById(saved))) {
          dockActiveTab = saved;
        }
        if (panelState.dock.open) setDockVisible(true);
      }

      // ── Wire events ───────────────────────────────────────────────────
      byId("out-copy").addEventListener("click", copyOutput);
      byId("share-btn").addEventListener("click", () => {
        byId("share-menu").hidden ? openShareMenu() : closeShareMenu();
      });
      byId("share-menu").addEventListener("click", (e) => {
        const item = e.target.closest(".dropdown-item");
        if (item && SHARE_ACTIONS[item.dataset.act]) { SHARE_ACTIONS[item.dataset.act](); closeShareMenu(); }
      });
      wireMenuKeyboard(byId("share-btn"), byId("share-menu"), {
        open: openShareMenu, close: closeShareMenu,
        isOpen: () => !byId("share-menu").hidden,
      });
      byId("tweaks-btn").addEventListener("click", showTweaks);
      byId("search-btn").addEventListener("click", toggleSearch);

      // Close the example dropdown and the command-like panels (Appearance,
      // Search) on an outside click — but never when the click is on the
      // panel's own toolbar toggle, which manages its own open/close.
      document.addEventListener("pointerdown", (e) => {
        if (!byId("example-menu").hidden && !byId("example-select").contains(e.target)) {
          closeExampleMenu();
        }
        if (!byId("share-menu").hidden && !byId("share").contains(e.target)) {
          closeShareMenu();
        }
        if (tweaksMount && !tweaksMount.contains(e.target) && !byId("tweaks-btn").contains(e.target)) {
          hideTweaks();
        }
        if (searchMount && !searchMount.contains(e.target) && !byId("search-btn").contains(e.target)) {
          hideSearch();
        }
      });
      // Escape dismisses whichever command surface is open, innermost first.
      window.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (!byId("example-menu").hidden) closeExampleMenu();
        else if (!byId("share-menu").hidden) closeShareMenu();
        else if (searchMount) hideSearch();
        else if (tweaksMount) hideTweaks();
      });

      byId("escape-select").addEventListener("change", (e) => {
        escapeMode = e.target.value; run(); updateStatusMeta();
      });


      // ── Diagnostics dock (Problems + Partials) ────────────────────────
      // A persistent bottom dock surfacing compile/capability problems and the
      // partial dependency graph (built from the engine's `parse_ast`). Hidden
      // until toggled; refreshed by setOutput() on every run.
      let ctxTarget = null; // { file, start, end, label } — the last-clicked output span

      // A source slice can be a long, multi-line literal (e.g. a whole <style>
      // block); collapse it to one trimmed line for compact inspector labels.
      const oneLineLabel = (text, max = 60) => {
        const flat = text.replace(/\s+/g, " ").trim();
        return flat.length > max ? flat.slice(0, max) + "…" : flat;
      };

      function dockVisible() { return !byId("dock").hidden; }

      function makeEl(tag, attrs = {}, children = []) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "class") node.className = v;
          else if (k === "style") node.style.cssText = v;
          else node.setAttribute(k, v);
        }
        for (const c of [].concat(children)) {
          if (c == null) continue;
          node.append(typeof c === "string" ? document.createTextNode(c) : c);
        }
        return node;
      }

      // Parse main + every partial to its pre-expansion AST, then derive the DAG.
      function currentDependencyGraph() {
        const asts = {};
        const parsed = renderer.parseAst(tabs[0].source);
        asts.main = parsed.ast ? parsed.ast.nodes : [];
        for (const [name, src] of Object.entries(partialsMap())) {
          const p = renderer.parseAst(src);
          asts[name] = p.ast ? p.ast.nodes : [];
        }
        return buildDependencyGraph(asts);
      }

      // Dock tab descriptors. Each entry owns a label, a badge count/class
      // computed from the per-run analyses, and a renderer that paints into
      // the dock body. Adding a panel is one entry here — no DOM wiring.
      const dockTabs = [
        { id: "problems", label: "Problems",
          count: () => dockProblems.length,
          badge: () => dockProblems.length === 0 ? "success" :
            (dockProblems.some((p) => p.severity === "error" || p.severity === "render") ? "danger" : "warn"),
          render: renderProblems },
        { id: "transformers", label: "Transformers", requires: ["catalog"],
          count: () => lastUsedTransformers.length,
          badge: () => lastUsedTransformers.length ? "" : "success",
          render: renderTransformers },
        { id: "data-access", label: "Data Access", requires: ["required-assigns"],
          count: () => lastDataAccess.filter((r) => r.status !== "hit").length,
          badge: () => {
            const misses = lastDataAccess.filter((r) => r.status === "miss").length;
            const mism = lastDataAccess.filter((r) => r.status !== "hit" && r.status !== "miss").length;
            if (mism) return "danger";
            if (misses) return "warn";
            return lastDataAccess.length ? "success" : "";
          },
          render: renderDataAccess },
        { id: "trim", label: "Whitespace", requires: ["standalone"],
          count: () => lastWhitespace.length,
          badge: () => "",
          render: renderWhitespace },
        { id: "partials", label: "Partials", requires: ["partial-graph"],
          count: () => {
            if (!lastDeps) return 0;
            // Count partials (everything except main) — main is the entry,
            // not a partial. Empty count is what the user expects when a
            // template uses no `{{> name}}`.
            return lastDeps.nodes.filter((n) => !n.isMain).length;
          },
          badge: () => {
            if (!lastDeps) return "";
            if (lastDeps.nodes.some((n) => n.missing)) return "warn";
            const partials = lastDeps.nodes.filter((n) => !n.isMain);
            if (partials.length === 0) return ""; // no partials in use — neutral
            return lastDeps.cycles.length ? "" : "success";
          },
          render: renderPartials },
        { id: "capabilities", label: "Capabilities",
          count: () => {
            const evalCount = lastUsedTransformers.filter((n) => n === "eval").length;
            const xform = lastUsedTransformers.filter((n) => TRANSFORMER_RISK[n] === "transform").length;
            return evalCount + xform;
          },
          badge: () => {
            if (lastUsedTransformers.includes("eval")) return "danger";
            if (allowScripts) return "warn";
            if (lastUsedTransformers.some((n) => TRANSFORMER_RISK[n] === "transform")) return "warn";
            return "success";
          },
          render: renderCapabilities },
        { id: "perf", label: "Performance",
          count: () => lastTimings ? Math.round(lastTimings.totalMs) : 0,
          badge: () => {
            if (!lastTimings) return "";
            if (lastTimings.totalMs > 100) return "warn";
            if (lastTimings.totalMs > 500) return "danger";
            return "success";
          },
          render: renderPerformance },
        { id: "coverage", label: "Coverage",
          count: () => lastCoverage.filter((r) => !r.executed).length,
          badge: () => {
            if (!lastCoverage.length) return "";
            const dead = lastCoverage.filter((r) => !r.executed).length;
            return dead ? "warn" : "success";
          },
          render: renderCoverage },
        // ADR-022: conditions whose branch would differ on another engine
        // (Mustache/StringTemplate4/…), with a portable fix each.
        { id: "truthiness", label: "Truthiness", requires: ["analyse"],
          count: () => lastAnalyse.findings.length,
          badge: () => {
            if (!lastAnalyse.ok) return "";
            return lastAnalyse.findings.length ? "warn" : "success";
          },
          render: renderTruthiness },
        // ADR-019: deprecated aliases + non-canonical scoped variables, each with
        // the canonical spelling the editor quick-fix / `flatbars lint` steers to.
        { id: "lint", label: "Lint", requires: ["lint"],
          count: () => lastLint.findings.length,
          badge: () => {
            if (!lastLint.ok) return "";
            return lastLint.findings.length ? "warn" : "success";
          },
          render: renderLint },
        // The read-only inspectors (moved here from the Sources pane). They are
        // not analyses with a count — `noBadge` suppresses the badge — and follow
        // the active file / last render (re-rendered by renderDock after each run).
        { id: "context", label: "Context Inspector", noBadge: true, requires: ["context-inspect"],
          count: () => 0, badge: () => "", render: renderContext },
        { id: "ast", label: "Syntax Tree", noBadge: true,
          count: () => 0, badge: () => "", render: renderAst },
      ];

      function dockTabById(id) { return dockTabs.find((t) => t.id === id); }

      // Dock tabs the loaded engine actually exposes (ADR-0020 gate applied).
      // `problems`/`perf`/`coverage` declare no `requires`, so they are always
      // present; the analysis panels appear only when their backing capability
      // is advertised. Under the Stem adapter every tab is visible.
      const visibleDockTabs = () => dockTabs.filter(tabVisible);

      // Build the tab-strip from `dockTabs` and refresh badges. Cheap; called
      // on every renderDock so adding a panel needs no extra wiring.
      function paintDockTabs() {
        const strip = byId("dock-tabs");
        strip.textContent = "";
        for (const tab of visibleDockTabs()) {
          const btn = makeEl("button", {
            class: "dock-tab" + (dockActiveTab === tab.id ? " active" : ""),
            "data-tab": tab.id,
          }, tab.noBadge
            ? [ tab.label ]
            : [ tab.label, " ", makeEl("span", { class: "badge " + tab.badge() }, String(tab.count())) ]);
          btn.addEventListener("click", () => {
            dockActiveTab = tab.id;
            panelState.dock.activeTab = tab.id;
            savePanels();
            if (byId("dock").hidden) setDockVisible(true); else renderDock();
          });
          strip.append(btn);
        }
      }

      function renderDock() {
        paintDockTabs();

        // Auto-open on the 0→>0 transition so problems surface without a click.
        const probCount = dockProblems.length;
        if (probCount > 0 && !hadProblems && byId("dock").hidden) {
          byId("dock").hidden = false;
          byId("dock-toggle").classList.add("active");
          byId("dock-toggle").setAttribute("aria-pressed", "true");
          byId("dock").classList.remove("collapsed");
        }
        hadProblems = probCount > 0;

        if (!dockVisible() || byId("dock").classList.contains("collapsed")) return;
        const body = byId("dock-body");
        body.textContent = "";
        // Fall back to the first visible tab when the persisted active tab is
        // gated off under the current engine (ADR-0020).
        const visible = visibleDockTabs();
        const active = visible.find((t) => t.id === dockActiveTab) || visible[0] || dockTabs[0];
        dockActiveTab = active.id;
        active.render(body);
      }

      // Used-transformers report v2 — aggregated call sites per name, with
      // each row jump-linked to its source span. Risk tier (`TRANSFORMER_RISK`)
      // colours each chip; unknown names render as host transformers.
      // Thin wrapper: the renderer lives in `panels/transformers.mjs` so the
      // big dock body is reviewable on its own. Funnels the current state +
      // helpers into the module's pure-renderer signature.
      function renderTransformers(body) {
        renderTransformersPanel(body, {
          usedTransformers: lastUsedTransformers,
          calls: lastCalls,
          engineBuiltins,
          makeEl,
          fileSource,
          charToLineColumn,
          byteRangeToCharRange,
          openProblem,
          usedTransformersApproximate:
            featureFidelity(engineFeatures, "used-transformers") === "approximate",
        });
      }

      // ── Panel #1: Data Access ─────────────────────────────────────────
      // Every data lookup the template makes (paths and bare identifiers),
      // classified hit/miss/oob/type-mismatch/scoped. Jump-linked to source.
      function renderDataAccess(body) {
        const rows = lastDataAccess;
        const counts = { hit: 0, miss: 0, "type-mismatch": 0, oob: 0, scoped: 0 };
        for (const r of rows) counts[r.status] = (counts[r.status] || 0) + 1;
        const section = makeEl("div", { class: "dx-section" });
        const head = makeEl("div", { class: "dx-head" }, [
          makeEl("strong", {}, "Data access"),
          " — ", String(rows.length), " lookups · ",
          makeEl("span", { class: "dx-pill ok" }, `${counts.hit} hit`), " ",
          makeEl("span", { class: "dx-pill warn" }, `${counts.miss} miss`), " ",
          makeEl("span", { class: "dx-pill danger" }, `${counts["type-mismatch"] + counts.oob} type/oob`), " ",
          makeEl("span", { class: "dx-pill muted" }, `${counts.scoped} scoped`),
        ]);
        section.append(head);
        // Engine-reported assign contract — programs report which top-level
        // keys they read; missing ones are real bugs (renamed key, dropped
        // field), not heuristics. Show them prominently above the per-lookup list.
        if (lastRequiredAssigns.length) {
          const contract = makeEl("div", { class: "dx-contract" });
          contract.append(makeEl("strong", {}, "Required assigns"), ": ");
          for (const n of lastRequiredAssigns) {
            const cls = lastMissingAssigns.includes(n) ? "dx-assign missing" : "dx-assign";
            contract.append(makeEl("span", { class: cls, title: lastMissingAssigns.includes(n) ? "missing from data" : "present in data" }, n));
          }
          if (lastMissingAssigns.length) {
            contract.append(makeEl("span", { class: "dx-contract-warn" },
              ` — ${lastMissingAssigns.length} missing from data`));
          }
          section.append(contract);
        }
        if (rows.length === 0) {
          section.append(makeEl("div", { class: "dx-empty" },
            "No data lookups — template renders only literals."));
          body.append(section);
          return;
        }
        section.append(makeEl("div", { class: "dx-hint" }, [
          "Static analysis against the current data dictionary. ",
          "“scoped” means the lookup sits inside a loop or partial-scope, where the head identifier may be a block param. ",
          makeEl("strong", {}, "Save vector"),
          " (next to a miss/oob row) copies a JSON conformance vector capturing the current template + data + actual output — a one-click way to turn a bug into a regression test.",
        ]));
        const list = makeEl("div", { class: "dx-rows" });
        for (const r of rows) {
          const cls = r.status === "hit" ? "ok"
            : r.status === "scoped" ? "muted"
            : r.status === "miss" ? "warn"
            : "danger";
          const row = makeEl("div", { class: `dx-row ${cls}` });
          row.append(makeEl("span", { class: "dx-status" }, r.status));
          row.append(makeEl("span", { class: "dx-path" }, r.path));
          row.append(makeEl("span", { class: "dx-val" },
            r.status === "hit" ? dxSnippet(r.value) : ""));
          const src = fileSource(r.file);
          const pos = typeof r.start === "number"
            ? charToLineColumn(src, byteRangeToCharRange(src, r.start, r.end)[0])
            : { line: 1, column: 1 };
          row.append(makeEl("span", { class: "dx-where" }, `${r.file}:${pos.line}:${pos.column}`));
          // Save-as-vector button on every non-hit row. Hits already render the
          // value the template intended; only the failure modes are worth
          // promoting to a regression vector. The vector is named after the
          // path that failed, so its purpose is self-evident in vectors.json.
          if (r.status !== "hit") {
            const save = makeEl("button", { class: "dx-save", title: "Copy a conformance vector for this case" }, "Save vector");
            save.addEventListener("click", (e) => { e.stopPropagation(); saveAsVector(r); });
            row.append(save);
          }
          row.title = "jump to source";
          row.addEventListener("click", () => openProblem({ file: r.file, line: pos.line, col: pos.column }));
          list.append(row);
        }
        section.append(list);
        body.append(section);
      }

      // Build a `conformance/vectors.json`-shaped object from the current
      // workspace + the actual rendered output, and copy it to the clipboard.
      // The vector documents *what the engine did* for a given input — useful
      // both for capturing a confirmed bug fix (vector matches future fix) and
      // for pinning current behaviour when a refactor is imminent.
      function saveAsVector(row) {
        const tmpl = tabs[0].source;
        const partials = {};
        for (const t of tabs.slice(1)) partials[t.name] = t.source;
        const name = row ? `data access: ${row.status} ${row.path}` : "playground capture";
        const vector = {
          name,
          template: tmpl,
          partials,
          data: lastData == null ? {} : lastData,
          escape: escapeMode,
          expected: lastOutput,
          transformers: lastUsedTransformers,
        };
        const json = JSON.stringify(vector);
        navigator.clipboard?.writeText(json).then(
          () => toast(`Vector "${name}" copied to clipboard`),
          () => toast("Couldn't copy (permission?)"),
        );
      }
      function dxSnippet(v) {
        if (v === null || v === undefined) return "nil";
        if (typeof v === "string") return JSON.stringify(v).slice(0, 60);
        if (typeof v === "object") {
          try { return JSON.stringify(v).slice(0, 60); } catch { return "[object]"; }
        }
        return String(v);
      }

      // ── Panel #2: Whitespace trim trace ───────────────────────────────
      // Every `{{~` / `~}}` marker (ADR-0016), jump-linked. Tells users at a
      // glance which tags participate in newline/space trimming.
      function renderWhitespace(body) {
        const rows = lastWhitespace;
        const explicit = rows.filter((r) => r.kind === "leading" || r.kind === "trailing");
        const standalone = rows.filter((r) => r.kind === "standalone");
        const section = makeEl("div", { class: "wt-section" });
        section.append(makeEl("div", { class: "wt-head" }, [
          makeEl("strong", {}, "Whitespace control"),
          " — ", String(explicit.length), " explicit `~` marker", explicit.length === 1 ? "" : "s",
          " · ", String(standalone.length), " standalone-tag line", standalone.length === 1 ? "" : "s",
          standalone.length && !standalone[0].stripped ? " (currently stripped by ADR-0016 default)" : "",
        ]));
        if (rows.length === 0) {
          section.append(makeEl("div", { class: "wt-empty" },
            "No `~` trim markers and no standalone-tag lines in the templates."));
          body.append(section);
          return;
        }
        const list = makeEl("div", { class: "wt-rows" });
        for (const r of rows) {
          const kindLabel = r.kind === "leading" ? "{{~"
            : r.kind === "trailing" ? "~}}"
            : "standalone";
          const desc = r.kind === "leading"
            ? "trim whitespace before this tag (up to and including the preceding newline)"
            : r.kind === "trailing"
              ? "trim whitespace after this tag (up to and including the following newline)"
              : `line stripped by ADR-0016 standalone rule — ${r.desc} tag with only whitespace around it`;
          const row = makeEl("div", { class: `wt-row wt-${r.kind}` }, [
            makeEl("span", { class: "wt-kind" }, kindLabel),
            makeEl("span", { class: "wt-where" }, `${r.file}:${r.line}:${r.col}`),
            makeEl("span", { class: "wt-desc" }, desc),
          ]);
          row.title = "jump to source";
          row.addEventListener("click", () => openProblem({ file: r.file, line: r.line, col: r.col }));
          list.append(row);
        }
        section.append(list);
        if (standalone.length && !standalone[0].stripped && !standaloneState()) {
          section.append(makeEl("div", { class: "wt-hint" },
            "Trim whitespace is OFF — these standalone lines render as-is. Toggle it on to apply ADR-0016."));
        }
        body.append(section);
      }

      // Convenience for the panel's hint line — reads the global `standalone`
      // flag the toolbar toggle controls.
      function standaloneState() { return standalone; }

      // ── Panel #3: Partial graph (Dependencies, formerly the floating popup) ──
      // The list and the SVG graph are about partials, not about main — main
      // is the entry, every graph has it. So:
      //   - The badge / "N defined" line counts partials only (deps.nodes
      //     minus `main`).
      //   - The list shows partials only — main has no row.
      //   - When there are zero partials (no invoke_partial ops anywhere),
      //     the graph cell collapses and an empty state takes its place.
      //   - Aggregated edges carry a `count` so an edge from main → row used
      //     twice renders as one arrow labelled "2", not two parallel arrows
      //     (the snapshot/call-graph reading).
      // Thin wrapper: the renderer lives in `panels/partials.mjs` (companion
      // to the Transformers extraction). Funnels current state + host helpers
      // into the module's pure-renderer signature.
      function renderPartials(body) {
        renderPartialsPanel(body, {
          partialDeps: lastDeps,
          makeEl,
          openOrCreatePartial,
          tabIndexByFile,
          selectTemplateTab,
          renderDepsGraph,
        });
      }

      // ── Panel #5: Capabilities / escape provenance ────────────────────
      // The security profile is per-engine (ADR-0020): Stem renders its
      // render-time host policy (allow-list, eval gate, escape modes);
      // Handlebars renders its own — compile-time helper whitelist, prototype-
      // access hardening, and the global escaping model — never remapping
      // Stem's controls onto it (no false parity, no "N/A" shown as green). The
      // emit-escape mix and the iframe+CSP sandbox are the engine-agnostic floor.
      function renderCapabilities(body) {
        const section = makeEl("div", { class: "cp-section" });
        const policy = makeEl("div", { class: "cp-policy" });
        const pol = (label, value, cls) => {
          policy.append(makeEl("div", { class: `cp-policy-row ${cls || ""}` }, [
            makeEl("span", { class: "cp-policy-k" }, label),
            makeEl("span", { class: "cp-policy-v" }, value),
          ]));
        };

        // Engine-agnostic emit-escape mix, appended at the end for both engines.
        const escapeMix = () => {
          const er = lastEscapeRuns || { html: 0, plain: 0, raw: 0, total: 0 };
          const emit = makeEl("div", { class: "cp-emit" }, [
            makeEl("strong", {}, "Emit nodes by escape mode:"),
            makeEl("span", { class: "cp-emit-row" },
              `${er.total} emits — ${er.html} html · ${er.plain} plain · ${er.raw} raw`),
          ]);
          if (er.raw > 0) {
            emit.append(makeEl("div", { class: "cp-warn" },
              `⚠ ${er.raw} raw emit${er.raw === 1 ? "" : "s"} skip escape entirely — verify these emit pre-escaped content.`));
          }
          return emit;
        };

        // ── Handlebars security profile ────────────────────────────────────
        if (!engineHas("stem-allow-list")) {
          section.append(makeEl("div", { class: "cp-head" }, [
            makeEl("strong", {}, "Capabilities & escape"),
            " — Handlebars security profile",
          ]));
          pol("Engine", `Handlebars ${engineMeta.version} · ${engineMeta.builtins.length} helpers`, "ok");
          pol("HTML escaping", "ON by default (global) — {{ }} escapes; {{{ }}} / SafeString emit raw", "ok");
          pol("Per-context escaping", "not available — Handlebars escapes HTML only (no JSON/URL/XML modes)", "warn");
          pol("Helper whitelist", "knownHelpers / knownHelpersOnly available at compile time — not enforced in this preview", "ok");
          pol("Prototype-access hardening", "ON by default — Handlebars ≥4.6 blocks access to prototype properties/methods (allowProtoProperties/allowProtoMethods off)", "ok");
          pol("Eval", "N/A on this engine — Handlebars has no dynamic-eval helper", "");
          pol("Sandbox", "rendered output runs in the same-origin iframe + CSP boundary (engine-agnostic floor)", "ok");
          section.append(policy);
          section.append(escapeMix());
          body.append(section);
          return;
        }

        // ── Stem host policy (ADR-0013) ────────────────────────────────────
        // Risk tier rollup.
        const tierCounts = { default: 0, format: 0, transform: 0, eval: 0, host: 0 };
        for (const name of lastUsedTransformers) {
          tierCounts[TRANSFORMER_RISK[name] || "host"]++;
        }
        section.append(makeEl("div", { class: "cp-head" }, [
          makeEl("strong", {}, "Capabilities & escape"),
          " — host policy snapshot for this run",
        ]));
        pol("Engine", `${engineMeta.version} · ${engineMeta.builtins.length} built-ins · ${engineMeta.bcVersion}`, "ok");
        pol("Escape mode", escapeMode, "ok");
        pol("Trim whitespace", standalone ? "ON (ADR-0016 standalone-tag stripping)" : "off", "ok");
        pol(
          "Allow-list",
          allowList === null
            ? "unconstrained (every built-in callable)"
            : allowList.length === 0
              ? "EMPTY (every transformer refused)"
              : `${allowList.length} name${allowList.length === 1 ? "" : "s"} callable — ${allowList.join(", ")}`,
          allowList === null ? "ok" : (allowList.length === 0 ? "warn" : "ok")
        );
        pol("Eval transformer", lastUsedTransformers.includes("eval") ? "REFERENCED (data-scope disclosure risk)" : "not referenced",
            lastUsedTransformers.includes("eval") ? "danger" : "ok");
        section.append(policy);
        // Risk-tier breakdown.
        const tiers = makeEl("div", { class: "cp-tiers" });
        const tierLabel = {
          default: "default (always on)",
          format: "format (low risk)",
          transform: "transform (medium · audited)",
          eval: "eval (dynamic · opt-in)",
          host: "host (custom transformers)",
        };
        for (const [t, n] of Object.entries(tierCounts)) {
          if (n === 0) continue;
          tiers.append(makeEl("div", { class: `cp-tier cp-risk-${t}` }, [
            makeEl("span", { class: "cp-tier-k" }, tierLabel[t]),
            makeEl("span", { class: "cp-tier-v" }, String(n)),
          ]));
        }
        if (!tiers.children.length) {
          tiers.append(makeEl("div", { class: "cp-empty" }, "No transformers referenced."));
        }
        section.append(tiers);
        // Emit-escape mix.
        const er = lastEscapeRuns || { html: 0, plain: 0, raw: 0, total: 0 };
        const emit = makeEl("div", { class: "cp-emit" }, [
          makeEl("strong", {}, "Emit nodes by escape mode:"),
          makeEl("span", { class: "cp-emit-row" },
            `${er.total} emits — ${er.html} html · ${er.plain} plain · ${er.raw} raw (\`{{{…}}}\`)`),
        ]);
        if (er.raw > 0) {
          emit.append(makeEl("div", { class: "cp-warn" },
            `⚠ ${er.raw} raw emit${er.raw === 1 ? "" : "s"} skip escape entirely — verify these emit pre-escaped content.`));
        }
        section.append(emit);
        body.append(section);
      }

      // ── Panel #6: Performance ─────────────────────────────────────────
      // Coarse per-phase timings for the last run. Cheap; serves as a
      // canary for regressions during interactive edits.
      function renderPerformance(body) {
        const t = lastTimings;
        const section = makeEl("div", { class: "pf-section" });
        if (!t) {
          section.append(makeEl("div", { class: "pf-empty" }, "No run yet."));
          body.append(section);
          return;
        }
        const fmt = (ms) => `${ms.toFixed(2)} ms`;
        section.append(makeEl("div", { class: "pf-head" }, [
          makeEl("strong", {}, "Performance"),
          " — wall-clock per phase, this run",
        ]));
        const grid = makeEl("div", { class: "pf-grid" });
        const row = (k, v, sub) => {
          grid.append(makeEl("div", { class: "pf-k" }, k));
          grid.append(makeEl("div", { class: "pf-v" }, fmt(v)));
          grid.append(makeEl("div", { class: "pf-sub" }, sub || ""));
        };
        row("Parse (parse_ast × N)", t.parseMs, "static analysis for every dock panel");
        row("Compile", t.compileMs, "source → wire program (span-mapped)");
        row("Render", t.renderMs, `output: ${t.outBytes.toLocaleString()} bytes`);
        row("Total", t.totalMs, "");
        section.append(grid);
        if (t.totalMs > 100) {
          section.append(makeEl("div", { class: "pf-warn" },
            "⚠ Total run > 100 ms. Most of the cost is usually Parse on N partials — collapse small partials inline or simplify expressions."));
        }
        body.append(section);
      }

      // ── Panel #7: Coverage map ────────────────────────────────────────
      // Static branch coverage from the current data: each `if`/`unless`/
      // `each`/`with` block reports whether it would execute and (for loops)
      // how many iterations.
      function renderCoverage(body) {
        // Coverage counts conditional / iteration hits during the render.
        const rows = lastCoverage;
        const section = makeEl("div", { class: "cv-section" });
        section.append(makeEl("div", { class: "cv-head" }, [
          makeEl("strong", {}, "Coverage"),
          " — ", String(rows.length), " block", rows.length === 1 ? "" : "s",
          " · ", String(rows.filter((r) => r.executed).length), " executed",
          " · ", String(rows.filter((r) => !r.executed).length), " skipped",
        ]));
        if (rows.length === 0) {
          section.append(makeEl("div", { class: "cv-empty" },
            "No conditional or iteration blocks in this template."));
          body.append(section);
          return;
        }
        section.append(makeEl("div", { class: "cv-hint" },
          "Static against the current data — a block in a scoped subtree (loop body or partial-scope) is flagged unknown."));
        const list = makeEl("div", { class: "cv-rows" });
        for (const r of rows) {
          const cls = r.executed ? "ok" : "dead";
          const src = fileSource(r.file);
          const pos = typeof r.start === "number"
            ? charToLineColumn(src, byteRangeToCharRange(src, r.start, r.end)[0])
            : { line: 1, column: 1 };
          const row = makeEl("div", { class: `cv-row ${cls}` }, [
            makeEl("span", { class: "cv-kind" }, r.kind),
            makeEl("span", { class: "cv-label" }, r.label),
            makeEl("span", { class: "cv-where" }, `${r.file}:${pos.line}:${pos.column}`),
          ]);
          row.title = "jump to source";
          row.addEventListener("click", () => openProblem({ file: r.file, line: pos.line, col: pos.column }));
          list.append(row);
        }
        section.append(list);
        body.append(section);
      }

      // ── Panel: Truthiness (ADR-022) ──────────────────────────────────
      // The conditions whose branch would differ on another engine, from the
      // engine's analyse mode. Each row jump-links to the source tag; the fix is
      // the portable rewrite. Reuses the Coverage panel's `cv-*` styling.
      function renderTruthiness(body) {
        const a = lastAnalyse;
        const section = makeEl("div", { class: "cv-section" });
        // strip markdown code-ticks — this is a plain diagnostics panel, not markdown.
        const plain = (s) => String(s).replace(/`/g, "");
        if (!a.ok) {
          section.append(makeEl("div", { class: "cv-empty" },
            "Analyse unavailable: " + (a.error || "the template did not render.")));
          body.append(section);
          return;
        }
        // ADR-030 coverage honesty: observed findings the data actually hit, the
        // potential same-type ambiguous value any condition could hold, and advisory
        // data-access misses (a bare path absent from a present object).
        const observed = a.findings.filter((f) => f.kind === "observed");
        const potential = a.findings.filter((f) => f.kind === "potential");
        const misses = a.findings.filter((f) => f.kind === "miss");
        section.append(makeEl("div", { class: "cv-head" }, [
          makeEl("strong", {}, "Truthiness"),
          " — ", String(observed.length), " observed, ", String(potential.length), " potential",
          misses.length ? `, ${misses.length} miss` : "",
        ]));
        // ADR-030: when config.yaml declares safe paths, say so — the panel's
        // potential/miss findings for those paths are suppressed, so this explains
        // why they're absent (the interactive suppression demo).
        if (labPathSchema.length) {
          const n = lastAnalyseSuppressed;
          section.append(makeEl("div", { class: "cv-hint" },
            `PathSchema active (${n} suppressed) — hiding potential & miss findings for ${labPathSchema.map((p) => "`" + p + "`").join(", ")} (config.yaml → analyse.pathSchema).`));
        }
        if (a.findings.length === 0) {
          section.append(makeEl("div", { class: "cv-empty" },
            "Every condition agrees across engines for this data — portable."));
          body.append(section);
          return;
        }
        // A finding row; `label(f)` formats the middle column (truthiness findings
        // name the flips; misses describe the absent path).
        const findingGroup = (rows, label) => {
          const list = makeEl("div", { class: "cv-rows" });
          for (const f of rows) {
            const row = makeEl("div", { class: "cv-row dead" }, [
              makeEl("span", { class: "cv-kind" }, f.tag),
              makeEl("span", { class: "cv-label" }, label(f)),
              makeEl("span", { class: "cv-where" }, `main:${f.line}:${f.column}`),
            ]);
            row.title = "jump to source";
            row.addEventListener("click", () => openProblem({ file: "main", line: f.line, col: f.column }));
            list.append(row);
            list.append(makeEl("div", { class: "cv-hint" },
              [makeEl("strong", {}, "Fix: "), plain(f.fix)]));
          }
          return list;
        };
        const flipLabel = (verb) => (f) => `${verb} ${plain(f.value)} — flips under ${f.flips.join(", ")}`;
        if (observed.length) {
          section.append(makeEl("div", { class: "cv-hint" },
            "Observed — this data drove the condition into an ambiguous value that branches differently on another engine. Branch explicitly."));
          section.append(findingGroup(observed, flipLabel("tested")));
        }
        if (potential.length) {
          section.append(makeEl("div", { class: "cv-hint" },
            "Potential — portable for this data, but the same-type ambiguous value would diverge (independent of the sample). Branch explicitly to be safe for all data."));
          section.append(findingGroup(potential, flipLabel("would diverge if it held")));
        }
        if (misses.length) {
          section.append(makeEl("div", { class: "cv-hint" },
            "Possible misses (advisory) — a bare path resolved to absent from a present object, for this data. Likely a typo or a missing field."));
          section.append(findingGroup(misses, (f) => `\`${f.path}\` ${plain(f.value)}`));
        }
        body.append(section);
      }

      // Lint panel (ADR-019): the deprecated-alias + non-canonical scoped-variable
      // findings for the active dialect — the same canonicalization the editor
      // quick-fix and `flatbars lint` surface. Each row is severity + the message
      // that names the canonical spelling; a clean template is positive evidence.
      function renderLint(body) {
        const a = lastLint;
        const section = makeEl("div", { class: "cv-section" });
        const plain = (s) => String(s).replace(/`/g, "");
        if (!a.ok) {
          section.append(makeEl("div", { class: "cv-empty" },
            "Lint unavailable: " + (a.error || "the template did not parse.")));
          body.append(section);
          return;
        }
        const rows = a.findings;
        section.append(makeEl("div", { class: "cv-head" }, [
          makeEl("strong", {}, "Lint"),
          " — ", String(rows.length), " canonicalization finding", rows.length === 1 ? "" : "s",
        ]));
        if (rows.length === 0) {
          section.append(makeEl("div", { class: "cv-empty" },
            "Every name is canonical — no deprecated aliases or legacy scoped variables."));
          body.append(section);
          return;
        }
        section.append(makeEl("div", { class: "cv-hint" },
          "Each finding renders identically today, but a canonical spelling keeps the template portable. The editor quick-fix and flatbars lint steer to it."));
        const list = makeEl("div", { class: "cv-rows" });
        for (const f of rows) {
          const row = makeEl("div", { class: "cv-row" }, [
            makeEl("span", { class: "cv-kind" }, f.name || f.severity),
            makeEl("span", { class: "cv-label" }, plain(f.message)),
            makeEl("span", { class: "cv-where" }, `main:${f.line}:${f.column}`),
          ]);
          row.title = "jump to source";
          row.addEventListener("click", () => openProblem({ file: "main", line: f.line, col: f.column }));
          list.append(row);
        }
        section.append(list);
        body.append(section);
      }

      // Context Inspector: snapshots of the render context at the last-clicked
      // output span, from the engine's `inspect_at` — one card per execution
      // (loop bodies yield one per iteration).
      function renderContext(body) {
        const pane = makeEl("div", { class: "ctx-pane" });
        // Context Inspector reads render-time scope at a Stem source span.
        if (!ctxTarget || !lastProgram) {
          pane.append(makeEl("div", { class: "ctx-hint" },
            "Click an expression in the Plain Text output to inspect its scope here. " +
            "Loop bodies produce one snapshot per iteration."));
          body.append(pane);
          return;
        }
        let snaps;
        try {
          snaps = renderer.inspectAt(
            lastProgram, lastData,
            { file: ctxTarget.file, start: ctxTarget.start, end: ctxTarget.end },
            {}
          );
        } catch (err) {
          pane.append(makeEl("div", { class: "ctx-hint" }, "inspect error: " + err.message));
          body.append(pane);
          return;
        }
        pane.append(makeEl("div", { class: "ctx-hint" },
          `${snaps.length} snapshot${snaps.length === 1 ? "" : "s"} at \`${oneLineLabel(ctxTarget.label)}\`` +
          " · re-execute-on-demand, no live trace"));
        snaps.forEach((s, i) => pane.append(renderSnap(s, i)));
        if (!snaps.length) {
          pane.append(makeEl("div", { style: "padding:8px 2px;color:var(--fg-muted);font-size:12px" },
            "This span was never reached during render."));
        }
        body.append(pane);
      }

      // Title a snapshot by its iteration when it comes from a loop body — the
      // engine hoists @index/@key onto each snapshot — so 50 cards read as
      // "@index 0 · @key …" rather than an anonymous "#1..#50" flip-book.
      function snapTitle(snap, i) {
        if (snap.index === null || snap.index === undefined) return "#" + (i + 1);
        const key = snap.key === null || snap.key === undefined
          ? ""
          : " · @key " + (typeof snap.key === "string" ? snap.key : String(snap.key));
        return "@index " + snap.index + key;
      }

      function renderSnap(snap, i) {
        const head = makeEl("div", { class: "ctx-snap-head" }, [
          makeEl("span", { class: "ix" }, snapTitle(snap, i)),
          makeEl("span", { class: "src" }, oneLineLabel(ctxTarget.label)),
        ]);
        const rows = [
          ["@this", snap.this], ["@parent", snap.parent], ["@root", snap.root],
          ["@index", snap.index], ["@index1", snap.index1], ["@key", snap.key],
          ["@first", snap.first], ["@last", snap.last],
        ].filter(([, v]) => v !== null && v !== undefined);
        for (const [k, v] of Object.entries(snap.locals || {})) rows.push([k, v]);
        const table = makeEl("div", { class: "ctx-snap-table" });
        for (const [k, v] of rows) {
          table.append(makeEl("span", { class: "key" }, k));
          table.append(makeEl("span", { class: "val" }, [
            ctxSnippet(v),
            makeEl("span", { class: "ty" }, ctxType(v)),
          ]));
        }
        return makeEl("div", { class: "ctx-snap" }, [head, table]);
      }
      // The Context Inspector exists to *see* the scope, so show the value in
      // full — pretty-printed for objects/arrays — and let the cell wrap (and
      // scroll past a bounded height). Truncating here defeated the purpose.
      function ctxSnippet(v) {
        if (v === null || v === undefined) return "—";
        if (typeof v === "object") {
          try { return JSON.stringify(v, null, 2); } catch { return "[object]"; }
        }
        if (typeof v === "string") return JSON.stringify(v);
        return String(v);
      }
      function ctxType(v) {
        if (v === null) return "null";
        if (Array.isArray(v)) return `array(${v.length})`;
        return typeof v;
      }

      // Point the Context Inspector at a clicked output segment (emit/expr runs
      // only; literal text has no inspectable scope). Opens the Context tab when
      // the dock is visible; otherwise stored for when it next opens.
      function setContextTarget(sv) {
        if (!sv || sv.start === null) return;
        const src = fileSource(sv.file);
        const [from, to] = byteRangeToCharRange(src, sv.start, sv.end);
        const label = src.slice(from, to).trim() || `${sv.file}:${sv.start}`;
        ctxTarget = { file: sv.file, start: sv.start, end: sv.end, label };
        selectDataTab("context");
      }

      // The active template tab's pre-expansion AST (real `parse_ast`), as an
      // indented outline. Clicking a row highlights its source span in the editor.
      function renderAst(body) {
        const source = activeTab().source;
        const parsed = renderer.parseAst(source);
        if (parsed.error) {
          body.append(makeEl("div", { class: "problem-empty" }, parsed.error.message));
          return;
        }
        const rows = astOutline(parsed.ast.nodes);
        if (!rows.length) {
          body.append(makeEl("div", { class: "problem-empty" }, "empty template — no nodes"));
          return;
        }
        const pane = makeEl("div", { class: "ast-pane" });
        rows.forEach((r, i) => {
          const row = makeEl("div", { class: "ast-row" });
          // Text rows preview a whitespace-collapsed slice; the full run is on
          // hover (and click-to-source highlights it in the editor).
          if (typeof r.full === "string") row.title = r.full;
          // A line-number gutter (the inspector panel isn't a CodeMirror editor,
          // so it has no gutter of its own) and the node-type keyword coloured.
          row.append(makeEl("span", { class: "ast-ln" }, String(i + 1)));
          const content = makeEl("span", { class: "ast-content", style: `padding-left:${r.depth * 16}px` });
          const sp = r.text.indexOf(" ");
          if (sp > 0) content.append(makeEl("span", { class: "ast-kw" }, r.text.slice(0, sp)), r.text.slice(sp));
          else content.append(makeEl("span", { class: "ast-kw" }, r.text));
          row.append(content);
          if (typeof r.start === "number") {
            row.classList.add("linked");
            row.addEventListener("mouseenter", () => {
              const [from, to] = byteRangeToCharRange(source, r.start, r.end);
              templateView.dispatch({ effects: setLinkHighlight.of({ from, to }) });
            });
            row.addEventListener("mouseleave", clearLink);
            row.addEventListener("click", () => {
              const [from] = byteRangeToCharRange(source, r.start, r.end);
              templateView.focus();
              templateView.dispatch({ selection: { anchor: from }, scrollIntoView: true });
            });
          }
          pane.append(row);
        });
        body.append(pane);
      }

      function renderProblems(body) {
        if (!dockProblems.length) {
          body.append(makeEl("div", { class: "problem-empty" }, [
            makeEl("b", {}, "✓ No errors. "),
            "Compile and capability checks passed.",
          ]));
          return;
        }
        for (const p of dockProblems) {
          const sev = p.severity === "cap" ? "cap"
            : p.severity === "missing" ? "cap"
            : p.severity === "render" ? "render"
            : "error";
          const sourceLabel = p.severity === "cap" ? "capability"
            : p.severity === "missing" ? "missing assign"
            : "compile";
          const unknownPartial = p.message.match(/unknown partial ['"](.*?)['"]/);
          const msgChildren = [p.message];
          if (unknownPartial) {
            const name = unknownPartial[1];
            const btn = makeEl("button", { class: "problem-action", title: `Open or create partial "${name}"` }, "＋ Create partial");
            btn.addEventListener("click", (e) => { e.stopPropagation(); openOrCreatePartial(name); });
            msgChildren.push(btn);
          }
          const row = makeEl("div", { class: `problem ${sev}`, title: "jump to source" }, [
            makeEl("span", { class: "sev" }, sev === "cap" ? "!" : "×"),
            makeEl("span", { class: "where" }, `${p.file}:${p.line}:${p.col}`),
            makeEl("span", { class: "msg" }, msgChildren),
            makeEl("span", { class: "src" }, sourceLabel),
          ]);
          row.addEventListener("click", () => openProblem(p));
          body.append(row);
        }
      }

      // Jump from a Problems row to its source location.
      function openProblem(p) {
        if (p.file === "transform") {
          selectTransformTab();
          moveCaretTo(templateView, p.line, p.col);
          return;
        }
        if (p.file === "data.yaml") {
          selectDataTab("data");
          moveCaretTo(dataView, p.line, p.col);
          return;
        }
        const idx = tabIndexByFile(p.file);
        if (idx < 0) return;
        selectTemplateTab(idx);
        moveCaretTo(templateView, p.line, p.col);
      }
      function moveCaretTo(view, line, col) {
        const ln = Math.max(1, Math.min(view.state.doc.lines, line || 1));
        const lineObj = view.state.doc.line(ln);
        const pos = Math.min(lineObj.to, lineObj.from + Math.max(0, (col || 1) - 1));
        view.focus();
        view.dispatch({ selection: { anchor: pos }, scrollIntoView: true });
      }

      const SVG_NS = "http://www.w3.org/2000/svg";
      function svgEl(tag, attrs = {}) {
        const node = document.createElementNS(SVG_NS, tag);
        for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
        return node;
      }

      // A tidy hierarchical (sitemap) layout: a spanning tree rooted at `main`
      // (first reference wins), depth = row, and each node centered over its
      // children — so a child sits directly under its parent (e.g. `row` under
      // `group`), like a site map. Returns id -> center {x, y}.
      function layeredLayout(deps, width, height) {
        const adj = new Map();
        for (const e of deps.edges) {
          if (e.missing) continue;
          if (!adj.has(e.from)) adj.set(e.from, []);
          adj.get(e.from).push(e.to);
        }
        // Spanning tree (BFS, first parent wins), then any unreached nodes as roots.
        const children = new Map(deps.nodes.map((n) => [n.id, []]));
        const seen = new Set();
        const roots = [];
        const visit = (root) => {
          seen.add(root);
          roots.push(root);
          const queue = [root];
          while (queue.length) {
            const cur = queue.shift();
            for (const to of adj.get(cur) || []) {
              if (seen.has(to) || !children.has(to)) continue;
              seen.add(to);
              children.get(cur).push(to);
              queue.push(to);
            }
          }
        };
        if (children.has("main")) visit("main");
        for (const n of deps.nodes) if (!seen.has(n.id)) visit(n.id);

        const depth = new Map();
        const setDepth = (id, d) => {
          depth.set(id, d);
          for (const c of children.get(id)) setDepth(c, d + 1);
        };
        for (const r of roots) setDepth(r, 0);

        // Post-order column: leaves get sequential slots, parents center over
        // their children, so a subtree stays grouped under its root.
        let leaf = 0;
        const col = new Map();
        const assignCol = (id) => {
          const kids = children.get(id);
          if (!kids.length) { col.set(id, leaf++); return col.get(id); }
          const c = kids.reduce((s, k) => s + assignCol(k), 0) / kids.length;
          col.set(id, c);
          return c;
        };
        for (const r of roots) assignCol(r);

        // Group ids by depth (left-to-right) so a dense level can be staggered:
        // adjacent siblings alternate up/down, letting columns pack at half the
        // box width without the boxes overlapping (the user's interleave fix).
        const byDepth = new Map();
        for (const n of deps.nodes) {
          const d = depth.get(n.id) || 0;
          (byDepth.get(d) || byDepth.set(d, []).get(d)).push(n.id);
        }
        for (const ids of byDepth.values()) ids.sort((a, b) => col.get(a) - col.get(b));

        // Fixed pitches → natural content size; the SVG viewBox scales to fit.
        const boxW = 104, boxH = 32, colPitch = 66, stagger = boxH / 2 + 10, m = 30;
        const rowPitch = boxH + 2 * stagger + 30;
        const pos = new Map();
        for (const [d, ids] of byDepth) {
          const dense = ids.length > 1; // colPitch < boxW, so any neighbour pair would touch
          ids.forEach((id, i) => {
            const x = m + boxW / 2 + col.get(id) * colPitch;
            let y = m + boxH / 2 + stagger + d * rowPitch;
            if (dense) y += i % 2 === 0 ? -stagger : stagger;
            pos.set(id, { x, y });
          });
        }
        const maxCol = Math.max(0, ...col.values());
        const maxD = Math.max(0, ...depth.values());
        const w = 2 * m + boxW + maxCol * colPitch;
        const h = 2 * m + boxH + 2 * stagger + maxD * rowPitch;
        return { pos, w, h };
      }

      // Paint the partial dependency graph as an SVG into `body`. Click a node
      // to jump to its source tab. The Partials dock panel (renderPartials)
      // owns the chrome (header, list, cycles section); this function paints
      // only the graph cell, so it composes inside the dock body's height.
      function renderDepsGraph(body, deps) {
        const boxW = 104, boxH = 32;
        // The tidy tree sizes its own canvas to the content (natural pitches);
        // the viewBox then scales to fit, so there is no stretched empty space.
        const { pos, w: W, h: H } = layeredLayout(deps);

        // ADR-0014: partial recursion is legal (the runtime caps invoke depth),
        // so a cycle is informational — the back-edges that close it are drawn in
        // the accent, not as errors.
        const recursivePairs = new Set();
        for (const c of deps.cycles) {
          for (let i = 0; i < c.length - 1; i++) recursivePairs.add(c[i] + "→" + c[i + 1]);
        }

        const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: "dep-svg", preserveAspectRatio: "xMidYMid meet" });
        const defs = svgEl("defs");
        const marker = svgEl("marker", { id: "dep-arrow", viewBox: "0 0 10 10", refX: "9", refY: "5", markerUnits: "userSpaceOnUse", markerWidth: "8", markerHeight: "8", orient: "auto" });
        marker.append(svgEl("path", { d: "M0,0 L10,5 L0,10 z", fill: "currentColor" }));
        defs.append(marker);
        svg.append(defs);

        for (const e of deps.edges) {
          const a = pos.get(e.from), b = pos.get(e.to);
          if (!a || !b) continue;
          const cls = "dep-edge" + (recursivePairs.has(e.from + "→" + e.to) ? " recursive" : "") + (e.missing ? " missing" : "");
          // Shorten both ends to the node box edges so the arrowhead is visible.
          const ang = Math.atan2(b.y - a.y, b.x - a.x);
          const x1 = a.x + Math.cos(ang) * 34, y1 = a.y + Math.sin(ang) * 20;
          const x2 = b.x - Math.cos(ang) * 34, y2 = b.y - Math.sin(ang) * 20;
          const path = svgEl("path", { class: cls, d: `M${x1},${y1} L${x2},${y2}` });
          const tip = e.missing
            ? `unknown partial: ${e.to}`
            : recursivePairs.has(e.from + "→" + e.to)
              ? `recursive partial '${e.to}' — legal (the runtime caps invoke depth)`
              : null;
          if (tip) {
            const title = svgEl("title");
            title.textContent = tip;
            path.append(title);
          }
          svg.append(path);
          // Snapshot-call-graph annotation: label each edge with its call
          // count when more than one. Two parallel invocations show as one
          // arrow labelled "2", not two overlapping arrows.
          if (typeof e.count === "number" && e.count > 1) {
            const lx = (x1 + x2) / 2, ly = (y1 + y2) / 2 - 4;
            const label = svgEl("text", {
              class: "dep-edge-count", x: lx, y: ly, "text-anchor": "middle",
            });
            label.textContent = String(e.count);
            svg.append(label);
          }
        }

        for (const n of deps.nodes) {
          const p = pos.get(n.id);
          if (!p) continue;
          const inCycle = deps.cycles.some((c) => c.includes(n.id));
          const g = svgEl("g", { class: "dep-node" + (n.isMain ? " main" : "") + (inCycle ? " recursive" : "") + (n.missing ? " missing" : ""), transform: `translate(${p.x - boxW / 2},${p.y - boxH / 2})` });
          const rect = svgEl("rect", { width: boxW, height: boxH, rx: "6" });
          g.append(rect);
          const text = svgEl("text", { x: boxW / 2, y: boxH / 2 + 4, "text-anchor": "middle" });
          text.textContent = n.id;
          g.append(text);
          g.style.cursor = "pointer";
          g.addEventListener("click", () => {
            const idx = tabs.findIndex((t) => t.name === n.id);
            if (idx >= 0) selectTemplateTab(idx);
          });
          svg.append(g);
        }

        const svgWrap = makeEl("div", { class: "dep-svg-wrap" });
        svgWrap.append(svg);
        body.append(svgWrap);
      }

      function setDockVisible(visible) {
        byId("dock").hidden = !visible;
        // Restore the persisted height when reopening.
        if (visible && typeof panelState.dock.height === "number") {
          byId("dock").style.height = panelState.dock.height + "px";
        }
        const toggle = byId("dock-toggle");
        toggle.classList.toggle("active", visible);
        toggle.setAttribute("aria-pressed", String(visible));
        if (visible) renderDock();
        // Mutate (don't replace) so the saved height survives a visibility change.
        panelState.dock.open = visible;
        savePanels();
      }

      byId("dock-toggle").addEventListener("click", () => setDockVisible(byId("dock").hidden));
      // Tab buttons are wired in paintDockTabs() — array-driven by dockTabs.
      // Close (hide) the diagnostics dock, like the panel close buttons.
      byId("dock-collapse").addEventListener("click", () => setDockVisible(false));
      // Drag the grip to resize the dock height. Pointer capture keeps move/up
      // events flowing to the grip even when the pointer crosses the output
      // iframe (which would otherwise swallow them); the body class belts it.
      byId("dock-grip").addEventListener("pointerdown", (e) => {
        const dock = byId("dock");
        const grip = byId("dock-grip");
        if (dock.classList.contains("collapsed")) return;
        e.preventDefault();
        grip.classList.add("dragging");
        document.body.classList.add("dragging-dock");
        grip.setPointerCapture(e.pointerId);
        const startY = e.clientY;
        const startH = dock.offsetHeight;
        const onMove = (ev) => {
          dock.style.height = Math.max(80, Math.min(560, startH + (startY - ev.clientY))) + "px";
        };
        const onUp = () => {
          grip.classList.remove("dragging");
          document.body.classList.remove("dragging-dock");
          grip.removeEventListener("pointermove", onMove);
          grip.removeEventListener("pointerup", onUp);
          renderDock();
          panelState.dock.height = dock.offsetHeight;
          savePanels();
        };
        grip.addEventListener("pointermove", onMove);
        grip.addEventListener("pointerup", onUp);
      });
      // L-2 · keyboard a11y for the dock grip — focusable separator, arrow keys
      // resize the dock height (Shift = larger step), Home/End snap to bounds.
      (function wireDockGripKeys() {
        const grip = byId("dock-grip");
        const dock = byId("dock");
        grip.setAttribute("role", "separator");
        grip.setAttribute("aria-orientation", "horizontal");
        grip.setAttribute("aria-label", "Resize diagnostics — arrow keys");
        grip.tabIndex = 0;
        const apply = (h) => {
          const clamped = Math.max(80, Math.min(560, h));
          dock.style.height = clamped + "px";
          grip.setAttribute("aria-valuemin", "80");
          grip.setAttribute("aria-valuemax", "560");
          grip.setAttribute("aria-valuenow", String(Math.round(clamped)));
          renderDock();
          panelState.dock.height = dock.offsetHeight;
          savePanels();
        };
        grip.addEventListener("keydown", (e) => {
