              <svg class="dropdown-caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <ul id="example-menu" class="dropdown-menu" role="listbox" hidden></ul>
          </div>
          <!-- Provenance for a vendored fixture loaded via ?vendored= : a link
               back to the upstream source the example was copied from. Hidden
               for hand-edited / catalog examples. -->
          <a id="vendored-source" class="field-label" target="_blank" rel="noopener noreferrer"
             style="margin-left:8px;text-decoration:underline" hidden></a>
        </div>
        <div class="divider"></div>
        <!-- Search · Appearance · Diagnostics · Share — one divider-separated
             cluster sitting next to Examples; the empty space follows on the right. -->
        <div class="topbar-group toolbar">
          <button id="search-btn" class="btn" title="Find in all files (⌘⇧F) — in-editor find is ⌘F">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><span class="btn-label">Search</span> <span class="kbd-inline">⌘⇧F</span></button>
          <button id="tweaks-btn" class="btn" title="Appearance settings (theme, layout)">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 5h6M13 5h-2M3 11h2M9 11h4"/><circle cx="10" cy="5" r="1.7"/><circle cx="6" cy="11" r="1.7"/></svg><span class="btn-label">Appearance</span></button>
          <button id="dock-toggle" class="btn" title="Show/hide diagnostics" aria-pressed="false">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/><path d="M2.5 10.5h11"/></svg><span class="btn-label">Diagnostics</span></button>
          <div id="share" class="dropdown">
            <button id="share-btn" class="btn" type="button" aria-haspopup="menu" aria-expanded="false"
                    title="Share & export — link, Markdown, zip">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6.5 9.5a2.4 2.4 0 0 0 3.5 0l2-2a2.4 2.4 0 0 0-3.4-3.4l-1 1"/><path d="M9.5 6.5a2.4 2.4 0 0 0-3.5 0l-2 2a2.4 2.4 0 0 0 3.4 3.4l1-1"/></svg><span class="btn-label">Share</span>
              <svg class="dropdown-caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <ul id="share-menu" class="dropdown-menu" role="menu" hidden>
              <li class="dropdown-item" role="menuitem" data-act="link">Copy share link</li>
              <li class="dropdown-item" role="menuitem" data-act="md">Copy as Markdown</li>
              <li class="dropdown-item" role="menuitem" data-act="dl-md">Download · Markdown doc (.md)</li>
              <li class="dropdown-item" role="menuitem" data-act="dl-zip">Download · Zip of files (.zip)</li>
            </ul>
          </div>
        </div>
        <div class="spacer"></div>
      </header>

      <!-- ── Workspace ────────────────────────────────────────────── -->
      <main class="workspace">
        <!-- Virtual file explorer: every editable file, grouped by type. Drives
             the existing template/data tabs + render-config popover; built by
             renderExplorer(). The per-pane tab strips stay as the open-editor
             row (inline rename / + / read-only inspectors live there). -->
        <aside class="explorer" id="explorer" aria-label="Files">
          <div class="exp-head">
            <span class="exp-title">EXPLORER</span>
            <button id="exp-collapse-all" class="exp-head-act" type="button" title="Collapse / expand all groups">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l4-4 4 4M4 13l4-4 4 4"/></svg>
            </button>
          </div>
          <div class="exp-scroll" id="explorer-tree"></div>
        </aside>
        <div id="splitter-ex" class="splitter" role="separator" aria-orientation="vertical"
             title="Drag to resize · double-click to reset"></div>

        <div class="editor-region">
        <!-- Sources: a vertical split — the template editor on top, the data /
             overlay editor below it. (The read-only inspectors — Context
             Inspector / Syntax Tree / Render Data — now live in the Diagnostics
             dock.) -->
        <section class="pane pane-sources" aria-label="Sources">
          <!-- TOP: the template editor (template files + transform). -->
          <div class="src-col src-edit">
            <div class="tabs-wrap">
              <div class="tabs" id="tmpl-tabs"></div>
              <button class="focus-toggle" data-pane="sources" title="Focus this pane (Esc to exit)">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
                  <path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/>
                </svg>
              </button>
            </div>
            <div class="editors edit-stack">
              <div class="editor-pane" id="template-editor-container"></div>
              <!-- Shown when every editor tab is closed; pick a file in the Explorer. -->
              <div class="edit-empty" id="edit-empty" hidden>
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2.5 3.5h4l1.5 2h5.5v7h-11z"/></svg>
                <p>No file open</p>
                <span>Pick a file from the Explorer to start editing.</span>
              </div>
            </div>
          </div>
          <div class="esplitter src-esplitter" id="inspect-splitter" title="Drag to resize · double-click to reset"></div>
          <!-- BOTTOM: the data / overlay editor (data.yaml, overlays, config —
               they share the YAML editor `dataView`). -->
          <div class="src-col src-inspect">
            <div class="tabs-wrap">
              <div class="tabs" id="data-tabs"></div>
            </div>
            <div class="editors">
              <div class="editor-pane" id="data-editor-container"></div>
            </div>
          </div>
        </section>

        <div id="splitter-1" class="splitter" role="separator" aria-orientation="vertical"
             title="Drag to resize · double-click to reset"></div>

        <!-- Output pane -->
        <section class="pane pane-output" aria-label="Output">
          <!-- Output view tabs (same layout as the Sources tab strip). "source"
               = the output as text with click-to-source provenance;
               "rendered"/"markdown" = the iframe; "data" = the post-transform
               view-model as YAML; "bytecode" = the wire disassembly. The view
               keys are kept stable (used by examples + URL state). Painted by
               renderViewTabs(). -->
          <div class="tabs-wrap">
            <div id="view-tabs" class="view-tabs" role="tablist" aria-label="Output view"></div>
            <button id="out-copy" class="focus-toggle" title="Copy output to clipboard" aria-label="Copy output">
              <svg class="ico-copy" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
                <rect x="5" y="5" width="8.5" height="9.5" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-5A1.5 1.5 0 0 0 3 3.5v7A1.5 1.5 0 0 0 4.5 12"/>
              </svg>
              <svg class="ico-done" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" hidden>
                <path d="M3.5 8.5l3 3 6-7"/>
              </svg>
            </button>
            <button class="focus-toggle" data-pane="output" title="Focus this pane (Esc to exit)">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
                <path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/>
              </svg>
            </button>
            <!-- MinBars truthiness is set in the config.yaml view now
                 (minbars.truthiness; default mustacheJs), not a UI toggle (ADR-029). -->
          </div>

          <!-- Contextual controls for the active view; toggled by setOutputView. -->
          <div id="view-controls" class="view-controls" hidden>
            <span class="field-label" id="out-lang-label" style="font-size:11px" hidden>Highlight</span>
            <!-- Custom filterable combobox (not a datalist input) so the caret and
                 clear affordances are under our control and the list opens
                 downward. ~140 languages, type to filter. -->
            <div id="out-lang" class="dropdown lang-dropdown" hidden>
              <button id="out-lang-trigger" class="select dropdown-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Highlight language">
                <span id="out-lang-val">Auto</span>
                <svg class="dropdown-caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div id="out-lang-menu" class="dropdown-menu lang-menu" hidden>
                <input id="out-lang-filter" class="lang-filter" type="text" placeholder="Filter languages…" autocomplete="off" spellcheck="false" />
                <ul id="out-lang-list" role="listbox"></ul>
              </div>
            </div>
            <!-- Backing inputs for escape mode + trim whitespace. Both options now
                 live in the Render Config popover (toolbar → Render); these hidden
                 inputs remain the canonical state the rest of the app reads/writes
                 and that share links round-trip, so nothing downstream had to change. -->
            <span id="render-backing" hidden>
              <select id="escape-select" aria-label="Escape mode">
                <option value="">(as compiled)</option>
                <option value="html">html</option>
                <option value="xml">xml</option>
                <option value="json">json</option>
                <option value="none">none</option>
              </select>
              <input type="checkbox" id="standalone-cb" checked />
            </span>
          </div>

          <div class="output-body" data-empty="true">
            <iframe id="output-preview" sandbox="allow-same-origin" title="Rendered output"></iframe>
            <div class="src-view" id="output-text" hidden></div>
          </div>
          <div id="seg-tip" class="seg-tip" role="tooltip" hidden></div>
        </section>
        </div><!-- /.editor-region -->
      </main>


      <!-- ── Diagnostics dock ──────────────────────────────────────── -->
      <aside id="dock" class="dock" aria-label="Diagnostics" hidden>
        <div id="dock-grip" class="dock-grip" title="Drag to resize"></div>
        <div class="dock-tabs" id="dock-tabs"></div>
        <button id="dock-collapse" class="dock-close" title="Close" aria-label="Close diagnostics">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
        <div id="dock-body" class="dock-body"></div>
      </aside>

      <!-- ── Status bar ────────────────────────────────────────────── -->
      <footer class="statusbar">
        <span class="status-pill">
          <span class="dot"></span>
          <span id="status-msg" class="status-msg">no errors</span>
        </span>
        <span id="recompute-ind" class="recompute-ind" role="status" aria-live="polite" hidden>
          <span class="recompute-spin" aria-hidden="true"></span>recomputing…
        </span>
        <!-- Contextual note for the active source tab (e.g. "partial · referenced
             as {{> styles}}"); empty for main. Lives here now that the panes have
             no title header. -->
        <span id="sources-sub" class="status-sub"></span>
        <span class="spacer"></span>
        <span id="status-meta" class="meta"></span>
        <span id="brand-ver" class="status-ver" title="Compiled engine version (from the wasm build)"></span>
        <a href="./compare.html" class="status-ver" style="margin-left:.6rem;color:inherit;text-decoration:none;opacity:.8" title="Render this template across Handlebars, Stem, and FlatBars side by side">⊞ compare</a>
      </footer>
    </div>

    <!-- Apply the stored split ratios synchronously, before first paint, so the
         layout doesn't flash the CSS default and then snap when the deferred
         module's applySplits() runs. Uses flex-basis percentages (no measuring);
         the module later refines them to exact pixels, imperceptibly. -->
    <script>
      (function () {
        try {
          var splits = JSON.parse(localStorage.getItem("stem-playground:splits.v3") || "{}");
          var tweaks = JSON.parse(localStorage.getItem("stem-playground:tweaks") || "{}");
          var stacked = false; // layout is always split now
          var panes = document.querySelectorAll(".editor-region > .pane");
          var w = splits[stacked ? "h0" : "w0"];
          if (panes[0] && typeof w === "number") {
            panes[0].style.flex = "0 0 " + w * 100 + "%";
            if (panes[1]) panes[1].style.flex = "1 1 0";
          }
        } catch (e) {}
      })();
    </script>

    <script type="module">
      // Cache-bust query (like playground_utils.mjs): bump on any change to the
      // engine adapters so a reload never pairs a fresh index.html / example
      // file with a stale cached adapter module.
      import { createRenderer } from "./renderer.mjs?v=1";
      // Engine-derived INNER-TOKEN highlighting (ADR-014 amendment): the shared
      // painter + the lexer's own tokenizer, in place of a hand-written tag regex.
      import { flatbarsHighlight } from "./cm-flatbars.mjs?v=6";
      // The full prelude vocabulary (vendored projection of editors/operations.json)
      // so the editor paints helper names exactly like the LSP / VS Code — NOT the
      // 12-entry user-facing Transformers-panel subset (renderer.allTransformers()).
      import { OPERATION_NAMES } from "./operation-names.mjs?v=1";
      import { highlightSpans } from "./vendor/flatbars-engine.mjs?v=74";
      import { createHelperSandbox } from "./helper-sandbox.mjs?v=1";
      import { renderTransformers as renderTransformersPanel } from "./panels/transformers.mjs";
      import { renderPartials as renderPartialsPanel } from "./panels/partials.mjs";
      import {
        analyseCalls,
        analyseCoverage,
        analyseDataAccess,
        analyseEscapeRuns,
        analyseWhitespace,
        astOutline,
        buildCheatSheetData,
        buildDependencyGraph,
        byteRangeToCharRange,
        charToByte,
        charToLineColumn,
        debounce,
        decodeState,
        disassemble,
        encodeState,
        featureFidelity,
        hasFeature,
        mergeDataOverlays,
        partialNameAt,
        tabVisibleUnder,
        validateOverlayName,
        vendoredVerdict,
        vendoredWorkspace,
      // Cache-bust query: bump on any playground_utils.mjs change so a freshly
      // loaded index.html never pairs with a stale cached module (which silently
      // ran the old, uncompressed encodeState). Bumped for the vendored source link (E2).
      } from "./playground_utils.mjs?v=16";
      // Output-view decisions (extracted for testability; lab/output-view.test.mjs).
      import {
        VIEW_TABS,
        visibleViews as ovVisibleViews,
        validView as ovValidView,
        viewKind,
        applyView,
      } from "./output-view.mjs?v=3";
      import { EditorState, Annotation, StateField, StateEffect, Compartment } from "https://esm.sh/@codemirror/state@6.5.2/es2022/state.mjs";
      import {
        Decoration,
        EditorView,
        MatchDecorator,
        ViewPlugin,
        keymap,
        lineNumbers,
        highlightActiveLine,
        highlightActiveLineGutter
      } from "https://esm.sh/@codemirror/view@6.38.8/X-ZEBjb2RlbWlycm9yL3N0YXRlQDYuNS4y/es2022/view.mjs";
      import { defaultKeymap, history as cmHistory, historyKeymap, indentWithTab } from "https://esm.sh/@codemirror/commands@6.10.3?deps=@codemirror/state@6.5.2,@codemirror/view@6.38.8";
      import { HighlightStyle, StreamLanguage, bracketMatching, syntaxHighlighting } from "https://esm.sh/@codemirror/language@6.11.3?deps=@codemirror/state@6.5.2,@codemirror/view@6.38.8";
      import { tags as t } from "https://esm.sh/@lezer/highlight@1.2.3?target=es2022";
      import { lintGutter, linter, setDiagnosticsEffect } from "https://esm.sh/@codemirror/lint@6.8.5?deps=@codemirror/state@6.5.2,@codemirror/view@6.38.8";
      // In-editor find/replace (⌘F / ⌘⌥F): the standard CodeMirror search

      import { languages as cmLanguages } from "https://esm.sh/@codemirror/language-data@6.5.1?deps=@codemirror/state@6.5.2,@codemirror/view@6.38.8,@codemirror/language@6.11.3";

      import { load as loadYaml, dump as dumpYaml } from "./vendor/js-yaml.mjs";
      import jsonata from "./vendor/jsonata.mjs";
      // Preact + htm (from the CDN, no build step) for the incremental UI
      // migration — panels move from manual DOM to declarative `html` components
      // one at a time. The /hooks subpath reuses this page's preact instance.

      import { useState, useRef, useEffect, useCallback } from "https://esm.sh/preact@10.24.3/hooks";

      // ── Bootstrap ─────────────────────────────────────────────────────
      const LS_SPLIT  = "stem-playground:splits.v3";
      const LS_TWEAKS = "stem-playground:tweaks";
      const LS_OUTLANG = "stem-playground:outlang";

      const qs   = (sel) => document.querySelector(sel);

      // Pick the engine adapter. The lab exposes the FlatBars dialects as
      // first-class engines — RawBars (no sugar) / FullBars (Handlebars-like) /
      // MaxBars (operators & pipes) — alongside MinBars (Mustache-like). The
      // former "FlatBars + Dialect" two-selector model is flattened into one
      // engine choice, and native Handlebars is dropped (FullBars fills the
      // Handlebars-like role). Every `create…()` returns the identical renderer
      // shape, so everything downstream stays engine-agnostic — the panel gate
      // (below) hides whatever the chosen engine doesn't back.
      const ENGINE_PARAM = (new URLSearchParams(location.search).get("engine") || "").toLowerCase();
      const DIALECT_PARAM = (new URLSearchParams(location.search).get("dialect") || "").toLowerCase();
      let ENGINE =
        ["rawbars", "raw", "core"].includes(ENGINE_PARAM) ? "rawbars"
        : ["minbars", "mustache"].includes(ENGINE_PARAM) ? "minbars"
        : ["fullbars", "full", "surface"].includes(ENGINE_PARAM) ? "fullbars"
        : ["maxbars", "max"].includes(ENGINE_PARAM) ? "maxbars"
        // back-compat: old `?engine=flatbars[&dialect=…]` links → dialect engine.

      const renderer = await createRenderer(ENGINE);

      const ENGINE_LABEL =
        ENGINE === "rawbars" ? "RawBars"
        : ENGINE === "fullbars" ? "FullBars"
        : ENGINE === "maxbars" ? "MaxBars"

      // is instantiated at boot), so it navigates with the new `?engine=` param
      // and reloads — preserving the rest of the URL, but dropping the now-defunct
      // `?dialect=` param (the dialect is implied by the engine).
      const engineSel = byId("engine-select");
      if (engineSel) {
        engineSel.value = ENGINE;
        engineSel.addEventListener("change", (e) => {

      // (`.stem`, `.rawbars`, `.mustache` for MinBars, `.hbs` for the
      // Handlebars-flavoured FullBars, `.maxbars`). Used wherever a file name is
      // displayed or downloaded. (The on-disk *example* files keep the catalog's
      // own extension — see the example loader — so this is purely the label.)
      const TEMPLATE_EXT =
        ({ rawbars: "rawbars", minbars: "mustache", fullbars: "hbs", maxbars: "maxbars" })[ENGINE] ||

      // The Markdown code-fence language for an exported template: only `mustache`
      // and `handlebars` are languages a Markdown highlighter knows, so MinBars

      const TEMPLATE_FENCE = ENGINE === "minbars" ? "mustache" : "handlebars";

      const engineBuiltins = renderer.allTransformers();
      const engineMeta     = renderer.engineInfo();

      // adapter the vector is full, so nothing hides; a thinner adapter (e.g.
      // Handlebars) advertises fewer features and the matching panels drop out.
      const engineFeatures = engineMeta.features || [];
      const tabVisible = (entry) => tabVisibleUnder(engineFeatures, entry && entry.requires);
      // Does the loaded engine advertise a single capability? (ADR-0020 Phase 2

      const engineHas = (name) => hasFeature(engineFeatures, name);
      // The example catalog is engine-appropriate: every dialect has its OWN
      // folder (no shared `handlebars/` fallback anymore). MinBars/RawBars/MaxBars

      // FullBars keeps its curated `examples/fullbars/` set; Stem ships its own.
      // Loading one engine's templates under another would produce syntax the
      // active engine can't parse, so the base follows the engine.
      const EXAMPLES_BASE = `./examples/${ENGINE}/`;
      const examples = await (await fetch(EXAMPLES_BASE + "examples.json")).json();

      // ── State ─────────────────────────────────────────────────────────
      let tabs        = [{ name: "main", source: "" }];
      let activeTabIdx = 0;
      let loadedExampleIdx = -1;      // which example is loaded (-1 = custom/edited)
      let exampleModified  = false;  // true when a loaded example has been edited

      let dataPaneMode = "data";
      let outputView   = "source";  // "source" (Plain Text) is the default landing view
      let allowScripts = true;       // HTML/Markdown preview always runs <script> in an isolated (null-origin) sandbox
      let escapeMode   = "";

      let minbarsCompat = true; // default mustacheJs (ADR-029); set by the config.yaml view + hash `mj`

      // transform: registerHelper(...) JS that extends the engine. A SEPARATE
      // editor (helpers.js), for every FlatBars dialect (RawBars/FullBars/MaxBars;
      // not MinBars). The source is evaluated and
      // run in a Worker (no DOM / no page access), never on the main thread, so a
      // shared workspace cannot deface or read the page (no consent prompt
      // needed). `run()` is synchronous, so the Worker renders OUT OF BAND: its
      // result is cached by input key and painted when fresh; a stale/absent
      // entry kicks off the async render (which re-runs once it lands).
      let helpersSrc = "";
      let helpersDirty = false;
      // i18n (ADR-029): catalog.yaml is the message DATA (a LOCALIZATION view,

      // in the Worker for RawBars/FullBars/MaxBars (not MinBars).
      let catalogSource = "";
      let catalogDirty = false;
      let labLocale = "en";

      // suppresses those paths' potential + miss findings. Empty ⇒ plain `analyze`.
      let labPathSchema = [];
      const helperSandbox = createHelperSandbox("./helpers-worker.mjs?v=5");
      let helperCache = { key: null, output: "", error: "" };
      let helperInFlight = null;
      function helperKey(tmpl, partials, data, src, catalog, locale, dialect) {

      }

      //   `dataTab`  — active view: "edit" | "context" | "ast"
      //   `dataFile` — which data file the Edit view shows: "data" | overlay name

      let dataFile     = "data";

      const isOverlayTab = (id) =>
        typeof id === "string" && id !== "data" && id !== "transform" &&
        !isInspectTab(id) && !!overlayByName(id);

      const activeTab = () => tabs[activeTabIdx];

      function partialsMap() {
        const map = {};

      // Template highlighting derives from the engine lexer (ADR-014): one

      // delimiter pair), on every dialect's tag boundaries, and on the clause
      // keywords ({{else}}/{{elif}}) the dialect treats as separators — none of

      // `isOperation` is the FULL prelude vocabulary (OPERATION_NAMES, the 97-op

      const flatbarsHighlighting = flatbarsHighlight({ ViewPlugin, Decoration }, ENGINE, (name) => opNameSet.has(name));

          class {
            constructor(view) { this.decorations = yamlDecorator.createDeco(view); }

        create() { return Decoration.none; },
        update(deco, tr) {

                ? Decoration.set([linkMark.range(e.value.from, e.value.to)])

        provide: (f) => EditorView.decorations.from(f),

        "&": { height: "100%" },
        ".cm-scroller": { overflow: "auto" }

      // for light backgrounds and is unreadable on the dark theme, so map the
      // grammar tags to the per-theme --tok-* variables instead. The tags come
      // from the same @lezer/highlight build the language packages use, so the
      // styleTags they declare resolve to these rules in both light and dark.
      const themeHighlight = HighlightStyle.define([
        { tag: t.comment, color: "var(--tok-cmt)", fontStyle: "italic" },
        { tag: [t.tagName, t.keyword, t.typeName, t.labelName], color: "var(--tok-tag)" },
        { tag: [t.attributeName, t.propertyName, t.definition(t.propertyName)], color: "var(--tok-key)" },
        { tag: [t.string, t.attributeValue, t.special(t.string)], color: "var(--tok-str)" },
        { tag: [t.number, t.bool, t.null, t.atom], color: "var(--tok-num)" },
        { tag: [t.angleBracket, t.punctuation, t.separator, t.meta], color: "var(--fg-muted)" },
        { tag: t.invalid, color: "var(--danger)" },

      // variables, strings, numbers, block comments, and operators. Token style
      // names map through themeHighlight (already in the editors' extensions).
      const jsonataLang = StreamLanguage.define({
        token(stream) {
          if (stream.match(/\/\*/)) {
            while (!stream.match(/\*\//) && !stream.eol()) stream.next();
            return "comment";
          }
          if (stream.match(/"(?:[^"\\]|\\.)*"/) || stream.match(/'(?:[^'\\]|\\.)*'/)) return "string";
          if (stream.match(/\$[a-zA-Z_]\w*/) || stream.match(/\$/)) return "keyword";
          if (stream.match(/-?\d+(\.\d+)?([eE][+-]?\d+)?/)) return "number";
          if (stream.match(/(?:true|false|null)\b/)) return "atom";
          if (stream.match(/[a-zA-Z_]\w*/)) return "variableName";
          if (stream.match(/[+\-*/%=<>!&|~?:^@.]+/)) return "operator";
          stream.next();
          return null;
        },
      });

      // helpers): keywords, strings/templates, numbers, line+block comments, and
      // operators. A StreamLanguage tokenizer in the same style as jsonataLang —
      // enough for a short helper script without pulling a full JS grammar.
      const JS_KEYWORDS =
        /^(?:const|let|var|function|return|if|else|for|of|in|while|switch|case|break|continue|new|typeof|instanceof|this|class|extends|try|catch|finally|throw|await|async|yield|delete|void|do|null|undefined|true|false)\b/;
      const jsLang = StreamLanguage.define({
        token(stream) {
          if (stream.match(/\/\//)) { stream.skipToEnd(); return "comment"; }
          if (stream.match(/\/\*/)) {
            while (!stream.match(/\*\//) && !stream.eol()) stream.next();
            return "comment";
          }
          if (stream.match(/"(?:[^"\\]|\\.)*"/) || stream.match(/'(?:[^'\\]|\\.)*'/) || stream.match(/`(?:[^`\\]|\\.)*`/)) return "string";
          if (stream.match(/(?:true|false|null|undefined)\b/)) return "atom";
          if (stream.match(JS_KEYWORDS)) return "keyword";
          if (stream.match(/-?\d+(\.\d+)?([eE][+-]?\d+)?/)) return "number";
          if (stream.match(/[a-zA-Z_$][\w$]*/)) return "variableName";
          if (stream.match(/[+\-*/%=<>!&|~?:^.]+/)) return "operator";

      // as keywords, quoted literals as strings, plus numbers and nil/bool atoms.
      const BC_KEYWORDS =
        /^(?:EMIT_TEXT|EMIT|IF|THEN|ELSE|EACH|WITH|DO|SCOPE|GET|ASSIGNS|ASSIGN|LOCAL|THIS|PARENT|ROOT|INDEX0|INDEX1|KEY|FIRST|LAST|LIT|CALL|ESCAPE|AS)\b/;

        token(stream) {
          if (stream.sol() && stream.match(/;.*/)) return "comment";

          if (stream.match(BC_KEYWORDS)) return "keyword";

      // paints a dim line decoration over the source range of each dead block

      const coverageField = StateField.define({
        create() { return Decoration.none; },
        update(deco, tr) {

        provide: (f) => EditorView.decorations.from(f),

      // Build the line-decoration set for a file's dead-coverage rows.

      // but at lower contrast.
      function buildCoverageDeco(source, rowsForFile) {

          if (r.executed || typeof r.start !== "number") continue;
          const [from, to] = byteRangeToCharRange(source, r.start, r.end);
          const cls = "cm-dead-line";

          // single offset and decorates the entire line containing it, so we
          // iterate every newline boundary inside the span.
          let cur = Math.min(from, total);
          while (cur <= to && cur <= total) {
            deco.push(Decoration.line({ class: cls }).range(cur));
            const nl = source.indexOf("\n", cur);
            if (nl === -1 || nl + 1 > to) break;
            cur = nl + 1;
          }

        deco.sort((a, b) => a.from - b.from);
        return Decoration.set(deco, true);
      }

      // The line-number gutter lives in a compartment so the Appearance toggle
      // can switch it on/off live (applyTweaks reconfigures both editors).
      const lineNumberComp = new Compartment();

      // transform (which lives at the far right of the tab strip). Language
      // support is compartmented so showActiveTab can swap HTML/Handlebars
      // for jsonataLang when the transform tab activates.

      // is YAML across all of them. The compartment is kept so `Appearance`
      // can refactor it in future, and to keep symmetry with templateLangComp.
      const dataLangComp = new Compartment();

      //   "tmpl"      — main or a partial (HTML + Handlebars highlighting)
      //   "transform" — the JSONata data→view-model transform (jsonataLang)
      let templateMode = "tmpl";
      const sharedExts = [
        // The line-number gutter AND the active-line gutter highlight both live

        // entirely (no empty reserved column). highlightActiveLine() (the row
        // background, not a gutter) stays always-on.
        lineNumberComp.of([lineNumbers(), highlightActiveLineGutter()]), highlightActiveLine(),
        bracketMatching(), syntaxHighlighting(themeHighlight),
        cmHistory(),
        // In-editor search panel + ⌘F / ⌘⌥F / F3 keymap. `top: true` docks
        // the panel above the editor (default is below, which collides with
        // the dock in our stacked layout). `searchKeymap` adds before
        // `defaultKeymap` so its bindings (Mod-f, Mod-Alt-f, F3, …) win.
        search({ top: true }),
        keymap.of([...searchKeymap, ...defaultKeymap, ...historyKeymap, indentWithTab]),
        fillTheme,
      ];

      const templateView = new EditorView({
        parent: byId("template-editor-container"),
        state: EditorState.create({
          doc: "",
          extensions: [
            ...sharedExts,
            templateLangComp.of([htmlLang(), flatbarsHighlighting]),
            linkHighlightField,
            coverageField,
            lintGutter(),
            linter(() => templateDiagnostics),
            EditorView.updateListener.of((u) => {
              if (u.docChanged && !isProgrammatic(u)) {
                const text = u.state.doc.toString();
                if (templateMode === "transform") {
                  transformSrc = text;
                  transformDirty = true;
                } else if (templateMode === "helpers") {
                  helpersSrc = text;
                  helpersDirty = true;
                } else {
                  activeTab().source = text;
                  tabs[activeTabIdx].dirty = true;
                }
                renderTabs();
                scheduleRun();
              }
              if (u.selectionSet) { userMovedCaret = true; updateStatusMeta(); syncOutputToCaret(); }
            }),
            EditorView.domEventHandlers({
              dblclick(e, view) {
                // Partial double-click navigation only applies to template
                // sources — the JSONata transform has no `{{> name}}` tags.
                if (templateMode !== "tmpl") return false;
                const pos = view.posAtCoords({ x: e.clientX, y: e.clientY });
                if (pos == null) return false;
                const name = partialNameAt(view.state.doc.toString(), pos);
                if (!name) return false;
                e.preventDefault();
                openOrCreatePartial(name);
                return true;
              }
            })
          ]
        })
      });

      const dataView = new EditorView({
        parent: byId("data-editor-container"),
        state: EditorState.create({
          doc: "",
          extensions: [
            ...sharedExts,
            dataLangComp.of([yaml(), yamlHighlighting]),
            EditorView.updateListener.of((u) => {
              if (u.docChanged && !isProgrammatic(u)) {
                const text = u.state.doc.toString();
                // Route by what the pane DISPLAYS, not activeView — the data pane
                // is shared by data/config/catalog (ADR-029 hardening).
                if (dataPaneMode === "config") {
                  applyConfigText(text);
                } else if (dataPaneMode === "catalog") {
                  catalogSource = text;
                  catalogDirty = true;
                  renderTabs();
                  scheduleRun();
                  saveHash();
                } else {
                  const overlay = overlayByName(dataFile);
                  if (overlay) {
                    overlay.source = text;
                    overlay.dirty = true;
                  } else {
                    yamlSrc = text;
                    yamlDirty = true;
                  }
                  renderDataTabs();
                  scheduleRun();
                }
              }
              if (u.selectionSet) updateStatusMeta();
            })
          ]
        })
      });

      // ── Output editor (read-only CodeMirror) ──────────────────────────
      // The Plain Text + Render Data views share one read-only editor: syntax
      // highlighting (language auto-switched per view/example) plus two decoration
      // layers — provenance (.seg marks tracing output->source) and the caret link
      // (.cm-out-linked, the run(s) the template caret produced).
      const outLangComp = new Compartment();
      const setProvenance = StateEffect.define();
      const provenanceField = StateField.define({
        create() { return Decoration.none; },
        update(deco, tr) {
          deco = deco.map(tr.changes);
          for (const e of tr.effects) if (e.is(setProvenance)) deco = e.value;
          return deco;
        },
        provide: (f) => EditorView.decorations.from(f),
      });
      const outLinkMark = Decoration.mark({ class: "cm-out-linked" });
      const setOutLink = StateEffect.define();
      const outLinkField = StateField.define({
        create() { return Decoration.none; },
        update(deco, tr) {
          deco = deco.map(tr.changes);
          for (const e of tr.effects) if (e.is(setOutLink)) deco = e.value;
          return deco;
        },
        provide: (f) => EditorView.decorations.from(f),
      });

      // Output hover-link layer (separate from the caret link above so the two
      // never clobber each other). A single segment that wraps across output
      // lines is rendered by CM as one `.seg` span PER visual line, so the old
      // CSS `.seg:hover` lit up only the line-fragment under the pointer. This
      // JS decoration spans the segment's whole from→to range, matching the
      // source-side highlight (setLinkHighlight) so both ends light up fully.
      const outHoverMark = Decoration.mark({ class: "cm-out-linked" });
      const setOutHover = StateEffect.define();
      const outHoverField = StateField.define({
        create() { return Decoration.none; },
        update(deco, tr) {
          deco = deco.map(tr.changes);
          for (const e of tr.effects) if (e.is(setOutHover)) deco = e.value;
          return deco;
        },
        provide: (f) => EditorView.decorations.from(f),
      });

      const outputEditor = new EditorView({
        parent: byId("output-text"),
        state: EditorState.create({
          doc: "",
          extensions: [
            lineNumberComp.of(lineNumbers()),
            syntaxHighlighting(themeHighlight),
            outLangComp.of([]),
            provenanceField,
            outLinkField,
            outHoverField,
            fillTheme,
            EditorState.readOnly.of(true),
            EditorView.editable.of(false),
            // Enter jumps from the cursor's run to its source (keyboard parity with
            // click); arrows/Home/End navigate via the default keymap.
            keymap.of([{ key: "Enter", run: jumpToSourceAtCursor }, ...defaultKeymap]),
          ],
        }),
      });

      // Marks editor doc swaps we make ourselves (tab switch, example load, hash
      // restore) so the update listeners can tell them apart from user typing and
      // skip the recompile those programmatic swaps don't warrant.
      const programmatic = Annotation.define();
      const isProgrammatic = (u) => u.transactions.some((tr) => tr.annotation(programmatic));

      function setEditorText(view, text) {
        const cur = view.state.doc.toString();
        if (cur !== text) {
          view.dispatch({
            changes: { from: 0, to: cur.length, insert: text },
            annotations: programmatic.of(true),
          });
        }
      }

      // Both editors are visible, so "active view" follows whichever has focus —
      // it drives the status bar, copy, and save actions.
      byId("template-editor-container").addEventListener("focusin", () => { activeView = "tmpl"; updateStatusMeta(); });
      // config.yaml is edited in this same pane; focusing it must NOT flip the view
      // to "data" (that routed config keystrokes into data.yaml, overwriting it).
      byId("data-editor-container").addEventListener("focusin", () => { activeView = dataPaneMode; updateStatusMeta(); });

      // ── Virtual file explorer ───────────────────────────────────────────
      // A type-grouped navigator over every editable file. It does not own any
      // state — it reflects tabs[] / dataOverlays[] / transform / config and
      // drives the existing select* functions + render-config popover, so the
      // tab strips stay authoritative (rename / add / inspectors live there).
      // Re-rendered from renderTabs() + renderDataTabs() (every structural and
      // active-tab change) and from updateRenderStatus() (config edits).
      const EXP_LS = "stem.explorer.collapsed";
      let expCollapsed = (() => {
        try { return new Set(JSON.parse(localStorage.getItem(EXP_LS) || "[]")); }
        catch { return new Set(); }
      })();
      function saveExpCollapsed() {
        try { localStorage.setItem(EXP_LS, JSON.stringify([...expCollapsed])); } catch {}
      }
      // When non-null, `renderExplorer` opens the matching row in inline-rename
      // mode after the tree is built. `addPartial` / `addOverlay` set this so a
      // freshly-created file lands ready to be named, in the explorer — no
      // detour through the editor tab.
      let pendingExpRename = null;
      // Set by beginExpRename's finish() so the immediate rebuild that follows an
      // explicit commit/cancel does NOT reopen the rename input (see finish()).
      let expRenameFinishing = false;
      // True while renderExplorer is rebuilding the tree. Tearing down a focused
      // `.exp-rename` input fires its blur listener synchronously; if that blur
      // committed and re-rendered, renderExplorer → finish → blur → renderExplorer
      // would recurse until the stack overflows. The blur listener checks this and
      // skips while a rebuild is in flight (a real click-away blur still commits).
      let renderingExplorer = false;
      // Which key starts an inline rename on a focused Explorer row. Mirrors the
      // host OS file managers: Enter on macOS (Finder), F2 on Windows/Linux. F2
      // is also accepted on macOS since it's the universal rename key and does no
      // harm there. The double-click affordance was dropped in favour of this.
      const IS_MAC = /mac|iphone|ipad/i.test(
        (navigator.platform || "") + " " + (navigator.userAgent || "")
      );
      const EXP_RENAME_KEYS = IS_MAC ? ["Enter", "F2"] : ["F2"];
      const EXP_ICONS = {
        stem: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L2.5 8 6 12.5"/><path d="M10 3.5L13.5 8 10 12.5"/></svg>',
        yaml: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="8" cy="4" rx="4.5" ry="1.8"/><path d="M3.5 4v8c0 1 2 1.8 4.5 1.8s4.5-.8 4.5-1.8V4"/><path d="M3.5 8c0 1 2 1.8 4.5 1.8s4.5-.8 4.5-1.8"/></svg>',
        fn:   '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13c0-7 .5-10 3-10 1 0 1.5.5 1.7 1.2"/><path d="M3.5 7.2h5"/></svg>',
        cfg:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.5 3.5l1.4 1.4M11.1 11.1l1.4 1.4M3.5 12.5l1.4-1.4M11.1 4.9l1.4-1.4"/></svg>',
      };
      const EXP_GROUP_KEYS = ["template", "partials", "data", "overlays", "transform", "helpers", "localization", "config"];

      function renderExplorer() {
        if (renderingExplorer) return; // re-entrancy guard (see renderingExplorer)
        renderingExplorer = true;
        try { renderExplorerImpl(); }
        finally { renderingExplorer = false; }
      }
      function renderExplorerImpl() {
        const tree = byId("explorer-tree");
        if (!tree) return;
        // If a rename input is currently open, treat its associated file as a
        // pending rename target for the rebuild so the tree refresh doesn't
        // close the edit mid-typing.
        const activeRename = tree.querySelector(".exp-rename");
        const activeRow = activeRename?.closest(".exp-row");
        const activeRenameFile = activeRow?._expFile;
        if (activeRenameFile?.renameValue && !pendingExpRename && !expRenameFinishing) {
          pendingExpRename = activeRenameFile.renameValue;
        }
        // One-shot: only the rebuild directly following finish() skips the reopen.
        expRenameFinishing = false;
        const tmplActive = activeView === "tmpl" && templateMode === "tmpl";
        const xfActive   = activeView === "tmpl" && templateMode === "transform";
        const hlpActive  = activeView === "tmpl" && templateMode === "helpers";
        const cfgNonDefault = !!escapeMode || !standalone || allowList !== null;

        const groups = [
          { key: "template", label: "TEMPLATE", files: [
            { icon: "stem", name: "main." + TEMPLATE_EXT, active: tmplActive && activeTabIdx === 0,
              dirty: !!(tabs[0] && tabs[0].dirty), title: "entry template", on: () => selectTemplateTab(0) },
          ]},
          { key: "partials", label: "PARTIALS", add: addPartial, addTitle: "New partial",
            files: tabs.slice(1).map((t, idx) => {
              const i = idx + 1;
              return { icon: "stem", name: (t.name || "(unnamed)") + "." + TEMPLATE_EXT,
                active: tmplActive && activeTabIdx === i, dirty: !!t.dirty,
                title: `partial · {{partial "${t.name}"}}`,
                on: () => selectTemplateTab(i),
                renameValue: t.name, onDelete: () => removeTab(i),
                onRename: (v) => {
                  v = v.trim();
                  if (!v || tabs.some((o, j) => j !== i && o.name === v)) return false;
                  const prev = t.name; t.name = v;
                  const k = openEditors.indexOf(prev); if (k >= 0) openEditors[k] = v;
                  markCustom(); renderTabs(); scheduleRun(); return true;
                } };
            })},
          { key: "data", label: "DATA", files: [
            { icon: "yaml", name: "data.yaml", active: activeView === "data" && dataTab === "edit" && dataFile === "data",
              dirty: yamlDirty, title: "root data context · @root", on: () => selectDataTab("data") },
          ]},
          { key: "overlays", label: "OVERLAYS", add: addOverlay, addTitle: "New overlay",
            files: dataOverlays.map((ov, oi) => (
              { icon: "yaml", name: ov.name + ".yaml",
                active: activeView === "data" && dataTab === "edit" && dataFile === ov.name, dirty: !!ov.dirty,
                title: `overlay · mounts at ${ov.name.replace(/\//g, ".")}`, on: () => selectDataTab(ov.name),
                renameValue: ov.name, onDelete: () => removeOverlay(oi),
                onRename: (v) => {
                  v = v.trim();
                  const err = validateOverlayName(v);
                  const collision = dataOverlays.some((o, j) => j !== oi && o.name === v);
                  if (err || collision) return false;
                  if (dataFile === ov.name) dataFile = v;
                  ov.name = v; ov.dirty = true; markCustom(); scheduleRun(); return true;
                } }
            ))},
          // The "Controller" editor. On the FullBars surface it is the custom-helper
          // file (registerHelper source, run in the Worker sandbox — ADR-018); on
          // The transform is a data → view-model preprocess (JSONata), all engines.
          { key: "transform", label: "TRANSFORM", files: [
            { icon: "fn",
              name: "transform.jsonata",
              active: xfActive, dirty: transformDirty,
              title: "data → view-model transform (JSONata)",
              on: () => selectTransformTab() },
          ]},
          // Custom helpers/operations (ADR-018; ADR-019 for the native dialects)
          // are a separate editor that extends the engine, not the data — available
          // for every FlatBars dialect (RawBars/FullBars/MaxBars), MinBars excluded
          // (Mustache is logic-less). The Worker routes to the dialect's registrar.
          ...(ENGINE !== "minbars" ? [{ key: "helpers", label: "HELPERS", files: [
            { icon: "fn",
              name: "helpers.js",
              active: hlpActive, dirty: helpersDirty,
              title: "custom helpers — registerHelper(name, fn[, arity]); runs in a sandboxed Worker (ADR-018)",
              on: () => selectHelpersTab() },
          ]}] : []),
          // i18n message catalog (ADR-029) — every surface except MinBars (no t there).
          ...(ENGINE === "minbars" ? [] : [{ key: "localization", label: "LOCALIZATION", files: [
            { icon: "yaml", name: "catalog.yaml", active: activeView === "catalog", dirty: catalogDirty,
              title: "i18n message catalog (locale → key → message); the locale is set in config.yaml",
              on: () => selectCatalogTab() },
          ]}]),
          { key: "config", label: "CONFIG", files: [
            { icon: "cfg", name: "config.yaml", active: activeView === "config", dirty: cfgNonDefault,
              title: "render config — escape · trim · allow-list · i18n locale · MinBars truthiness · analyse pathSchema",
              on: () => selectConfigTab() },
          ]},
        ];

        tree.innerHTML = "";
        for (const g of groups) {
          const collapsed = expCollapsed.has(g.key);
          const gh = document.createElement("div");
          gh.className = "exp-gh";
          gh.innerHTML =
            `<svg class="exp-caret${collapsed ? " closed" : ""}" viewBox="0 0 12 12"><path d="M3 2l5 4-5 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>` +
            `<span class="exp-glabel">${g.label}</span>`;
          // Addable groups get an always-visible ＋; the count is always last so
          // counts align in a consistent right-hand column across every group.
          if (g.add) {
            const add = document.createElement("button");
            add.className = "exp-add"; add.type = "button"; add.title = g.addTitle || "New"; add.textContent = "＋";
            add.addEventListener("click", (e) => { e.stopPropagation(); g.add(); });
            gh.append(add);
          }
          const count = document.createElement("span");
          count.className = "exp-count"; count.textContent = g.files.length;
          gh.append(count);
          gh.addEventListener("click", () => {
            if (expCollapsed.has(g.key)) expCollapsed.delete(g.key); else expCollapsed.add(g.key);
            saveExpCollapsed(); renderExplorer();
          });

          const rows = document.createElement("div");
          rows.className = "exp-rows"; rows.hidden = collapsed;
          if (g.files.length === 0) {
            const empty = document.createElement("div");
            empty.className = "exp-empty";
            empty.textContent = g.key === "partials" ? "No partials yet" : g.key === "overlays" ? "No overlays yet" : "—";
            rows.append(empty);
          }
          for (const f of g.files) {
            const row = document.createElement("div");
            row.className = "exp-row" + (f.active ? " active" : "");
            row.title = f.title || f.name;
            row._expFile = f; // pendingExpRename lookup walks rows by file descriptor
            const ico = document.createElement("span");
            ico.className = "exp-ico t-" + f.icon; ico.innerHTML = EXP_ICONS[f.icon];
            const nm = document.createElement("span");
            nm.className = "exp-name"; nm.textContent = f.name;
            row.append(ico, nm);
            // Highlight files modified from their original/default state: bold
            // name + a small neutral "M" marker (the old dirty ● dot was dropped;
            // this is the replacement). Driven by the same f.dirty flags.
            if (f.dirty) {
              row.classList.add("mod");
              const m = document.createElement("span");
              m.className = "exp-m"; m.textContent = "M"; m.title = "Modified";
              row.append(m);
            }
            // Inline filename rename for partials/overlays is keyboard-driven
            // (F2 on Windows/Linux, Enter on macOS) on the focused row — no
            // double-click. Renameable rows are focusable; opening one from the
            // Explorer keeps keyboard focus on the row (VS Code-style) so the
            // rename key works immediately. f.on() re-renders the tree, so after
            // it we re-focus whichever row ends up active.
            if (f.onRename) {
              row.tabIndex = 0;
              row.addEventListener("click", () => {
                f.on();
                tree.querySelector(".exp-row.active")?.focus();
              });
              row.addEventListener("keydown", (e) => {
                if (EXP_RENAME_KEYS.includes(e.key)) {
                  e.preventDefault();
                  const liveNm = (e.currentTarget).querySelector(".exp-name");
                  if (liveNm) beginExpRename(liveNm, f);
                }
              });
            } else {
              row.addEventListener("click", f.on);
            }
            // Delete the file (× on hover) — distinct from closing an editor tab.
            if (f.onDelete) {
              const del = document.createElement("button");
              del.className = "exp-del"; del.type = "button"; del.title = "Delete file"; del.textContent = "×";
              del.addEventListener("click", (e) => { e.stopPropagation(); f.onDelete(); });
              row.append(del);
            }
            rows.append(row);
          }
          tree.append(gh, rows);
        }

        // After the tree is built, if a create-flow asked us to start renaming
        // a specific file, find its row's name span and open it. Clears even
        // when the row isn't found so a stale request can't survive a re-render.
        if (pendingExpRename) {
          const want = pendingExpRename;
          pendingExpRename = null;
          const rows = tree.querySelectorAll(".exp-row");
          for (const row of rows) {
            const nm = row.querySelector(".exp-name");
            const f = row._expFile;
            if (nm && f && f.renameValue === want && f.onRename) {
              beginExpRename(nm, f);
              break;
            }
          }
        }
      }

      // Inline filename rename for an explorer row (partials / overlays). Swaps
      // the name label for a text input; Enter/blur commits via f.onRename (which
      // returns false to reject invalid/duplicate names), Esc cancels.
      function beginExpRename(nm, f) {
        const input = document.createElement("input");
        input.className = "exp-rename";
        input.value = f.renameValue;
        input.spellcheck = false;
        nm.replaceWith(input);
        input.focus(); input.select();
        let done = false;
        const finish = (save) => {
          if (done) return; done = true;
          if (save) f.onRename(input.value);
          renderExplorer();
        };
        input.addEventListener("click", (e) => e.stopPropagation());
        input.addEventListener("keydown", (e) => {
          // Enter commits, Escape cancels — both explicitly CLOSE the editor.
          // renderExplorer() captures a live `.exp-rename` at its top and re-arms
          // `pendingExpRename` so an incidental rebuild (the debounced run, or the
          // blur from selectDataTab's editor-focus during auto-open) keeps the edit
          // alive. But on an explicit Enter/Escape that same capture would
          // immediately REOPEN the input — so accepting the default name (Enter on
          // an unchanged name) or cancelling (Escape) looked like it did nothing.
          // The one-shot flag suppresses the reopen for this commit/cancel only; a
          // plain blur keeps the normal reopen behaviour (the auto-open dance).
          if (e.key === "Enter") { e.preventDefault(); expRenameFinishing = true; finish(true); }
          else if (e.key === "Escape") { e.preventDefault(); expRenameFinishing = true; finish(false); }
        });
        input.addEventListener("blur", () => finish(true));
      }

      // ── Tabs ──────────────────────────────────────────────────────────
      // A close-button (×) for an open-editor tab.
      function tabCloseBtn(onClose) {
        const x = document.createElement("span");
        x.className = "close"; x.title = "Close editor — the file stays in the explorer";
        x.textContent = "×";
        x.addEventListener("click", (e) => { e.stopPropagation(); onClose(); });
        return x;
      }

      // Repaint both editor tab strips (top = template + transform; bottom =
      // data + overlays + config) and the explorer. The two panes are visible at
      // once, each editing its own active file.
      function renderTabs() {
        renderTmplStrip();
        renderDataStrip();
        renderExplorer();
      }

      // TOP strip (#tmpl-tabs): the template files (main + partials) and the
      // `transform` controller — everything edited in `templateView`.
      function renderTmplStrip() {
        const bar = byId("tmpl-tabs");
        bar.innerHTML = "";
        for (const key of openEditors) {
          if (key === "transform") {
            const isTfm = activeView === "tmpl" && templateMode === "transform";
            const tfm = document.createElement("div");
            tfm.className = "tab tab-transform" + (isTfm ? " active" : "");
            tfm.title = "data → view-model transform (JSONata)";
            tfm.append(document.createTextNode("transform.jsonata"));
            tfm.addEventListener("click", selectTransformTab);
            tfm.append(tabCloseBtn(() => closeEditor("transform")));
            bar.append(tfm);
            continue;
          }
          if (key === "helpers") {
            const isHlp = activeView === "tmpl" && templateMode === "helpers";
            const hlp = document.createElement("div");
            hlp.className = "tab tab-transform" + (isHlp ? " active" : "");
            hlp.title = "custom helpers — registerHelper(name, fn[, arity]); runs in a sandboxed Worker (ADR-018)";
            hlp.append(document.createTextNode("helpers.js"));
            hlp.addEventListener("click", selectHelpersTab);
            hlp.append(tabCloseBtn(() => closeEditor("helpers")));
            bar.append(hlp);
            continue;
          }
          if (key === "config" || key === "catalog" || key === "data" || overlayByName(key)) continue; // bottom strip
          const i = key === "main" ? 0 : tabs.findIndex((t) => t.name === key);
          if (i < 0) continue; // a partial that no longer exists
          const tab = tabs[i];
          const isActive = activeView === "tmpl" && templateMode === "tmpl" && i === activeTabIdx;
          const t = document.createElement("div");
          t.className = "tab" + (isActive ? " active" : "") + (i === 0 ? " is-main" : "");
          t.title = i === 0 ? "entry template" : `partial · {{partial "${tab.name}"}}`;
          t.addEventListener("click", () => selectTemplateTab(i));
          // Tabs render as plain text — the strip is navigation only; rename lives
          // in the Explorer (PARTIALS group + the rename key).
          t.append(document.createTextNode(
            (i === 0 ? "main" : (tab.name || "(unnamed)")) + "." + TEMPLATE_EXT));
          t.append(tabCloseBtn(() => closeEditor(i === 0 ? "main" : tab.name)));
          bar.append(t);
        }
      }

      // BOTTOM strip (#data-tabs): data.yaml, overlays, and config.yaml —
      // everything edited in the YAML editor `dataView`.
      function renderDataStrip() {
        const bar = byId("data-tabs");
        if (!bar) return;
        bar.innerHTML = "";
        for (const key of openEditors) {
          if (key === "config") {
            const isActive = activeView === "config";
            const t = document.createElement("div");
            t.className = "tab tab-transform" + (isActive ? " active" : "");
            t.title = "render config — escape · trim · allow-list";
            t.append(document.createTextNode("config.yaml"));
            t.addEventListener("click", () => selectConfigTab());
            t.append(tabCloseBtn(() => closeEditor("config")));
            bar.append(t);
            continue;
          }
          if (key === "catalog") {
            const isActive = activeView === "catalog";
            const t = document.createElement("div");
            t.className = "tab tab-transform" + (isActive ? " active" : "");
            t.title = "i18n message catalog (locale → key → message)";
            t.append(document.createTextNode("catalog.yaml"));
            t.addEventListener("click", () => selectCatalogTab());
            t.append(tabCloseBtn(() => closeEditor("catalog")));
            bar.append(t);
            continue;
          }
          if (key !== "data" && !overlayByName(key)) continue; // top strip
          const isOv = key !== "data";
          const isActive = activeView === "data" && dataTab === "edit" && dataFile === key;
          const t = document.createElement("div");
          t.className = "tab" + (isActive ? " active" : "");
          t.title = isOv ? `overlay · mounts at ${key.replace(/\//g, ".")}` : "root data context · @root";
          t.addEventListener("click", () => selectDataTab(key));
          t.append(document.createTextNode(isOv ? key + ".yaml" : "data.yaml"));
          t.append(tabCloseBtn(() => closeEditor(key)));
          bar.append(t);
        }
      }

      // The Context Inspector / Syntax Tree inspectors now live in the
      // Diagnostics dock (see `dockTabs`); `renderDataInspect` re-renders the
      // dock so the active inspector follows the file / latest render.

      // ── Template open-editor helpers (VS Code-style tabs) ───────────────
      const tmplKeyForIndex = (i) => (i === 0 ? "main" : tabs[i].name);
      function ensureOpen(key) { if (!openEditors.includes(key)) openEditors.push(key); }

      // Auto-open every example file that carries content — "open all the files,
      // but only if not empty". `main` + `data` always open (the entry template
      // and the root @root context). Each partial, the transform, the helpers
      // source, and each data overlay open ONLY when non-empty, so an example's
      // blank scaffold files (e.g. an empty transform) stay closed and the tab
      // strips reflect only real content. Order: partials before transform/helpers
      // in the top strip; overlays after data in the bottom strip. Mirrors the
      // tutorial Open-in-Lab card, which likewise shows a pane only when filled.
      function autoOpenEditors() {
        const has = (s) => typeof s === "string" && s.trim() !== "";
        const open = ["main", "data"];
        tabs.forEach((t, i) => { if (i > 0 && has(t.source)) open.push(t.name); });
        if (has(transformSrc)) open.push("transform");
        if (has(helpersSrc)) open.push("helpers");
        for (const o of dataOverlays) if (has(o.source)) open.push(o.name);
        return open;
      }

      // Is `key` the currently-active editor? (Single edit pane — one active.)
      function isActiveKey(key) {
        if (key === "transform") return activeView === "tmpl" && templateMode === "transform";
        if (key === "helpers")   return activeView === "tmpl" && templateMode === "helpers";
        if (key === "config")    return activeView === "config";
        if (key === "catalog")   return activeView === "catalog";
        if (key === "data")      return activeView === "data" && dataTab === "edit" && dataFile === "data";
        if (key === "context" || key === "ast") return activeView === "data" && dataTab === key;
        if (key === "main")      return activeView === "tmpl" && templateMode === "tmpl" && activeTabIdx === 0;
        // partial or overlay name
        if (overlayByName(key))  return activeView === "data" && dataTab === "edit" && dataFile === key;
        return activeView === "tmpl" && templateMode === "tmpl" && tabs[activeTabIdx] && tabs[activeTabIdx].name === key;
      }

      // Activate an editor by key (used when closing the active one).
      function openKey(key) {
        if (key === "transform") return selectTransformTab();
        if (key === "helpers") return selectHelpersTab();
        if (key === "config") return selectConfigTab();
        if (key === "catalog") return selectCatalogTab();
        if (key === "main") return selectTemplateTab(0);
        if (key === "data") return selectDataTab("data");
        if (overlayByName(key)) return selectDataTab(key);
        const i = tabs.findIndex((t) => t.name === key);
        selectTemplateTab(i > 0 ? i : 0);
      }

      function selectTemplateTab(i) {
        templateMode = "tmpl";
        activeView = "tmpl"; activeTabIdx = i;
        ensureOpen(tmplKeyForIndex(i));
        showActiveTab();
      }

      // config.yaml — a first-class editor (opens in the edit pane, not a
      // popup). Reuses the YAML editor; edits are parsed + applied live, so the
      // render options stay in sync. Parse errors surface in the Problems dock.
      let configError = null;
      function selectConfigTab() {
        activeView = "config";
        ensureOpen("config");
        showConfigTab();
        updateStatusMeta();
      }
      function showConfigTab() {
        // config edits in the bottom (data) pane's `dataView`; the template pane
        // stays visible above it.
        byId("data-editor-container").hidden = false;
        // (Re)generate the YAML from the current render state on every open so the
        // buffer always reflects the live config.
        dataPaneMode = "config";
        setEditorText(dataView, buildConfigYaml());
        dataView.dispatch({ effects: dataLangComp.reconfigure([yaml(), yamlHighlighting]) });
        renderTabs();
      }

      // catalog.yaml (ADR-029) — the i18n message catalog, an authored YAML file
      // (unlike config.yaml it is not generated). Edited in the same data pane;
      // its source persists in `catalogSource` and feeds the t/number/… bag.
      function selectCatalogTab() {
        activeView = "catalog";
        ensureOpen("catalog");
        showCatalogTab();
        updateStatusMeta();
      }
      function showCatalogTab() {
        byId("data-editor-container").hidden = false;
        dataPaneMode = "catalog";
        setEditorText(dataView, catalogSource);
        dataView.dispatch({ effects: dataLangComp.reconfigure([yaml(), yamlHighlighting]) });
        renderTabs();
      }
      // Parse the config buffer; apply live when valid, else flag a Problems row.
      function applyConfigText(text) {
        const res = parseConfigYaml(text);
        if (!res.ok) {
          configError = res.error;
          dockProblems = [{ severity: "error", file: "config.yaml", line: 1, col: 1, message: res.error }];
          setError("config error: " + res.error);
          renderDock(); renderTabs();
          return;
        }
        configError = null;
        const v = res.value;
        escapeMode = v.escape; byId("escape-select").value = v.escape;
        standalone = v.trim;   byId("standalone-cb").checked = v.trim;
        allowList = v.allow; minbarsCompat = v.mustacheJs; labLocale = v.locale;
        labPathSchema = v.pathSchema;
        updateRenderStatus(); renderTabs();
        scheduleRun(); saveHash();
      }

      // Close an open editor (× on its tab). Removes it from the strip but keeps
      // the file in the explorer — reopen any time from there. Closing the last
      // editor leaves an empty pane (VS Code-style).
      function closeEditor(key) {
        const at = openEditors.indexOf(key);
        if (at < 0) return;
        const wasActive = isActiveKey(key);
        openEditors.splice(at, 1);
        if (!openEditors.length) { showEmptyEdit(); return; }
        if (wasActive) openKey(openEditors[Math.min(at, openEditors.length - 1)]);
        else renderTabs();
      }

      // No editors open: hide both edit surfaces, show a placeholder prompting
      // the user to pick a file from the Explorer.
      function showEmptyEdit() {
        // empties the TOP (template) pane only; the data pane stays visible.
        byId("template-editor-container").hidden = true;
        byId("edit-empty").hidden = false;
        activeView = null;
        renderTabs();
        updateStatusMeta();
      }

      const isInspectTab = (name) => name === "context" || name === "ast";

      // Select a data VIEW ("context"/"ast") or a data FILE ("data" / overlay
      // name). "transform" routes to the template pane (kept for older callers).
      function selectDataTab(name = "data") {
        if (name === "transform") { selectTransformTab(); return; }
        if (name === "context" || name === "ast") { // inspectors are dock tabs now
          dockActiveTab = name; if (byId("dock").hidden) setDockVisible(true); else renderDock();
          return;
        }
        activeView = "data";
        dataFile = (name === "data" || overlayByName(name)) ? name : "data";
        dataTab = "edit";
        ensureOpen(dataFile);
        showDataTab();
        dataView.focus();
        updateStatusMeta();
      }

      // The data files + inspector views now live in the single unified tab strip
      // (renderTabs). This alias keeps the existing callers working.
      function renderDataTabs() { renderTabs(); }

      // Create a new overlay with a unique default name and select its tab.
      function addOverlay() {
        let n = 1, name;
        do { name = "overlay" + n++; } while (overlayByName(name));
        dataOverlays.push({ name, source: "", dirty: false });
        markCustom();
        // Set before `selectDataTab` so the renderExplorer it triggers picks
        // up the pending rename target on the freshly built row.
        pendingExpRename = name;
        selectDataTab(name);
        scheduleRun();
      }

      // Remove the overlay at index `i`. The active tab falls back to
      // `data` if the removed overlay was the active one.
      function removeOverlay(i) {
        const ov = dataOverlays[i];
        if (!ov) return;
        if (!confirm(`Delete the "${ov.name}" overlay? This can't be undone.`)) return;
        const wasActive = dataFile === ov.name;
        dataOverlays.splice(i, 1);
        markCustom();
        if (wasActive) selectDataTab("data"); else { renderDataTabs(); scheduleRun(); }
      }

      // Show the active editable file in the single edit pane: the template
      // editor (templates/transform) or the YAML editor (data/overlays). The
      // read-only inspectors live in the Diagnostics dock (renderDataInspect → dock).
      function showDataTab() {
        // the bottom (data) pane is always visible alongside the template pane.
        byId("data-editor-container").hidden = false;
        dataPaneMode = "data";
        const overlay = overlayByName(dataFile);
        setEditorText(dataView, overlay ? overlay.source : yamlSrc);
        dataView.dispatch({
          effects: dataLangComp.reconfigure([yaml(), yamlHighlighting]),
        });
        renderTabs();
      }

      // Kept for callers (run(), tab switches) — the inspector is its own pane now.
      // Re-render the dock so its active inspector (Context Inspector / Syntax
      // Tree) follows the active file and latest render. Named for its callers.
      function renderDataInspect() { renderDock(); }
      function addPartial() {
        let n = 1, name;
        do { name = "partial" + n++; } while (tabs.some((t) => t.name === name));
        tabs.push({ name, source: "" });
        activeView = "tmpl"; activeTabIdx = tabs.length - 1;
        ensureOpen(name);
        markCustom();
        // Set before `showActiveTab` so the renderExplorer it triggers picks
        // up the pending rename target on the freshly built row.
        pendingExpRename = name;
        showActiveTab(); run(); // the partial set changed, so re-render
      }
      // Open an existing partial tab by name, or create a new one if absent.
      // Used by the double-click handler on {{> name}} tags in the template editor.
      function openOrCreatePartial(name) {
        const idx = tabs.findIndex((t, i) => i > 0 && t.name === name);
        if (idx >= 0) {
          selectTemplateTab(idx);
        } else {
          tabs.push({ name, source: "", dirty: false });
          activeView = "tmpl"; activeTabIdx = tabs.length - 1;
          ensureOpen(name);
          markCustom();
          showActiveTab(); run();
        }
      }
      function removeTab(i) {
        if (i === 0) return;
        if (!confirm(`Delete the "${tabs[i].name}" partial? This can't be undone.`)) return;
        const name = tabs[i].name;
        const wasActive = activeView === "tmpl" && templateMode === "tmpl" && activeTabIdx === i;
        const k = openEditors.indexOf(name); if (k >= 0) openEditors.splice(k, 1);
        if (activeTabIdx > i) activeTabIdx -= 1;
        tabs.splice(i, 1);
        markCustom();
        // Closing the active file falls back to the pinned entry template.
        if (wasActive) { activeTabIdx = 0; templateMode = "tmpl"; activeView = "tmpl"; }
        showActiveTab(); run(); // the partial set changed, so re-render
      }

      // Display the active tab in the template editor. Switching which source is
      // shown does not change the compiled program, so this never recompiles or
      // rebuilds the output — only callers that change the sources call run().
      function showActiveTab() {
        // Top pane shows the template surface; the data pane stays visible below.
        byId("template-editor-container").hidden = false;
        byId("edit-empty").hidden = true;
        if (templateMode === "transform") {
          // The transform is a data → view-model preprocess (JSONata), shown in
          // the template editor; it is engine-agnostic.
          setEditorText(templateView, transformSrc);
          templateView.dispatch({ effects: templateLangComp.reconfigure([jsonataLang]) });
          byId("sources-sub").textContent = "transform · JSONata";
        } else if (templateMode === "helpers") {
          // Custom helpers (ADR-018) — a fundamentally different thing from the
          // transform: registerHelper(...) JS that extends the engine, FullBars
          // only, run in the Worker sandbox.
          setEditorText(templateView, helpersSrc);
          templateView.dispatch({ effects: templateLangComp.reconfigure([jsLang]) });
          byId("sources-sub").textContent = "helpers · JS · registerHelper";
        } else {
          setEditorText(templateView, activeTab().source); // programmatic → no auto-run
          templateView.dispatch({
            effects: templateLangComp.reconfigure([htmlLang(), flatbarsHighlighting]),
          });
          byId("sources-sub").textContent = activeTabIdx === 0
            ? ""
            : `partial · referenced as {{partial "${activeTab().name}"}}`;
        }
        renderTabs();
        updateStatusMeta();
        caretLinkKey = null; syncOutputToCaret();
        refreshCoverageGutter(); // dead-branch decoration follows the active tab
        renderDataInspect(); // dock inspectors follow the active file (Syntax Tree, etc.)
      }

      // Activate the transform tab in the template pane. Symmetric with
      // selectTemplateTab(i) for normal template tabs.
      function selectTransformTab() {
        templateMode = "transform";
        activeView = "tmpl";
        ensureOpen("transform");
        showActiveTab();
      }

      // Activate the helpers.js editor (FullBars custom helpers, ADR-018) — a
      // separate editor from the transform.
      function selectHelpersTab() {
        templateMode = "helpers";
        activeView = "tmpl";
        ensureOpen("helpers");
        showActiveTab();
      }

      // Push the dead-branch decoration set onto the templateView for the file
      // currently shown there. Called on every run() and tab switch — the
      // coverage data may have changed (different data, different file), and
      // the decorations are file-scoped.
      function refreshCoverageGutter() {
        if (!templateView) return;
        const file = activeTab()?.name === undefined ? "main" : (activeTabIdx === 0 ? "main" : activeTab().name);
        const rows = lastCoverage.filter((r) => r.file === file);
        const source = templateView.state.doc.toString();
        templateView.dispatch({ effects: setCoverageEffect.of(buildCoverageDeco(source, rows)) });
      }

      // ── Compile + render ──────────────────────────────────────────────
      // Rewrite every `emit` instruction's escape mode in place. This walks the
      // stem-bc/v1 wire directly, so it is meaningful only for an engine that
      // declares `escape-modes` (ADR-0020): a program from an engine without
      // per-emit escape modes is not a stem-bc wire and must not be rewritten —
      // applyEscape is then a no-op and the render-config escape control has no
      // effect (Phase 2: neutralize the wire couplings).
      function applyEscape(program, mode) {
        if (!mode || !engineHas("escape-modes")) return program;
        const rewrite = (instructions) =>
          instructions.map((inst) => {
            const next = { ...inst };
            if (next.t === "emit") next.escape = mode;
            for (const key of ["then", "else", "body"]) {
              if (Array.isArray(next[key])) next[key] = rewrite(next[key]);
            }
            return next;
          });
        return { ...program, instructions: rewrite(program.instructions) };
      }

      // When scripting is off, a strict CSP (no scripts) is the inner boundary on
      // top of the same-origin sandbox. When the author opts into scripts, the
      // CSP is dropped — the isolated `allow-scripts` (null-origin) sandbox is the
      // boundary instead — so the rendered <script> actually runs.
      function previewDoc(body, allowScripts = false) {
        const cspMeta = allowScripts
          ? ""
          : '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src * data:; style-src \'unsafe-inline\'; font-src *;">';
        return (
          '<!doctype html><html><head><meta charset="utf-8">' +
          cspMeta +
          "<style>html,body{margin:0}body{font:13px/1.5 system-ui,sans-serif;padding:14px;color:#18181b;background:#fff}</style>" +
          `</head><body>${body}</body></html>`
        );
      }

      let lastOutput = "";
      let lastSegments = [];
      let lastData = null; // the post-transform data the template rendered (Render Data view)
      let lastSegViews = []; // [{from,to,file,kind,start,end}] — segment char ranges in the output editor
      let lastProgram = null; // the compiled wire program, for the Bytecode view
      let lastUsedTransformers = []; // ADR-0013 report: transformer names called by the compiled program
      let dockProblems = []; // diagnostics for the Problems tab, refreshed each run()
      let hadProblems = false; // tracks the 0->>0 transition so the dock auto-opens once
      // Dock tab id; the persisted activeTab (see panelState below) is folded
      // in inside restorePanels(), which runs after panelState exists.
      let dockActiveTab = "problems";
      // Per-run analyses populated by run() and consumed by the dock panels.
      // Risk taxonomy for built-in transformers (mirrors the cheat-sheet groups).
      // Used by the Capabilities panel and the Transformers v2 panel to colour
      // each call site. `default` is "always on" (no opt-in cost); `format` is
      // low risk (atomic string transforms); `transform` is medium (full-
      // collection traversals); `eval` opts into dynamic template rendering
      // (a data-scope disclosure risk — see ADR-0013).
      const TRANSFORMER_RISK = {
        // default group — always on, no opt-in
        escape_html: "default", escape_json: "default", json: "default", inspect: "default",
        default: "default", join: "default", log: "default", at: "default", slice: "default",
        first: "default", last: "default", take: "default", drop: "default", len: "default",
        lookup: "default", contains: "default", starts_with: "default", ends_with: "default",
        empty: "default", present: "default",
        // format group — low risk
        upcase: "format", downcase: "format", capitalize: "format", trim: "format",
        truncate: "format", replace: "format",
        // transform group — medium, audited
        split: "transform", reverse: "transform", sort: "transform", sort_by: "transform",
        map: "transform", filter: "transform", compact: "transform", uniq: "transform",
        flatten: "transform", group_by: "transform",
        // i18n group — low risk (delegates to host translator)
