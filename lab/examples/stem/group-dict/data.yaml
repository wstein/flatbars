table: events

# Schema columns — each has a name and a type token.
columns:
  - { name: id,          type: integer }
  - { name: title,       type: string  }
  - { name: starts_at,   type: timestamp }
  - { name: capacity,    type: integer }
  - { name: is_public,   type: boolean }
  - { name: price,       type: decimal }
  - { name: tags,        type: array   }
  - { name: metadata,    type: object  }
  - { name: venue_code,  type: unknown }

# Dictionary: type token → SQL DEFAULT expression.
# The "default" key is the implicit fallback for any unmapped type —
# no {{#if}} chain needed. In the Stem BEAM API this map can live as a
# Group.Dict so it stays with the template, not the data.
typeDefaults:
  integer:   "0"
  string:    "''"
  timestamp: "NOW()"
  boolean:   "FALSE"
  decimal:   "0.00"
  array:     "ARRAY[]::text[]"
  object:    "'{}'::jsonb"
  default:   "NULL"